<script>
const SUPABASE_URL='https://dqruzakkunkinecxxbny.supabase.co',SUPABASE_KEY='sb_publishable_igD9yDQ1KbazCNNUfnjk2Q_WBRY5J-6';
let sb=null,me=null,profile=null,stores=[],periodMode='month',rangeStart='',rangeEnd='',expanded={};
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), n=v=>Number(v||0), money=v=>'¥'+n(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}), today=()=>new Date().toISOString().slice(0,10), monthNow=()=>today().slice(0,7);
function msg(t,ok=false){const e=$('loginMsg');if(e){e.textContent=t;e.className=ok?'success':'error'}}
function init(){if(!window.supabase?.createClient){msg('系统组件加载失败，请刷新');return false}sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return true}
async function load(force=false){
 if(!sb) init();
 if(me&&profile&&stores.length&&!force)return;
 const {data:u,error:ue}=await sb.auth.getUser(); if(ue)throw ue; me=u.user; if(!me)throw Error('登录已失效');
 const {data:p,error:pe}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle(); if(pe)throw pe; if(!p)throw Error('账号资料不存在，请联系老板'); profile=p; if(p.enabled===false)throw Error('此账号已停用');
 if(p.role==='owner') { const {data:s,error:se}=await sb.from('stores').select('*').order('id'); if(se)throw se; stores=s||[]; }
 else { const {data:m,error:meErr}=await sb.from('store_members').select('store_id,share_percent').eq('user_id',me.id); if(meErr)throw meErr; const ids=(m||[]).map(x=>x.store_id); if(ids.length){const {data:s,error:se}=await sb.from('stores').select('*').in('id',ids).order('id');if(se)throw se;stores=s||[];}else stores=[]; }
}
async function login(){const a=$('loginAccount').value.trim(),p=$('loginPass').value;if(!a||!p){msg('请输入账号和密码');return}if(!sb&&!init())return;$('loginBtn').disabled=true;msg('正在登录…',true);try{const {data,error}=await sb.auth.signInWithPassword({email:a,password:p});if(error)throw error;await load();enter()}catch(e){await sb?.auth?.signOut();msg('登录失败：'+(e.message||'请检查账号和密码'))}finally{$('loginBtn').disabled=false}}
async function boot(){if(!init())return;try{const {data}=await sb.auth.getSession();if(data.session){await load();enter()}}catch(e){await sb.auth.signOut().catch(()=>{})}}
async function logout(){await sb.auth.signOut();location.reload()}
function enter(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=profile?.name||me.email;renderShell()}
function renderShell(){const owner=profile?.role==='owner';const title=owner?'老板后台':'股东中心';const menu=owner?'<button onclick="showDashboard()">门店总览</button><button class="secondary" onclick="showMonthly()">月度账单</button><button class="secondary" onclick="showReimbursements()">报销</button><button class="secondary" onclick="showPayback()">回本情况</button><button class="secondary" onclick="showPartners()">股东管理</button><button class="secondary" onclick="showStoresAdmin()">门店资料</button>':'<button onclick="showPartnerHome()">我的分红</button>';$("app").innerHTML=`<div class="card" style="margin-bottom:10px"><h2 style="margin:0">${title}</h2><div class="muted">${owner?'门店经营、账单、报销、回本及股东管理':'查看本人参与门店、股份及分红情况'} · V1.13</div></div><div class="actions">${menu}<button class="secondary" onclick="showAccount()">账号设置</button><button class="secondary" onclick="logout()">退出</button></div><div id="content"></div>`;owner?showDashboard():showPartnerHome()}
async function showPartnerHome(){const c=$("content");c.innerHTML='<div class="card">正在读取我的分红…</div>';try{const {data:m,error}=await sb.from('store_members').select('store_id,share_percent').eq('user_id',me.id).gt('share_percent',0);if(error)throw error;if(!(m||[]).length){c.innerHTML='<div class="card"><h2>我的分红</h2><p class="muted">老板还没有给你设置门店股份。</p></div>';return}const blocks=await Promise.all((m||[]).map(async mem=>{const s=stores.find(x=>x.id===mem.store_id);if(!s)return '';const {data:divs,error:de}=await sb.from('store_dividends').select('dividend_date,amount,note').eq('store_id',s.id).order('dividend_date',{ascending:false});if(de)throw de;const pct=n(mem.share_percent)/100;const rows=(divs||[]).map(x=>({...x,own:n(x.amount)*pct}));const thisMonth=rows.filter(x=>String(x.dividend_date).slice(0,7)===monthNow()).reduce((a,x)=>a+x.own,0);const total=rows.reduce((a,x)=>a+x.own,0);return `<div class="card"><h2>${esc(s.name)}</h2><div class="muted">我的股份：${n(mem.share_percent)}%</div><div class="stats" style="margin-top:12px"><div class="stat"><div class="muted">本月应得分红</div><div class="num positive">${money(thisMonth)}</div></div><div class="stat"><div class="muted">累计分红</div><div class="num positive">${money(total)}</div></div></div><h3>分红明细</h3>${rows.length?rows.map(x=>`<div class="row"><div>${esc(x.dividend_date)}</div><div>总分红 ${money(x.amount)}</div><div class="positive">我应得 ${money(x.own)}</div><div class="wide muted">${esc(x.note||'')}</div></div>`).join(''):'<div class="muted">暂无分红记录</div>'}</div>`}));c.innerHTML=blocks.join('')}catch(e){c.innerHTML='<div class="card error">读取失败：'+esc(e.message)+'</div>'}}
function periodControls(){return `<div class="card"><div class="actions"><button class="${periodMode==='month'?'':'secondary'}" onclick="setPeriod('month')">本月</button><button class="${periodMode==='year'?'':'secondary'}" onclick="setPeriod('year')">本年度</button><button class="${periodMode==='range'?'':'secondary'}" onclick="setPeriod('range')">月份范围</button><button class="${periodMode==='life'?'':'secondary'}" onclick="setPeriod('life')">开业至今</button></div>${periodMode==='range'?`<div class="grid" style="margin-top:10px"><div><div class="muted">开始月份</div><input id="rangeStart" type="month" value="${esc(rangeStart||monthNow())}"></div><div><div class="muted">结束月份</div><input id="rangeEnd" type="month" value="${esc(rangeEnd||monthNow())}"></div><div style="align-self:end"><button onclick="applyRange()">查询</button></div></div>`:''}</div>`}
function setPeriod(x){periodMode=x;showDashboard()}
function applyRange(){rangeStart=$('rangeStart').value;rangeEnd=$('rangeEnd').value;if(!rangeStart||!rangeEnd||rangeStart>rangeEnd){alert('请选择正确的月份范围');return}showDashboard()}
function periodBounds(store){const now=monthNow();if(periodMode==='month')return [now+'-01',nextMonth(now)+'-01'];if(periodMode==='year'){const y=new Date().getFullYear();return [`${y}-01-01`,`${y+1}-01-01`]}if(periodMode==='range'){const a=rangeStart||now,b=rangeEnd||now;return [a+'-01',nextMonth(b)+'-01']}return [String(store.opening_date||'0001-01-01').slice(0,10),null]}
async function fetchDashboardData(){
 const [ma,di]=await Promise.all([
  sb.from('monthly_accounts').select('store_id,month_date,turnover,company_return,rent,utilities,other_expenses').order('month_date'),
  sb.from('store_dividends').select('store_id,dividend_date,amount').order('dividend_date')

 if(ma.error)throw ma.error;if(di.error)throw di.error;
 return {monthly:ma.data||[],dividends:di.data||[]}
}
function inBounds(date,start,end){return (!start||date>=start)&&(!end||date<end)}
async function showDashboard(){const c=$('content');c.innerHTML='<div class="card">正在读取云端账务…</div>';try{await load(false);if(!stores.length){c.innerHTML='<div class="card"><h2>暂无门店</h2></div>';return}const all=await fetchDashboardData();const blocks=stores.map(s=>{const [start,end]=periodBounds(s);const rows=all.monthly.filter(r=>r.store_id===s.id&&inBounds(r.month_date,start,end));const divs=all.dividends.filter(r=>r.store_id===s.id&&inBounds(r.dividend_date,start,end));const sum=k=>rows.reduce((a,r)=>a+n(r[k]),0);const profit=rows.reduce((a,r)=>a+n(r.company_return)-n(r.rent)-n(r.utilities)-n(r.other_expenses),0);const dividends=divs.reduce((a,r)=>a+n(r.amount),0);const retained=profit-dividends;const open=expanded[s.id];return `<div class="card"><div class="actions" style="justify-content:space-between"><h2 style="margin:0">${esc(s.name)}</h2><button class="secondary" onclick="toggleStore(${s.id})">${open?'收起':'详情'}</button></div><div class="stats" style="margin-top:12px"><div class="stat"><div class="muted">营业额</div><div class="num">${money(sum('turnover'))}</div></div><div class="stat"><div class="muted">公司回款</div><div class="num">${money(sum('company_return'))}</div></div><div class="stat"><div class="muted">盈利</div><div class="num ${profit>=0?'positive':'negative'}">${money(profit)}</div></div></div><div class="stat"><div class="muted">门店留存</div><div class="num ${retained>=0?'positive':'negative'}">${money(retained)}</div></div></div>${open?storeDetailFromRows(s,rows,all.dividends.filter(r=>r.store_id===s.id&&inBounds(r.dividend_date,start,end))):''}</div>`}).join('');c.innerHTML=periodControls()+blocks}catch(e){c.innerHTML='<div class="card"><p class="error">读取失败：'+esc(e.message)+'</p></div>'}}
async function toggleStore(id){expanded[id]=!expanded[id];await showDashboard();if(expanded[id])loadStoreReimbursements(id)}
function storeDetailFromRows(s,rows,divs){const rent=rows.reduce((a,r)=>a+n(r.rent),0),utilities=rows.reduce((a,r)=>a+n(r.utilities),0),turnover=rows.reduce((a,r)=>a+n(r.turnover),0),profit=rows.reduce((a,r)=>a+n(r.company_return)-n(r.rent)-n(r.utilities)-n(r.other_expenses),0),dv=divs.reduce((a,r)=>a+n(r.amount),0);const months=rows.map(r=>`<div class="row"><div>${esc(String(r.month_date).slice(0,7))}</div><div>营业额 ${money(r.turnover)}<br>公司回款 ${money(r.company_return)}</div><div>盈利 ${money(n(r.company_return)-n(r.rent)-n(r.utilities)-n(r.other_expenses))}</div><div>房租 ${money(r.rent)}<br>水电 ${money(r.utilities)}<br>其他费用 ${money(r.other_expenses)}</div></div>`).join('');const summary=`<div class="grid"><div><b>营业额</b><div>${money(turnover)}</div></div><div><b>公司回款</b><div>${money(rows.reduce((a,r)=>a+n(r.company_return),0))}</div></div><div><b>房租</b><div>${money(rent)}</div></div><div><b>水电费</b><div>${money(utilities)}</div></div><div><b>其他费用</b><div>${money(rows.reduce((a,r)=>a+n(r.other_expenses),0))}</div></div><div><b>盈利</b><div>${money(profit)}</div></div><div><b>分红</b><div>${money(dv)}</div></div><div><b>门店留存</b><div>${money(profit-dv)}</div></div></div>`;return `<div style="margin-top:14px">${periodMode==='month'?`<h3>本月详细</h3>${months||'<div class="muted">本月暂无月度账单</div>'}`:`<h3>${periodMode==='year'?'本年度':'所选范围'}详细</h3>${summary}`}<h3>报销明细</h3><div id="detail_re_${s.id}" class="muted">正在读取报销…</div><button class="secondary" style="margin-top:8px" onclick="loadStoreReimbursements(${s.id})">刷新报销明细</button></div>`}
async function loadStoreReimbursements(storeId){const s=stores.find(x=>x.id===storeId);if(!s)return;const [start,end]=periodBounds(s);let q=sb.from('reimbursements').select('id,expense_date,amount,note,receipt_url,category_id').eq('store_id',storeId).order('expense_date',{ascending:false});if(start)q=q.gte('expense_date',start);if(end)q=q.lt('expense_date',end);const {data:re,error}=await q;if(error){alert(error.message);return}const ids=[...new Set((re||[]).map(x=>x.category_id).filter(Boolean))];let cats=[];if(ids.length){const {data}=await sb.from('reimbursement_categories').select('id,name').in('id',ids);cats=data||[]}const cmap=Object.fromEntries(cats.map(x=>[x.id,x.name]));const el=$('detail_re_'+storeId);if(el)el.innerHTML=(re||[]).length?(re||[]).map(x=>`<div class="row"><div>${esc(x.expense_date)}</div><div>${esc(cmap[x.category_id]||'其他')}</div><div>${money(x.amount)}</div><div>${x.receipt_url?`<a href="${esc(x.receipt_url)}" target="_blank">凭证</a>`:esc(x.note||'')}</div></div>`).join(''):'暂无报销记录'}
async function showMonthly(){const c=$('content');c.innerHTML='<div class="card">加载中…</div>';try{await load(false);const results=await Promise.all(stores.map(async s=>{const {data,error}=await sb.from('monthly_accounts').select('*').eq('store_id',s.id).order('month_date',{ascending:false});if(error)throw error;return {s,rows:data||[]}}));const all=results;c.innerHTML=`<div class="card"><h2>月度账单</h2><p class="muted">盈利 = 公司回款 − 房租 − 水电费 − 其他费用</p></div>${all.map(x=>`<div class="card"><h3>${esc(x.s.name)}</h3>${x.rows.length?x.rows.map(r=>`<div class="row"><div>${esc(String(r.month_date).slice(0,7))}</div><div>营业额 ${money(r.turnover)}</div><div>回款 ${money(r.company_return)}</div><div><button class="secondary" onclick="editMonthly(${x.s.id},'${String(r.month_date).slice(0,10)}')">编辑</button></div><div class="wide">盈利 <span class="${n(r.profit)>=0?'positive':'negative'}">${money(n(r.company_return)-n(r.rent)-n(r.utilities)-n(r.other_expenses))}</span></div></div>`).join(''):'<div class="muted">暂无月度账单</div>'}<button style="margin-top:12px" onclick="editMonthly(${x.s.id},'${monthNow()}-01')">新增/录入本月</button></div>`).join('')}`}catch(e){c.innerHTML='<div class="card error">'+esc(e.message)+'</div>'}}
async function editMonthly(storeId,date){const {data:r}=await sb.from('monthly_accounts').select('*').eq('store_id',storeId).eq('month_date',date).maybeSingle();const s=stores.find(x=>x.id===storeId);const d=String(date).slice(0,10);const ym=d.slice(0,7);const [y,m]=ym.split('-').map(Number);const prev=new Date(y,m-2,1);const prevYm=prev.toISOString().slice(0,7);const {data:prevRow}=await sb.from('monthly_accounts').select('month_date,utilities,utility_payer,utility_account,utility_paid').eq('store_id',storeId).eq('month_date',prevYm+'-01').maybeSingle();const prevStatus=prevRow?`上个月（${prevYm}）水电费：${money(prevRow.utilities)} · ${esc(prevRow.utility_payer||'未记录缴费方式')} · ${prevRow.utility_paid?'已缴':'未确认缴费'}`:`上个月（${prevYm}）还没有月度账单，请注意检查水电费是否漏填。`;modal('月度账单',`<div class="notice"><b>水电提醒：</b>${prevStatus}</div><div class="grid"><div><label>月份</label><input id="m_date" type="date" value="${esc(r?.month_date||date)}"></div><div><label>营业额</label><input id="m_turn" type="number" value="${n(r?.turnover)}"></div><div><label>公司回款</label><input id="m_ret" type="number" value="${n(r?.company_return)}"></div><div><label>房租</label><input id="m_rent" type="number" value="${n(r?.rent)}"></div><div><label>水电费</label><input id="m_util" type="number" value="${n(r?.utilities)}"></div><div><label>水电缴费方</label><select id="m_util_payer"><option value="">请选择</option><option value="房东">房东</option><option value="国家电网">国家电网</option><option value="其他">其他</option></select></div><div><label>缴费户号/对象</label><input id="m_util_account" value="${esc(r?.utility_account||'')}" placeholder="国家电网户号/房东收款说明"></div><div><label>是否已缴</label><select id="m_util_paid"><option value="false">未确认</option><option value="true">已缴</option></select></div><div><label>缴费日期</label><input id="m_util_date" type="date" value="${esc(r?.utility_payment_date||'')}"></div></div><br><label>水电备注</label><textarea id="m_util_note" placeholder="例如：房东统一收、国家电网本月已交">${esc(r?.utility_note||'')}</textarea><br><label>其他费用</label><input id async function saveMonthly(storeId,id){const d=$('m_date').value.slice(0,7)+'-01';const obj={store_id:storeId,month_date:d,turnover:n($('m_turn').value),company_return:n($('m_ret').value),rent:n($('m_rent').value),utilities:n($('m_util').value),utility_payer:$('m_util_payer').value||null,utility_account:$('m_util_account').value.trim()||null,utility_paid:$('m_util_paid').value==='true',utility_payment_date:$('m_util_date').value||null,utility_note:$('m_util_note').value.trim()||null,other_expenses:n($('m_other').value),profit:n($('m_ret').value)-n($('m_rent').value)-n($('m_util').value)-n($('m_other').value),retained:0,notes:$('m_note').value};const {error}=id?await sb.from('monthly_accounts').update(obj).eq('id',id):await sb.from('monthly_accounts').upsert(obj,{onConflict:'store_id,month_date'});if(error){alert('保存失败：'+error.message);return}closeModal();showMonthly()}

async function showPayback(){const c=$('content');c.innerHTML='<div class="card">加载中…</div>';const results=await Promise.all(stores.map(async s=>{const [{data:d,error:de},{data:t,error:te},{data:ma,error:meErr}]=await Promise.all([sb.from('store_dividends').select('dividend_date,amount,note').eq('store_id',s.id).order('dividend_date',{ascending:false}),sb.from('store_topups').select('topup_date,amount,note').eq('store_id',s.id).order('topup_date',{ascending:false}),sb.from('monthly_accounts').select('company_return,rent,utilities,other_expenses').eq('store_id',s.id)]);if(de)throw de;if(te)throw te;if(meErr)throw meErr;return {s,d:d||[],t:t||[],ma:ma||[]}}));const blocks=[];for(const x of results){const s=x.s,d=x.d,t=x.t,ma=x.ma;const top=(t||[]).reduce((a,x)=>a+n(x.amount),0),div=(d||[]).reduce((a,x)=>a+n(x.amount),0),remain=n(s.initial_investment)+top-div;const retained=(ma||[]).reduce((a,r)=>a+n(r.company_return)-n(r.rent)-n(r.utilities)-n(r.other_expenses),0)-div;blocks.push(`<div class="card"><h2>${esc(s.name)}</h2><div class="stats"><div class="stat">初始投入<div class="num">${money(s.initial_investment)}</div></div><div class="stat">累计补款<div class="num">${money(top)}</div></div><div class="stat">累积分红<div class="num">${money(div)}</div></div><div class="stat">剩余未回本<div class="num ${remain>=0?'positive':'negative'}">${money(remain)}</div></div><div class="stat">累计留存<div class="num ${retained>=0?'positive':'negative'}">${money(retained)}</div></div></div><h3>分红明细</h3>${(d||[]).map(x=>`<div class="row"><div>${esc(x.dividend_date)}</div><div>${money(x.amount)}</div><div>${esc(x.note||'')}</div></div>`).join('')||'<div class="muted">暂无分红</div>'}<div class="actions" style="margin-top:10px"><button onclick="addDividend(${s.id})">录入分红</button><button class="secondary" onclick="addTopup(${s.id})">录入补款</button></div></div>`)}c.innerHTML=blocks.join('')||'<div class="card">暂无门店</div>'}

async function saveStore(id){
  try{
    const num=v=>{const x=String(v??'').trim();return x===''?null:Number(x)};
    const val=k=>$(k)?.value??'';
    const obj={
      name:val('s_name').trim(),
      opening_date:val('s_open')||null,
      initial_investment:num(val('s_inv')),
      address:val('s_addr').trim()||null,
      manager_name:val('s_mgr').trim()||null,
      notes:val('s_note').trim()||null,
      rent_amount:num(val('s_rent')),
      rent_cycle:val('s_cycle').trim()||null,
      rent_payment_date:val('s_rpd')||null,
      rent_deposit:num(val('s_rd')),
      company_deposit:num(val('s_cd')),
      other_deposit:num(val('s_od')),
      other_deposits:num(val('s_ods')),
      contract_start_date:val('s_cs')||null,
      contract_end_date:val('s_ce')||null,
      contract_expiry_date:val('s_ce')||null,
      important_documents:val('s_docs').trim()||null
    };
    if(!obj.name){alert('请输入门店名称');return}
    if(!me?.id || profile?.role!=='owner'){alert('只有老板可以编辑门店');return}
    let q=id
      ? sb.from('stores').update(obj).eq('id',id).eq('owner_id',me.id).select('*').maybeSingle()
      : sb.from('stores').insert({...obj,owner_id:me.id}).select('*').maybeSingle();
    const {data,error}=await q;
    if(error) throw error;
    if(!data) throw new Error('没有更新到门店数据，请确认当前账号是老板且门店属于老板账号');
    const idx=stores.findIndex(x=>x.id===data.id);
    if(idx>=0) stores[idx]=data; else stores.push(data);
    closeModal();
    showStoresAdmin();
  }catch(e){
    console.error('saveStore',e);
    alert('门店保存失败：'+(e?.message||String(e)));
  }
}
