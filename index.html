eight:70px;background:#fff;border:1px solid #e2e5e9;border-radius:8px;padding:6px}.day .num{font-size:11px;color:#777}.day .amt{font-weight:700;margin-top:7px}.modalbg{position:fixed;inset:0;background:#0008;z-index:20;padding:14px;overflow:auto}.modal{max-width:650px;margin:5vh auto;background:#fff;border-radius:15px;padding:16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.check{display:flex;gap:6px;align-items:center;padding:7px;background:#f7f8fa;border-radius:8px}.check input{width:auto}.footer{text-align:center;color:#8b8f96;padding:25px 0}.login{max-width:430px;margin:10vh auto}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef0f3;font-size:12px}.proof{max-width:90px;max-height:70px;border-radius:7px;object-fit:cover;cursor:pointer}.notice{background:#fff7e6;border:1px solid #ffd591;padding:10px;border-radius:10px}.ok{background:#edf9f0;border:1px solid #b7e1c0;padding:10px;border-radius:10px}

</style></head><body>
<div id="login" class="wrap"><div class="card login"><h2>女装门店合伙账务</h2><p class="muted">云端登录</p><input id="account" placeholder="登录账号" autocomplete="username"><br><br><input id="password" type="password" placeholder="密码" autocomplete="current-password"><br><br><button id="loginBtn" style="width:100%">登录</button><button id="staffBtn" class="secondary" style="width:100%;margin-top:8px">门店员工入口</button><p id="loginMsg" class="red"></p></div></div>
<div id="app" class="hidden"></div><div id="modalRoot"></div>
<script>
const URL='https://dqruzakkunkinecxxbny.supabase.co',KEY='sb_publishable_igD9yDQ1KbazCNNUfnjk2Q_WBRY5J-6';
const sb=supabase.createClient(URL,KEY);let me=null,profile=null,mode='owner',stores=[],members=[],perms=[],staff=[],period={type:'month',month:ym(new Date())};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const ym=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function msg(t,ok=false){$('loginMsg').textContent=t;$('loginMsg').className=ok?'green':''}
function authEmail(a){return a.includes('@')?a:`${a.replace(/[^a-zA-Z0-9._-]/g,'_')}@login.local`}
async function login(){let a=$('account').value.trim(),p=$('password').value;if(!a||!p)return msg('请输入账号和密码');$('loginBtn').disabled=true;msg('登录中…');try{let r=await sb.auth.signInWithPassword({email:authEmail(a),password:p});if(r.error)throw r.error;await loadProfile();if(mode==='staff'&&profile.role!=='store_staff')throw Error('该账号不是员工账号');if(mode!=='staff'&&profile.role==='store_staff')throw Error('员工请使用“门店员工入口”');render()}catch(e){await sb.auth.signOut();msg('登录失败：'+(e.message||'请检查账号密码'))}finally{$('loginBtn').disabled=false}}
async function loadProfile(){me=(await sb.auth.getUser()).data.user;if(!me)throw Error('未登录');let r=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();if(r.error)throw r.error;if(!r.data||r.data.enabled===false)throw Error('账号已停用');profile=r.data}
async function init(){let s=await sb.auth.getSession();if(s.data.session){try{await loadProfile();render()}catch(e){await sb.auth.signOut()}}}
$('loginBtn').onclick=login;$('account').onkeydown=e=>{if(e.key==='Enter')login()};$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('staffBtn').onclick=()=>{mode='staff';$('staffBtn').textContent='当前：员工入口（再点切回老板/股东）';$('staffBtn').onclick=()=>{mode='owner';$('staffBtn').textContent='门店员工入口'}};
function render(){if(profile.role==='owner')renderOwner();else if(profile.role==='partner')renderPartner();else renderStaff();}
function shell(title,nav){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('app').innerHTML=`<div class="top"><div class="toprow"><div class="brand">${esc(title)}</div><div><button class="secondary" onclick="showAccount()">我的账号</button> <button onclick="logout()">退出</button></div></div><div class="nav">${nav}</div></div><main class="wrap" id="main"></main><div class="footer">版本：V2.00</div>`}
function nav(items){return items.map(x=>`<button class="secondary" onclick="${x[1]}">${x[0]}</button>`).join('')}
async function renderOwner(){shell('老板后台',nav([['门店总览','showOverview()'],['门店管理','showStores()'],['股东管理','showPartners()'],['员工管理','showStaff()'],['回本情况','showPayback()'],['数据备份','showBackup()']]));showOverview()}
async function renderPartner(){shell('股东后台',nav([['我的门店','showPartnerHome()'],['我的分红','showMyDividends()']]));showPartnerHome()}
async function renderStaff(){shell('员工后台',nav([['日业绩','showStaffCalendar()'],['我的账号','showAccount()']]));showStaffCalendar()}
async function logout(){await sb.auth.signOut();location.reload()}
async function getStores(){let r=await sb.from('stores').select('*').order('id');if(r.error)throw r.error;stores=r.data||[];return stores}
async function getMembers(){let r=await sb.from('store_members').select('*');if(r.error)throw r.error;members=r.data||[];return members}
async function getPerms(){let r=await sb.from('partner_permissions').select('*').eq('user_id',me.id);if(r.error)throw r.error;perms=r.data||[];return perms}
function perm(storeId,key){let p=perms.find(x=>x.store_id===storeId);return !!p?.['view_'+key]}
function activeStores(){return stores.filter(s=>profile.role==='owner'||members.some(m=>m.store_id===s.id&&m.user_id===me.id&&Number(m.share_percent)>0))}
function bounds(type=period.type){let d=new Date();if(type==='month'){let [y,m]=period.month.split('-').map(Number);return [period.month+'-01',new Date(y,m,0).toISOString().slice(0,10)]}if(type==='year'){return [d.getFullYear()+'-01-01',d.getFullYear()+'-12-31']}if(type==='life'){let dates=stores.map(s=>s.opening_date).filter(Boolean).sort();return [dates[0]||'2000-01-01',ymd(d)]}return [period.start,period.end]}
function periodUI(fn='refreshOverview'){return `<div class="card"><div class="tabs"><button class="${period.type==='month'?'active':''}" onclick="setPeriod('month')">本月</button><button class="${period.type==='year'?'active':''}" onclick="setPeriod('year')">本年度</button><button class="${period.type==='range'?'active':''}" onclick="setPeriod('range')">月份范围</button><button class="${period.type==='life'?'active':''}" onclick="setPeriod('life')">开业至今</button></div>${period.type==='month'?`<div style="margin-top:8px"><input type="month" id="pmonth" value="${period.month}" onchange="period.month=this.value;${fn}()"></div>`:''}${period.type==='range'?`<div class="formgrid" style="margin-top:8px"><input type="month" id="pstart" value="${period.start||ym(new Date())}" onchange="period.start=this.value+'-01';${fn}()"><input type="month" id="pend" value="${period.end?period.end.slice(0,7):ym(new Date())}" onchange="period.end=new Date(this.value.split('-')[0],Number(this.value.split('-')[1]),0).toISOString().slice(0,10);${fn}()"></div>`:''}</div>`}
function setPeriod(t){period.type=t;if(t==='range'){period.start=ym(new Date())+'-01';period.end=ymd(new Date())}showOverview()}
async function rows(table,cols='*',extra=q=>q){let r=await extra(sb.from(table).select(cols));if(r.error)throw r.error;return r.data||[]}
async function getFinancial(storeIds,start,end){let ids=storeIds.map(Number);let [ma,rb,dv,tp,ds]=await Promise.all([rows('monthly_accounts','*',q=>q.in('store_id',ids).gte('month_date',start).lte('month_date',end)),rows('reimbursements','*',q=>q.in('store_id',ids).gte('expense_date',start).lte('expense_date',end)),rows('store_dividends','*',q=>q.in('store_id',ids).gte('dividend_date',start).lte('dividend_date',end)),rows('store_topups','*',q=>q.in('store_id',ids).gte('topup_date',start).lte('topup_date',end)),rows('daily_sales','*',q=>q.in('store_id',ids).gte('sales_date',start).lte('sales_date',end))]);return {ma,rb,dv,tp,ds}}
function summarize(s,f){let id=s.id;let turnover=f.ds.filter(x=>x.store_id===id).reduce((a,x)=>a+Number(x.amount||0),0);let a=f.ma.filter(x=>x.store_id===id);let company=a.reduce((z,x)=>z+Number(x.company_return||0),0),rent=a.reduce((z,x)=>z+Number(x.rent||0),0),util=a.reduce((z,x)=>z+Number(x.utilities||0),0),other=a.reduce((z,x)=>z+Number(x.other_expenses||0),0),reim=f.rb.filter(x=>x.store_id===id).reduce((z,x)=>z+Number(x.amount||0),0),div=f.dv.filter(x=>x.store_id===id).reduce((z,x)=>z+Number(x.amount||0),0),top=f.tp.filter(x=>x.store_id===id).reduce((z,x)=>z+Number(x.amount||0),0);let profit=company-rent-util-other-reim;return {turnover,company,rent,util,other,reim,div,top,profit,retained:profit-div}}
async function showOverview(){if(profile.role!=='owner')return showPartnerHome();await getStores();let [st,en]=bounds();let f=await getFinancial(stores.map(s=>s.id),st,en);$('main').innerHTML=periodUI('showOverview')+`<div class="row between"><h3>门店总览</h3><span class="muted">${st} ～ ${en}</span></div>`+stores.map(s=>overviewCard(s,summarize(s,f),f)).join('')}
function overviewCard(s,x,f){let reims=f.rb.filter(r=>r.store_id===s.id).sort((a,b)=>String(b.expense_date).localeCompare(String(a.expense_date)));return `<div class="card"><div class="storehead"><div><div class="storetitle">${esc(s.name)}</div><div class="muted small">开业：${esc(s.opening_date||'-')}</div></div><button class="secondary" onclick="showStoreDetail(${s.id})">详情</button></div><div class="grid" style="margin-top:10px"><div class="metric">营业额<b>${money(x.turnover)}</b></div><div class="metric">公司回款<b>${money(x.company)}</b></div><div class="metric">盈利<b class="${x.profit<0?'green':'red'}">${money(x.profit)}</b></div><div class="metric">门店留存<b class="${x.retained<0?'green':''}">${money(x.retained)}</b></div></div><div class="detail"><div class="row between"><b>报销</b><b>${money(x.reim)}</b></div>${reims.length?`<div class="small muted">按日期/月份展开查看，避免长页面一次性铺开。</div>`:`<div class="muted">本周期无报销</div>`}</div></div>`}
async function showStoreDetail(id){await getStores();let s=stores.find(x=>x.id===id),[st,en]=bounds(),f=await getFinancial([id],st,en),x=summarize(s,f),reims=f.rb.sort((a,b)=>String(b.expense_date).localeCompare(String(a.expense_date)));$('main').innerHTML=periodUI(`showStoreDetail(${id})`)+`<div class="card"><div class="storetitle">${esc(s.name)}</div><div class="grid" style="margin-top:10px"><div class="metric">房租<b>${money(x.rent)}</b></div><div class="metric">水电费<b>${money(x.util)}</b></div><div class="metric">其他费用<b>${money(x.other)}</b></div><div class="metric">报销<b>${money(x.reim)}</b></div></div><h4>报销明细</h4>${expenseGrouped(reims)}</div>`}
function expenseGrouped(list){if(!list.length)return '<div class="muted">暂无报销明细</div>';let g={};list.forEach(r=>{let k=String(r.expense_date).slice(0,7);(g[k]??=[]).push(r)});return Object.keys(g).sort().reverse().map(k=>`<details><summary><b>${k}</b>　${money(g[k].reduce((a,r)=>a+Number(r.amount||0),0))}　· ${g[k].length}笔</summary>${g[k].map(r=>`<div class="expense-line"><div><b>${esc(r.expense_date)}</b><div class="small muted">${esc(r.note||'无备注')}</div>${r.receipt_url?`<a href="${esc(r.receipt_url)}" target="_blank"><img class="proof" src="${esc(r.receipt_url)}"></a>`:''}</div><b>${money(r.amount)}</b></div>`).join('')}</details>`).join('')}
function modal(title,html){$('modalRoot').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between"><h3>${esc(title)}</h3><button class="secondary" onclick="closeModal()">关闭</button></div>${html}</div></div>`}function closeModal(){$('modalRoot').innerHTML=''}
async function showStores(){await getStores();$('main').innerHTML=`<div class="row between"><h3>门店管理</h3><button onclick="editStore()">＋新增门店</button></div>`+stores.map(s=>`<div class="card"><div class="row between"><div><b>${esc(s.name)}</b><div class="small muted">开业 ${esc(s.opening_date||'-')} · 初始投入 ${money(s.initial_investment)}</div></div><button class="secondary" onclick="editStore(${s.id})">编辑</button></div></div>`).join('')}
async function editStore(id){let s=stores.find(x=>x.id===id)||{};modal(id?'编辑门店':'新增门店',`<div class="formgrid"><label>门店名称<input id="sn" value="${esc(s.name||'')}"></label><label>开业日期<input id="so" type="date" value="${esc(s.opening_date||'')}"></label><label>初始投入<input id="si" type="number" value="${s.initial_investment||0}"></label><label>地址<input id="sa" value="${esc(s.address||'')}"></label><label>负责人<input id="sm" value="${esc(s.manager_name||'')}"></label><label>租金<input id="sr" type="number" value="${s.rent_amount||0}"></label><label>租金周期<input id="sc" value="${esc(s.rent_cycle||'')}"></label><label>租金付款日<input id="spd" type="date" value="${esc(s.rent_payment_date||'')}"></label><label>租金押金<input id="sd" type="number" value="${s.rent_deposit||0}"></label><label>公司押金<input id="sdc" type="number" value="${s.company_deposit||0}"></label><label>其他押金<input id="sdo" type="number" value="${s.other_deposit||s.other_deposits||0}"></label><label>合同开始<input id="sct" type="date" value="${esc(s.contract_start_date||'')}"></label><label>合同到期<input id="sce" type="date" value="${esc(s.contract_expiry_date||s.contract_end_date||'')}"></label></div><br><label>备注<textarea id="snotes">${esc(s.notes||'')}</textarea></label><br><button onclick="saveStore(${id||'null'})">保存</button>`)}
async function saveStore(id){let data={owner_id:me.id,name:$('sn').value.trim(),opening_date:$('so').value,initial_investment:Number($('si').value||0),address:$('sa').value,manager_name:$('sm').value,rent_amount:Number($('sr').value||0),rent_cycle:$('sc').value,rent_payment_date:$('spd').value||null,rent_deposit:Number($('sd').value||0),company_deposit:Number($('sdc').value||0),other_deposit:Number($('sdo').value||0),contract_start_date:$('sct').value||null,contract_expiry_date:$('sce').value||null,notes:$('snotes').value};if(!data.name||!data.opening_date)return alert('门店名称和开业日期必填');let r=id?await sb.from('stores').update(data).eq('id',id):await sb.from('stores').insert(data);if(r.error)alert(r.error.message);else{closeModal();showStores()}}
async function showPartners(){await Promise.all([getStores(),getMembers()]);let r=await sb.from('profiles').select('*').eq('role','partner').order('created_at');if(r.error)throw r.error;$('main').innerHTML=`<div class="row between"><h3>股东管理</h3><button onclick="newPartner()">＋新增股东</button></div>`+(r.data||[]).map(p=>{let ms=members.filter(m=>m.user_id===p.id&&Number(m.share_percent)>0);return `<div class="card"><div class="row between"><div><b>${esc(p.name)}</b><div>账号：${esc(p.username||'-')}</div><div class="small">登录网站：${esc(location.href.split('#')[0])}</div><div class="small">${ms.map(m=>esc(stores.find(s=>s.id===m.store_id)?.name||m.store_id)+' '+m.share_percent+'%').join('　')||'未设置股份'}</div></div><div class="row"><button class="secondary" onclick="partnerShares('${p.id}')">股份/权限</button><button class="secondary" onclick="resetPwd('${p.id}')">重置密码</button><button class="secondary" onclick="togglePartner('${p.id}',${!!p.enabled})">${p.enabled?'停用':'启用'}</button></div></div></div>`}).join('')}
async function partnerAction(body){let r=await sb.functions.invoke('partner-admin',{body});if(r.error)throw r.error;if(!r.data?.ok)throw Error(r.data?.message||'操作失败');return r.data}
function newPartner(){modal('新增股东',`<div class="formgrid"><label>姓名<input id="pn"></label><label>登录账号<input id="pa"></label><label>初始密码<input id="pp" type="password"></label></div><br><button onclick="createPartner()">创建</button>`)}
async function createPartner(){try{let name=$('pn').value.trim(),account=$('pa').value.trim(),password=$('pp').value;if(!name||!account||password.length<6)throw Error('请填写姓名、账号，密码至少6位');let d=await partnerAction({action:'create',name,account,password});let url=location.href.split('#')[0];modal('股东账号已创建',`<div class="ok">账号：${esc(d.account||account)}<br>密码：${esc(password)}<br>登录网站：${esc(url)}</div><br><button onclick="copyText(${JSON.stringify((d.account||account)+'\n'+password+'\n'+url)})">老板一键复制账号＋密码＋网站</button><button class="secondary" onclick="closeModal();showPartners()">完成</button>`)}catch(e){alert(e.message||e)}}
async function partnerShares(uid){await Promise.all([getStores(),getMembers()]);let pr=await sb.from('partner_permissions').select('*').eq('user_id',uid);if(pr.error)throw pr.error;let pmap=pr.data||[],old=members.filter(m=>m.user_id===uid);let html=stores.map(s=>{let m=old.find(x=>x.store_id===s.id),pp=pmap.find(x=>x.store_id===s.id);return `<div class="card"><b>${esc(s.name)}</b><label>股份 %<input id="sh_${s.id}" type="number" min="0" max="100" step="0.01" value="${m?.share_percent||0}"></label><div class="checkgrid">${['turnover','company_return','rent','utilities','expenses','receipts','profit','retained','payback','dividends','contributions','contracts','initial_investment','history'].map(k=>`<label class="check"><input id="pm_${s.id}_${k}" type="checkbox" ${pp?.['view_'+k]?'checked':''}> ${k}</label>`).join('')}</div></div>`}).join('');modal('股份与权限',html+`<button onclick="savePartnerShares('${uid}')">保存全部</button>`)}
async function savePartnerShares(uid){try{for(const s of stores){let share=Number($('sh_'+s.id).value||0);await partnerAction({action:'set_share',user_id:uid,store_id:s.id,share_percent:share});if(share>0){let body={action:'set_permissions',user_id:uid,store_id:s.id};['turnover','company_return','rent','utilities','expenses','receipts','profit','retained','payback','dividends','contributions','contracts','initial_investment','history'].forEach(k=>body['view_'+k]=$("pm_"+s.id+"_"+k).checked);await partnerAction(body)}}closeModal();showPartners()}catch(e){alert(e.message||e)}}
async function resetPwd(uid){let p=await sb.from('profiles').select('name,username').eq('id',uid).maybeSingle();let n=prompt('正在重置【'+(p.data?.name||p.data?.username||'股东')+'】的登录密码，请输入新密码：');if(!n)return;if(n.length<6)return alert('密码至少6位');try{await partnerAction({action:'reset_password',user_id:uid,password:n});alert('密码已重置，请老板自行复制账号、密码、网站发送给对方。')}catch(e){alert(e.message||e)}}
async function togglePartner(uid,en){try{await partnerAction({action:'set_enabled',user_id:uid,enabled:!en});showPartners()}catch(e){alert(e.message||e)}}
async function showStaff(){await getStores();let r=await sb.from('store_staff').select('*');let ps=await sb.from('profiles').select('*').eq('role','store_staff');let map=(r.data||[]);$('main').innerHTML=`<div class="row between"><h3>员工管理</h3></div>`+stores.map(s=>{let x=map.find(a=>a.store_id===s.id),p=ps.data?.find(a=>a.id===x?.user_id);return `<div class="card"><b>${esc(s.name)}</b><div>员工：${esc(p?.name||'未创建')}</div><div>账号：${esc(p?.username||'-')}</div><div class="small">员工登录网站：${esc(location.href.split('#')[0]+'#staff')}</div><button class="secondary" onclick="${x&&p?`resetStaff('${p.id}')`:`newStaff(${s.id})`}">${x&&p?'重置密码':'创建员工账号'}</button></div>`}).join('')}
async function newStaff(storeId){modal('创建员工账号',`<label>姓名<input id="stn"></label><br><label>账号<input id="sta"></label><br><label>密码<input id="stp" type="password"></label><br><button onclick="createStaff(${storeId})">创建</button>`)}
async function createStaff(storeId){try{let name=$('stn').value.trim(),account=$('sta').value.trim(),password=$('stp').value;if(!name||!account||password.length<6)throw Error('请填写完整，密码至少6位');let d=await partnerAction({action:'create_staff',store_id:storeId,name,account,password});let url=location.href.split('#')[0]+'#staff';modal('员工账号已创建',`<div class="ok">账号：${esc(d.account||account)}<br>密码：${esc(password)}<br>员工登录网站：${esc(url)}</div><br><button onclick="copyText(${JSON.stringify((d.account||account)+'\n'+password+'\n'+url)})">老板一键复制账号＋密码＋网站</button><button class="secondary" onclick="closeModal();showStaff()">完成</button>`)}catch(e){alert(e.message||e)}}
async function resetStaff(uid){let p=prompt('输入员工新密码（至少6位）：');if(!p)return;if(p.length<6)return alert('密码至少6位');try{await partnerAction({action:'reset_staff',user_id:uid,password:p});alert('员工密码已重置')}catch(e){alert(e.message||e)}}
async function showPartnerHome(){await getStores();await getMembers();await getPerms();let ss=activeStores(),[st,en]=bounds();let f=await getFinancial(ss.map(s=>s.id),st,en),now=new Date(),monthKey=ym(now),yearKey=String(now.getFullYear()),divs=await sb.from('store_dividends').select('*').in('store_id',ss.map(s=>s.id)).gte('dividend_date',st).lte('dividend_date',en);if(divs.error)throw divs.error;let mine=divs.data||[],shareMap=new Map(ss.map(s=>[s.id,Number(members.find(m=>m.store_id===s.id&&m.user_id===me.id)?.share_percent||0)]));let mineTotal=mine.reduce((z,d)=>z+Number(d.amount||0)*(shareMap.get(d.store_id)||0)/100,0);let monthDiv=mine.filter(d=>String(d.dividend_date).slice(0,7)===monthKey).reduce((z,d)=>z+Number(d.amount||0)*(shareMap.get(d.store_id)||0)/100,0);let yearDiv=mine.filter(d=>String(d.dividend_date).slice(0,4)===yearKey).reduce((z,d)=>z+Number(d.amount||0)*(shareMap.get(d.store_id)||0)/100,0);$('main').innerHTML=periodUI('showPartnerHome')+`<div class="grid"><div class="metric">本月应得分红<b>${money(monthDiv)}</b></div><div class="metric">本月已实际分红<b>${money(monthDiv)}</b></div><div class="metric">本年度累计<b>${money(yearDiv)}</b></div><div class="metric">开业至今累计<b>${money(mineTotal)}</b></div></div><h3>我的门店</h3>`+ss.map(s=>partnerCard(s,summarize(s,f))).join('')}
function partnerCard(s,x){let cards=[];if(perm(s.id,'turnover'))cards.push(['营业额',x.turnover,'']);if(perm(s.id,'company_return'))cards.push(['公司回款',x.company,'']);if(perm(s.id,'rent'))cards.push(['房租',x.rent,'']);if(perm(s.id,'utilities'))cards.push(['水电费',x.util,'']);if(perm(s.id,'expenses'))cards.push(['报销',x.reim,'']);if(perm(s.id,'profit'))cards.push(['盈利',x.profit,x.profit<0?'green':'red']);if(perm(s.id,'retained'))cards.push(['门店留存',x.retained,x.retained<0?'green':'']);if(perm(s.id,'dividends'))cards.push(['分红',x.div,'']);return `<div class="card"><div class="row between"><b class="storetitle">${esc(s.name)}</b><button class="secondary" onclick="showPartnerStoreDetail(${s.id})">详情</button></div><div class="grid" style="margin-top:10px">${cards.map(c=>`<div class="metric">${c[0]}<b class="${c[2]}">${money(c[1])}</b></div>`).join('')}</div></div>`}
async function showPartnerStoreDetail(id){await getStores();await getMembers();await getPerms();let s=stores.find(x=>x.id===id),[st,en]=bounds(),f=await getFinancial([id],st,en),x=summarize(s,f);$('main').innerHTML=periodUI(`showPartnerStoreDetail(${id})`)+`<div class="card"><b class="storetitle">${esc(s.name)}</b><div class="grid" style="margin-top:10px">${[['rent','房租',x.rent],['utilities','水电费',x.util],['expenses','报销',x.reim],['profit','盈利',x.profit],['retained','门店留存',x.retained],['dividends','分红',x.div]].filter(c=>perm(id,c[0])).map(c=>`<div class="metric">${c[1]}<b>${money(c[2])}</b></div>`).join('')}</div>${perm(id,'expenses')?`<h4>报销明细</h4>${expenseGrouped(f.rb)}`:''}</div>`}
async function showMyDividends(){await getMembers();await getStores();let ms=members.filter(m=>m.user_id===me.id&&Number(m.share_percent)>0),ids=ms.map(m=>m.store_id),r=await sb.from('store_dividends').select('*').in('store_id',ids).order('dividend_date',{ascending:false});let all=r.data||[];$('main').innerHTML=`<h3>我的分红</h3><div class="grid"><div class="metric">本月应得<b>${money(calcPartnerDiv(all,ms,'month'))}</b></div><div class="metric">本月已实际分红<b>${money(calcPartnerDiv(all,ms,'month'))}</b></div><div class="metric">本年度累计<b>${money(calcPartnerDiv(all,ms,'year'))}</b></div><div class="metric">开业至今累计<b>${money(calcPartnerDiv(all,ms,'life'))}</b></div></div><div class="card"><h4>分红明细</h4>${all.map(d=>{let m=ms.find(x=>x.store_id===d.store_id);return `<div class="expense-line"><div>${esc(stores.find(s=>s.id===d.store_id)?.name||'')}<div class="small">${esc(d.dividend_date)}</div></div><b>${money(Number(d.amount||0)*Number(m?.share_percent||0)/100)}</b></div>`}).join('')||'<div class="muted">暂无分红</div>'}</div>`}
function calcPartnerDiv(all,ms,type){let now=new Date();return all.reduce((z,d)=>{let ok=type==='life'||(type==='month'&&String(d.dividend_date).slice(0,7)===ym(now))||(type==='year'&&String(d.dividend_date).slice(0,4)==now.getFullYear());let m=ms.find(x=>x.store_id===d.store_id);return z+(ok?Number(d.amount||0)*Number(m?.share_percent||0)/100:0)},0)}
async function showPayback(){await getStores();await getMembers();let ids=stores.map(s=>s.id),f=await getFinancial(ids,'2000-01-01',ymd(new Date()));$('main').innerHTML='<h3>回本情况</h3>'+stores.map(s=>{let x=summarize(s,f),top=Number(s.initial_investment||0)+x.top,div=x.div;return `<div class="card"><div class="row between"><b>${esc(s.name)}</b><button class="secondary" onclick="showPaybackDetail(${s.id})">详情</button></div><div class="grid"><div class="metric">初始投入<b>${money(s.initial_investment)}</b></div><div class="metric">累计补款<b>${money(x.top)}</b></div><div class="metric">累计分红<b>${money(div)}</b></div><div class="metric">剩余未回本<b>${money(top-div)}</b></div></div></div>`}).join('')}
async function showPaybackDetail(id){await getStores();let s=stores.find(x=>x.id===id),r=await sb.from('store_dividends').select('*').eq('store_id',id).order('dividend_date',{ascending:false});modal('回本详情',`<div>初始投入：${money(s.initial_investment)}</div><div class="detail">${(r.data||[]).map(d=>`<div class="expense-line"><span>${esc(d.dividend_date)}</span><b>${money(d.amount)}</b></div>`).join('')||'暂无分红记录'}</div>`)}
async function showAccount(){let url=location.href.split('#')[0]+(profile.role==='store_staff'?'#staff':'');$('main').innerHTML=`<div class="card"><h3>我的账号</h3><p>姓名：${esc(profile.name)}</p><p>登录账号：<b>${esc(profile.username||'-')}</b></p><p>登录网站：<b>${esc(url)}</b></p>${profile.role==='owner'?'<p class="muted">老板可在股东/员工创建或重置密码后自行复制发送。</p>':'<p class="muted">这里不设置复制按钮。</p>'}</div>`}
let prepared=null;
async function buildBackup(){await getStores();let ids=stores.map(s=>s.id);let tables=['stores','store_members','partner_permissions','store_staff','daily_sales','monthly_accounts','store_monthly','reimbursements','expenses','dividends','store_dividends','contributions','store_topups','profiles','expense_categories','reimbursement_categories'];let out={version:'V2.00',exported_at:new Date().toISOString(),data:{}};for(const t of tables){let r=await sb.from(t).select('*');if(!r.error)out.data[t]=r.data||[]}return out}
async function showBackup(){prepared=null;$('main').innerHTML='<div class="card"><h3>数据备份</h3><div class="notice">备份包含全部门店、历史账务、报销、分红、补款、员工、股东权限等云端数据。密码不会导出。</div><br><button id="backupBtn" onclick="downloadBackup()">下载全量 JSON 备份</button><button class="secondary" onclick="prepareBackup()">重新准备备份</button><p id="backupState" class="muted">正在准备……</p></div>';prepareBackup()}
async function prepareBackup(){try{$('backupState').textContent='正在读取云端数据……';prepared=await buildBackup();$('backupState').textContent='备份已准备好，可以直接点击下载。'}catch(e){$('backupState').textContent='准备失败：'+e.message}}
function downloadBackup(){if(!prepared)return alert('备份还未准备好，请稍候或点“重新准备备份”');let blob=new Blob([JSON.stringify(prepared,null,2)],{type:'application/json'}),file=new File([blob],'女装门店_全量备份_V2.00.json',{type:'application/json'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({title:'女装门店全量备份',files:[file]}).catch(()=>{})}else{let u=URL.createObjectURL(blob);let a=document.createElement('a');a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}}
function copyText(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('已复制')).catch(()=>fallbackCopy(t));else fallbackCopy(t)}function fallbackCopy(t){let x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();alert('已复制')}
async function showStaffCalendar(){let r=await sb.from('store_staff').select('*').eq('user_id',me.id).maybeSingle();if(r.error||!r.data)return $('main').innerHTML='<div class="card">未绑定门店。</div>';let storeId=r.data.store_id,m=period.month||ym(new Date()),[yy,mm]=m.split('-').map(Number),days=new Date(yy,mm,0).getDate(),start=m+'-01',end=m+'-'+String(days).padStart(2,'0');let q=await sb.from('daily_sales').select('*').eq('store_id',storeId).gte('sales_date',start).lte('sales_date',end);let data=q.data||[];$('main').innerHTML=`<div class="card"><div class="row between"><h3>日业绩</h3><input style="max-width:180px" type="month" value="${m}" onchange="period.month=this.value;showStaffCalendar()"></div><div class="calendar">${Array.from({length:days},(_,i)=>{let d=String(i+1).padStart(2,'0'),date=m+'-'+d,x=data.find(a=>a.sales_date===date);return `<div class="day" onclick="editDaily(${storeId},'${date}',${x?.amount||0})"><div class="num">${i+1}日</div><div class="amt">${x?money(x.amount):'<span class="muted">点击录入</span>'}</div></div>`}).join('')}</div></div>`}
function editDaily(storeId,date,amount){modal('录入日营业额',`<div>${esc(date)}</div><input id="da" type="number" step="0.01" value="${amount||''}" placeholder="营业额"><br><button onclick="saveDaily(${storeId},'${date}')">保存</button>`)}
async function saveDaily(storeId,date){let amount=Number($('da').value||0);let q=await sb.from('daily_sales').select('id').eq('store_id',storeId).eq('sales_date',date).maybeSingle();let r=q.data?await sb.from('daily_sales').update({amount,updated_at:new Date().toISOString()}).eq('id',q.data.id):await sb.from('daily_sales').insert({store_id:storeId,sales_date:date,amount});if(r.error)alert(r.error.message);else{closeModal();showStaffCalendar()}}
init();
</script></body></html>
