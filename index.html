 solid #eee0d4;padding:10px;border-radius:11px}.check input{width:auto}.small{font-size:12px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--dark);font-size:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:12px}.calhead{font-size:12px;text-align:center;color:var(--muted);padding:5px}.calday{background:linear-gradient(145deg,#fffdfa,#f6eee7);border:1px solid #eadfd5;border-radius:12px;min-height:72px;padding:8px;cursor:pointer;transition:.15s}.calday:hover{border-color:var(--accent);transform:translateY(-1px)}.calday .d{font-size:12px;color:var(--muted)}.calday .amt{font-size:12px;font-weight:750;margin-top:10px;color:var(--dark)}.calday.today{border:2px solid var(--accent);background:#fff5ed}.calday.empty{background:transparent;border:0;cursor:default}.staffbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.staffbar h2{font-size:21px}.login:before{content:"NUHUNS  ·  FASHION STORE";display:block;color:var(--accent);font-size:12px;letter-spacing:2px;font-weight:800;margin-bottom:12px}@media(max-width:650px){.wrap{padding:10px}.card{padding:14px;margin-bottom:11px;border-radius:17px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{padding:10px;border-radius:13px}.num{font-size:18px}.muted{font-size:12px}.row{grid-template-columns:1fr 1fr}.row .wide{grid-column:1/-1}.checkgrid{grid-template-columns:1fr}.calendar{gap:4px}.calday{min-height:66px;padding:6px}.calday .amt{font-size:10px;margin-top:7px}.staffbar{align-items:flex-start}.staffbar .secondary{white-space:nowrap;padding:8px 10px}.card h2{font-size:20px}.card h3{font-size:17px}}

<div id="login" class="wrap"><div class="card login"><h2>登录</h2><p class="muted">云端账号登录</p><input id="loginAccount" placeholder="登录账号" autocomplete="username"><br><br><input id="loginPass" type="password" placeholder="密码" autocomplete="current-password"><br><br><button id="loginBtn" style="width:100%">登录</button><button id="staffEntryBtn" class="secondary" style="width:100%;margin-top:8px" type="button">门店员工入口</button><p id="loginMsg" class="error"></p></div></div><div id="app" class="wrap hidden"></div><div id="modalRoot"></div><footer class="version">版本：V1.38</footer>
<script>
const SUPABASE_URL='https://dqruzakkunkinecxxbny.supabase.co',SUPABASE_KEY='sb_publishable_igD9yDQ1KbazCNNUfnjk2Q_WBRY5J-6';
let sb=null,me=null,profile=null,stores=[],periodMode='month',rangeStart='',rangeEnd='',expanded={},loginMode=location.hash==='#staff'?'staff':'normal',staffStore=null,staffRealtime=null,ownerRealtime=null,staffCalendarCollapsed=false,staffMonth='';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), n=v=>Number(v||0), money=v=>'¥'+n(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}), today=()=>new Date().toISOString().slice(0,10), monthNow=()=>today().slice(0,7);
function msg(t,ok=false){const e=$('loginMsg');if(e){e.textContent=t;e.className=ok?'success':'error'}}
function init(){if(!window.supabase?.createClient){msg('系统组件加载失败，请刷新');return false}if(!sb)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return true}
async function accountToAuthEmail(account){const a=String(account||'').trim();if(a.includes('@'))return a.toLowerCase();const bytes=new TextEncoder().encode(a);const hash=await crypto.subtle.digest('SHA-256',bytes);const hex=Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');return 'acct-'+hex+'@login.local'}
async function login(){const a=$('loginAccount').value.trim(),p=$('loginPass').value;if(!a||!p){msg('请输入账号和密码');return}if(!sb&&!init())return;$('loginBtn').disabled=true;msg('正在登录…',true);try{const authEmail=await accountToAuthEmail(a);const {data,error}=await sb.auth.signInWithPassword({email:authEmail,password:p});if(error)throw error;await load(true);if(loginMode==='staff'&&profile.role!=='store_staff')throw Error('这个账号不是门店员工账号，请使用老板/股东入口');if(loginMode!=='staff'&&profile.role==='store_staff')throw Error('请点击“门店员工入口”登录');enter()}catch(e){await sb?.auth?.signOut();msg('登录失败：'+(e.message||'请检查账号和密码'))}finally{$('loginBtn').disabled=false}}
async function boot(){if(!sb&&!init())return;try{const {data}=await sb.auth.getSession();if(data.session){await load();enter()}}catch(e){await sb.auth.signOut().catch(()=>{})}}
async function logout(){await sb.auth.signOut();location.reload()}
function enter(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=profile?.name||me.email;renderShell()}
function renderShell(){const role=profile?.role;if(role==='store_staff'){renderStaffShell();return}const owner=role==='owner';const title=owner?'老板后台':'股东中心';const menu=owner?'<button onclick="showDashboard()">门店总览</button><button class="secondary" onclick="showMonthly()">月度账单</button><button class="secondary" onclick="showReimbursements()">报销</button><button class="secondary" onclick="showPayback()">回本情况</button><button class="secondary" onclick="showPartners()">股东管理</button><button class="secondary" onclick="showStoresAdmin()">门店资料</button><button class="secondary" onclick="showBackup()">数据备份</button>':'<button onclick="showPartnerHome()">我的分红</button>';$('app').innerHTML=`<div class="card" style="margin-bottom:10px"><h2 style="margin:0">${title}</h2><div class="muted">${owner?'门店经营、账单、报销、回本及股东管理':'查看本人参与门店、股份及分红情况'} · V1.38</div></div><div class="actions">${menu}<button class="secondary" onclick="showAccount()">账号设置</button><button class="secondary" onclick="logout()">退出</button></div><div id="content"></div>`;owner?showDashboard():showPartnerHome()}
function renderStaffShell(){ $('app').innerHTML=`<div class="card"><h2 style="margin:0">${esc(staffStore?.name||'门店')} · 员工录入</h2><div class="muted">只可查看和录入本店当前月份每日营业额；每月自动切换到新月份</div></div><div class="actions"><button onclick="showStaffCalendar()">每日业绩</button><button class="secondary" onclick="showAccount()">账号设置</button><button class="secondary" onclick="logout()">退出</button></div><div id="content"></div>`;showStaffCalendar()}
async function showPartnerHome(){const c=$("content");c.innerHTML='<div class="card">正在读取我的分红…</div>';try{const {data:m,error}=await sb.from('store_members').select('store_id,share_percent').eq('user_id',me.id).gt('share_percent',0);if(error)throw error;const {data:perms,error:permErr}=await sb.from('partner_permissions').select('*').eq('user_id',me.id);if(permErr)throw permErr;const allowed=new Set((perms||[]).map(x=>Number(x.store_id)));const visible=(m||[]).filter(x=>allowed.has(Number(x.store_id)));if(!(visible||[]).length){c.innerHTML='<div class="card"><h2>我的分红</h2><p class="muted">老板还没有给你设置门店股份。</p></div>';return}const blocks=await Promise.all((visible||[]).map(async mem=>{const s=stores.find(x=>x.id===mem.store_id);if(!s)return '';const {data:divs,error:de}=await sb.from('v_store_dividends').select('dividend_date,amount,note').eq('store_id',s.id).order('dividend_date',{ascending:false});if(de)throw de;const pct=n(mem.share_percent)/100;const rows=(divs||[]).map(x=>({...x,own:n(x.amount)*pct}));const thisMonth=rows.filter(x=>String(x.dividend_date).slice(0,7)===monthNow()).reduce((a,x)=>a+x.own,0);const total=rows.reduce((a,x)=>a+x.own,0);return `<div class="card"><h2>${esc(s.name)}</h2><div class="muted">我的股份：${n(mem.share_percent)}%</div><div class="stats" style="margin-top:12px"><div class="stat"><div class="muted">本月应得分红</div><div class="num positive">${money(thisMonth)}</div></div><div class="stat"><div class="muted">累计分红</div><div class="num positive">${money(total)}</div></div></div><h3>分红明细</h3>${rows.length?rows.map(x=>`<div class="row"><div>${esc(x.dividend_date)}</div><div>总分红 ${money(x.amount)}</div><div class="positive">我应得 ${money(x.own)}</div><div class="wide muted">${esc(x.note||'')}</div></div>`).join(''):'<div class="muted">暂无分红记录</div>'}</div>`}));c.innerHTML=blocks.join('')}catch(e){c.innerHTML='<div class="card error">读取失败：'+esc(e.message)+'</div>'}}
async function showSalesCalendar(storeId){
 const s=stores.find(x=>x.id===Number(storeId)); if(!s){alert('门店不存在');return}
 const ym=monthNow(),first=new Date(ym+'-01T00:00:00'),year=first.getFullYear(),month=first.getMonth(),next=new Date(year,month+1,1);
 const {data,error}=await sb.from('daily_sales').select('sales_date,amount').eq('store_id',storeId).gte('sales_date',ym+'-01').lt('sales_date',next.toISOString().slice(0,10)).order('sales_date');
 if(error){alert('读取每日业绩失败：'+error.message);return}
 const map=Object.fromEntries((data||[]).map(x=>[x.sales_date,x]));
 const days=new Date(year,month+1,0).getDate(),offset=first.getDay(),head=['日','一','二','三','四','五','六'];
 let cells=head.map(x=>`<div class="calhead">${x}</div>`).join('');
 for(let i=0;i<offset;i++)cells+='<div class="calday empty"></div>';
 for(let d=1;d<=days;d++){const date=ym+'-'+String(d).padStart(2,'0'),r=map[date],isToday=date===today();cells+=`<div class="calday ${isToday?'today':''}"><div class="d">${d}日</div><div class="amt">${r?'¥'+n(r.amount).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}):'—'}</div></div>`}
 const total=(data||[]).reduce((a,x)=>a+n(x.amount),0);
 modal(`${esc(s.name)} · ${year}年${month+1}月每日营业额`,`<div class="notice">这里显示员工录入的每日营业额，老板端只查看，不重复录入。</div><div class="stat" style="margin-top:12px"><div class="muted">本月累计营业额</div><div class="num">¥${total.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}</div></div><div class="calendar" style="margin-top:12px">${cells}</div>`);
}
async function showStaffCalendar(){
 const c=$('content'); if(!staffStore){c.innerHTML='<div class="card error">没有绑定门店</div>';return}
 c.innerHTML='<div class="card">正在读取业绩…</div>';
 try{
  await load(false);
  const base=new Date(monthNow()+'-01T00:00:00');
  const allowed=[];
  for(let i=2;i>=0;i--){const d=new Date(base.getFullYear(),base.getMonth()-i,1);allowed.push(d.toISOString().slice(0,7))}
  if(!allowed.includes(staffMonth)) staffMonth=monthNow();
  const first=new Date(staffMonth+'-01T00:00:00'),year=first.getFullYear(),month=first.getMonth(),next=new Date(year,month+1,1);
  const {data,error}=await sb.from('daily_sales').select('id,sales_date,amount').eq('store_id',staffStore.id).gte('sales_date',staffMonth+'-01').lt('sales_date',next.toISOString().slice(0,10)).order('sales_date');
  if(error)throw error;
  const map=Object.fromEntries((data||[]).map(x=>[x.sales_date,x]));
  const days=new Date(year,month+1,0).getDate(),offset=first.getDay(),head=['日','一','二','三','四','五','六'];
  let cells=head.map(x=>`<div class="calhead">${x}</div>`).join('');
  for(let i=0;i<offset;i++)cells+='<div class="calday empty"></div>';
  for(let d=1;d<=days;d++){
   const date=staffMonth+'-'+String(d).padStart(2,'0'),r=map[date],isToday=date===today();
   cells+=`<div class="calday ${isToday?'today':''}" onclick="editDailySale('${date}',${r?JSON.stringify(r.amount):'null'})"><div class="d">${d}日</div><div class="amt">${r?'¥'+n(r.amount).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}):'点击录入'}</div></div>`
  }
  const total=(data||[]).reduce((a,x)=>a+n(x.amount),0);
  const options=allowed.map(m=>`<option value="${m}" ${m===staffMonth?'selected':''}>${m.slice(0,4)}年${Number(m.slice(5))}月</option>`).join('');
  c.innerHTML=`<div class="card"><div class="staffbar"><div><h2 style="margin:0">${year}年${month+1}月每日业绩</h2><div class="muted">默认可查看最近3个月；可以切换月份，录错也能回来修改。</div></div><button class="secondary" onclick="toggleStaffCalendar()">${staffCalendarCollapsed?'展开日历':'折叠日历'}</button></div><div style="margin-top:12px"><div class="muted">选择月份</div><select onchange="staffMonth=this.value;showStaffCalendar()">${options}</select></div><div class="stat" style="margin-top:12px"><div class="muted">${year}年${month+1}月累计营业额</div><div class="num">¥${total.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}</div></div><div id="staffCalendarBody" class="${staffCalendarCollapsed?'hidden':''}"><div class="calendar">${cells}</div></div></div>`;
  subscribeStaffRealtime();
 }catch(e){c.innerHTML='<div class="card error">读取失败：'+esc(e.message)+'</div>'}
}
function toggleStaffCalendar(){staffCalendarCollapsed=!staffCalendarCollapsed;showStaffCalendar()}
async function editDailySale(date,current){const v=prompt(`${date} 营业额（元）`,current==null?'':String(current));if(v===null)return;const amount=Number(String(v).trim());if(!Number.isFinite(amount)||amount<0){alert('请输入大于等于0的营业额');return}const {error}=await sb.from('daily_sales').upsert({store_id:staffStore.id,sales_date:date,amount},{onConflict:'store_id,sales_date'});if(error){alert('保存失败：'+error.message);return}await showStaffCalendar()}
function subscribeStaffRealtime(){if(staffRealtime||!sb||!staffStore)return;staffRealtime=sb.channel('daily-sales-'+staffStore.id).on('postgres_changes',{event:'*',schema:'public',table:'daily_sales',filter:'store_id=eq.'+staffStore.id},()=>showStaffCalendar()).subscribe()}
async function showStaffManagement(storeId){try{const {data,error}=await sb.from('store_staff').select('user_id').eq('store_id',storeId).maybeSingle();if(error)throw error;const store=stores.find(s=>s.id===Number(storeId));if(data){const {data:p}=await sb.from('profiles').select('name,username,enabled').eq('id',data.user_id).maybeSingle();modal('门店员工账号',`<div class="card"><b>${esc(store?.name||'')}</b><br>账号：${esc(p?.username||'')}<br>状态：${p?.enabled===false?'已停用':'正常'}</div><div class="actions"><button onclick="resetStaff('${data.user_id}')">重置密码</button><button class="secondary" onclick="toggleStaff('${data.user_id}',${p?.enabled!==false})">${p?.enabled===false?'恢复登录':'禁止登录'}</button><button class="danger" onclick="deleteStaff('${data.user_id}')">删除账号</button></div>`);return}modal('创建门店员工账号',`<div class="grid"><div><label>员工名称</label><input id="st_name" value="${esc(store?.name||'')}员工"></div><div><label>登录账号</label><input id="st_email" type="text" placeholder="例如：店员01、厦门一店"></div><div><label>初始密码</label><input id="st_pwd" type="text" minlength="6"></div></div><p class="muted">每家店只能有一个员工账号。员工只能进入员工入口，看本店当月每日业绩。</p><button onclick="saveStaff(${storeId})">创建账号</button>`)}catch(e){alert('读取员工账号失败：'+e.message)}}
async function saveStaff(storeId){const name=$('st_name').value.trim(),account=$('st_email').value.trim(),password=$('st_pwd').value;if(!name||!account||password.length<6){alert('请填写完整，密码至少6位');return}try{const d=await partnerAction({action:'create_staff',store_id:storeId,name,account,password});const url=location.href.split('#')[0]+'#staff';modal('员工账号已创建',`<div class="card">门店：${esc(d.store_name)}<br>账号：${esc(d.account)}<br>密码：${esc(password)}<br>员工入口：${esc(url)}</div><button onclick="copyText(${JSON.stringify(d.account+'\n'+password+'\n'+url)})">一键复制账号＋密码＋员工入口</button><button class="secondary" onclick="closeModal();showStoresAdmin()">完成</button>`)}catch(e){alert('创建失败：'+(e.message||e))}}
async function resetStaff(uid){const p=prompt('输入新密码（至少6位）：');if(!p)return;if(p.length<6){alert('密码至少6位');return}try{await partnerAction({action:'reset_staff',user_id:uid,password:p});alert('密码已重置');}catch(e){alert(e.message||e)}}
async function toggleStaff(uid,current){try{await partnerAction({action:'set_staff_enabled',user_id:uid,enabled:!current});closeModal();alert(current?'已禁止登录':'已恢复登录');showStoresAdmin()}catch(e){alert(e.message||e)}}
async function deleteStaff(uid){if(!confirm('确定删除这个门店员工账号吗？每日业绩数据不会删除。'))return;try{await partnerAction({action:'delete_staff',user_id:uid});closeModal();showStoresAdmin()}catch(e){alert(e.message||e)}}
function periodControls(){return `<div class="card"><div class="actions"><button class="${periodMode==='month'?'':'secondary'}" onclick="setPeriod('month')">本月</button><button class="${periodMode==='year'?'':'secondary'}" onclick="setPeriod('year')">本年度</button><button class="${periodMode==='range'?'':'secondary'}" onclick="setPeriod('range')">月份范围</button><button class="${periodMode==='life'?'':'secondary'}" onclick="setPeriod('life')">开业至今</button></div>${periodMode==='range'?`<div class="grid" style="margin-top:10px"><div><div class="muted">开始月份</div><input id="rangeStart" type="month" value="${esc(rangeStart||monthNow())}"></div><div><div class="muted">结束月份</div><input id="rangeEnd" type="month" value="${esc(rangeEnd||monthNow())}"></div><div style="align-self:end"><button onclick="applyRange()">查询</button></div></div>`:''}</div>`}
function setPeriod(x){periodMode=x;showDashboard()}
function applyRange(){rangeStart=$('rangeStart').value;rangeEnd=$('rangeEnd').value;if(!rangeStart||!rangeEnd||rangeStart>rangeEnd){alert('请选择正确的月份范围');return}showDashboard()}
function nextMonth(ym){
 const [y,m]=String(ym).split('-').map(Number);
 const d=new Date(y,m-1,1); d.setMonth(d.getMonth()+1);
 return d.toISOString().slice(0,7);
}
function modal(title,body){
 const root=$('modalRoot');
 if(!root) return;
 root.innerHTML=`<div class="modal" role="dialog" aria-modal="true" onclick="if(event.target===this)closeModal()">
   <div class="modalbox">
     <div class="actions" style="justify-content:space-between;align-items:center;margin-bottom:10px">
       <h2 style="margin:0">${esc(title||'')}</h2>
       <button class="secondary" type="button" onclick="closeModal()">关闭</button>
     </div>
     ${body||''}
   </div>
 </div>`;
}
function closeModal(){
 const root=$('modalRoot');
 if(root) root.innerHTML='';
}
function periodBounds(store){const now=monthNow();if(periodMode==='month')return [now+'-01',nextMonth(now)+'-01'];if(periodMode==='year'){const y=new Date().getFullYear();return [`${y}-01-01`,`${y+1}-01-01`]}if(periodMode==='range'){const a=rangeStart||now,b=rangeEnd||now;return [a+'-01',nextMonth(b)+'-01']}return [String(store.opening_date||'0001-01-01').slice(0,10),null]}
async function fetchDashboardData(){
 const [ma,di,ds,re]=await Promise.all([
  sb.from('v_monthly_accounts').select('store_id,month_date,company_return,rent,utilities,other_expenses').order('month_date'),
  sb.from('v_store_dividends').select('store_id,dividend_date,amount').order('dividend_date'),
  sb.from('daily_sales').select('store_id,sales_date,amount').order('sales_date'),
  sb.from('v_reimbursements').select('store_id,expense_date,amount,category_id,note,receipt_url').order('expense_date')
 ]);
 if(ma.error)throw ma.error;if(di.error)throw di.error;if(ds.error)throw ds.error;if(re.error)throw re.error;
 return {monthly:ma.data||[],dividends:di.data||[],dailySales:ds.data||[],reimbursements:re.data||[]}
}

function inBounds(date,start,end){return (!start||date>=start)&&(!end||date<end)}
function subscribeOwnerRealtime(){
 if(ownerRealtime||!sb||profile?.role!=='owner')return;
 ownerRealtime=sb.channel('owner-daily-sales')
  .on('postgres_changes',{event:'*',schema:'public',table:'daily_sales'},()=>{showDashboard();})
  .subscribe((status)=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){try{sb.removeChannel(ownerRealtime)}catch(e){} ownerRealtime=null;}});
}
async function showDashboard(){const c=$('content');c.innerHTML='<div class="card">正在读取云端账务…</div>';try{await load(false);if(!stores.length){c.innerHTML='<div class="card"><h2>暂无门店</h2></div>';return}const all=await fetchDashboardData();const blocks=stores.map(s=>{const [start,end]=periodBounds(s);const rows=all.monthly.filter(r=>r.store_id===s.id&&inBounds(r.month_date,start,end));const sales=all.dailySales.filter(r=>r.store_id===s.id&&inBounds(r.sales_date,start,end));const divs=all.dividends.filter(r=>r.store_id===s.id&&inBounds(r.dividend_date,start,end));const reimbursements=all.reimbursements.filter(r=>r.store_id===s.id&&inBounds(r.expense_date,start,end));const sum=k=>rows.reduce((a,r)=>a+n(r[k]),0);const turnover=sales.reduce((a,r)=>a+n(r.amount),0);const reimbursementTotal=reimbursements.reduce((a,r)=>a+n(r.amount),0);const profit=rows.reduce((a,r)=>a+n(r.company_return)-n(r.rent)-n(r.utilities)-n(r.other_expenses),0)-reimbursementTotal;const dividends=divs.reduce((a,r)=>a+n(r.amount),0);const lifeRows=all.monthly.filter(r=>r.store_id===s.id&&inBounds(r.month_date,String(s.opening_date||'0001-01-01').slice(0,10),null));const lifeSales=all.dailySales.filter(r=>r.store_id===s.id&&inBounds(r.sales_date,String(s.opening_date||'0001-01-01').slice(0,10),null));const lifeDivs=all.dividends.filter(r=>r.store_id===s.id&&inBounds(r.dividend_date,String(s.opening_date||'0001-01-01').slice(0,10),null));const lifeRe=all.reimbursements.filter(r=>r.store_id===s.id&&inBounds(r.expense_date,String(s.opening_date||'0001-01-01').slice(0,10),null));const lifeProfit=lifeRows.reduce((a,r)=>a+n(r.company_return)-n(r.rent)-n(r.utilities)-n(r.other_expenses),0)-lifeRe.reduce((a,r)=>a+n(r.amount),0);const lifeDividends=lifeDivs.reduce((a,r)=>a+n(r.amount),0);const lifeRetained=lifeProfit-lifeDividends;const open=expanded[s.id];return `<div class="card"><div class="actions" style="justify-content:space-between"><h2 style="margin:0">${esc(s.name)}</h2><button class="secondary" onclick="toggleStore(${s.id})">${open?'收起':'详情'}</button></div><div class="stats" style="margin-top:12px"><div class="stat"><div class="actions" style="justify-content:space-between;gap:5px"><div class="muted">营业额</div><button class="secondary" style="padding:5px 8px;font-size:12px" onclick="showSalesCalendar(${s.id})">打开日历</button></div><div class="num">${money(turnover)}</div></div><div class="stat"><div class="muted">公司回款</div><div class="num">${money(sum('company_return'))}</div></div><div class="stat"><div class="muted">报销</div><div class="num">${money(reimbursementTotal)}</div></div><div class="stat"><div class="muted">盈利</div><div class="num ${profit>=0?'positive':'negative'}">${money(profit)}</div></div></div><div class="stat"><div class="muted">门店留存</div><div class="num ${lifeRetained>=0?'positive':'negative'}">${money(lifeRetained)}</div></div>${open?storeDetailFromRows(s,rows,sales,divs,reimbursements,lifeRetained):''}</div>`}).join('');c.innerHTML=periodControls()+blocks;subscribeOwnerRealtime()}catch(e){c.innerHTML='<div class="card"><p class="error">读取失败：'+esc(e.message)+'</p></div>'}}

async function toggleStore(id){expanded[id]=!expanded[id];await showDashboard();if(expanded[id])loadStoreReimbursements(id)}
function storeDetailFromRows(s,rows,sales,divs,reimbursements=[],lifeRetained=0){const rent=rows.reduce((a,r)=>a+n(r.rent),0),utilities=rows.reduce((a,r)=>a+n(r.utilities),0),turnover=sales.reduce((a,r)=>a+n(r.amount),0),reTotal=reimbursements.reduce((a,r)=>a+n(r.amount),0),profit=rows.reduce((a,r)=>a+n(r.company_return)-n(r.rent)-n(r.utilities)-n(r.other_expenses),0)-reTotal,dv=divs.reduce((a,r)=>a+n(r.amount),0);const summary=`<div class="grid"><div><b>营业额</b><div>${money(turnover)}</div></div><div><b>公司回款</b><div>${money(rows.reduce((a,r)=>a+n(r.company_return),0))}</div></div><div><b>房租</b><div>${money(rent)}</div></div><div><b>水电费</b><div>${money(utilities)}</div></div><div><b>其他费用</b><div>${money(rows.reduce((a,r)=>a+n(r.other_expenses),0))}</div></div><div><b>报销</b><div>${money(reTotal)}</div></div><div><b>盈利</b><div class="${profit>=0?'positive':'negative'}">${money(profit)}</div></div><div><b>分红</b><div>${money(dv)}</div></div><div><b>门店留存（开业至今）</b><div class="${lifeRetained>=0?'positive':'negative'}">${money(lifeRetained)}</div></div></div>`;return `<div style="margin-top:14px"><h3>${periodMode==='month'?'本月详细':periodMode==='year'?'本年度详细':periodMode==='range'?'所选范围详细':'开业至今详细'}</h3>${summary}<h3>报销明细</h3><div id="detail_re_${s.id}" class="muted">正在读取报销…</div><button class="secondary" style="margin-top:8px" onclick="loadStoreReimbursements(${s.id})">刷新报销明细</button></div>`}

async function loadStoreReimbursements(storeId){const s=stores.find(x=>x.id===storeId);if(!s)return;const [start,end]=periodBounds(s);let q=sb.from('v_reimbursements').select('id,expense_date,amount,note,receipt_url,category_id').eq('store_id',storeId).order('expense_date',{ascending:false});if(start)q=q.gte('expense_date',start);if(end)q=q.lt('expense_date',end);const {data:re,error}=await q;if(error){alert(error.message);return}const ids=[...new Set((re||[]).map(x=>x.category_id).filter(Boolean))];let cats=[];if(ids.length){const {data}=await sb.from('reimbursement_categories').select('id,name').in('id',ids);cats=data||[]}const cmap=Object.fromEntries(cats.map(x=>[x.id,x.name]));const el=$('detail_re_'+storeId);if(el)el.innerHTML=(re||[]).length?(re||[]).map(x=>`<div class="row"><div>${esc(x.expense_date)}</div><div>${esc(cmap[x.category_id]||'其他')}</div><div>${money(x.amount)}</div><div>${x.receipt_url?`<a href="${esc(x.receipt_url)}" target="_blank">凭证</a>`:esc(x.note||'')}</div></div>`).join(''):'暂无报销记录'}
async function load(force=false){
 if(!sb) init();
 if(me&&profile&&stores.length&&!force)return;
 const {data:u,error:ue}=await sb.auth.getUser(); if(ue)throw ue; me=u.user; if(!me)throw Error('登录已失效');
 const {data:p,error:pe}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle(); if(pe)throw pe; if(!p)throw Error('账号资料不存在，请联系老板'); profile=p; if(p.enabled===false)throw Error('此账号已停用');
 if(p.role==='owner') { const {data:s,error:se}=await sb.from('v_stores').select('*').order('id'); if(se)throw se; stores=s||[]; }
 else if(p.role==='store_staff') { const {data:ss,error:sse}=await sb.rpc('get_staff_store'); if(sse)throw sse; if(!ss?.length)throw Error('员工账号没有绑定门店'); staffStore={id:Number(ss[0].store_id),name:ss[0].store_name}; stores=[staffStore]; }
 else { const {data:m,error:meErr}=await sb.from('store_members').select('store_id,share_percent').eq('user_id',me.id); if(meErr)throw meErr; const ids=(m||[]).map(x=>x.store_id); if(ids.length){const {data:s,error:se}=await sb.from('v_stores').select('*').in('id',ids).order('id');if(se)throw se;stores=s||[];}else stores=[]; }
}
async function showMonthly(){const c=$('content');c.innerHTML='<div class="card">加载中…</div>';try{await load(false);const results=await Promise.all(stores.map(async s=>{const [{data:rows,error},{data:sales,error:se},{data:reimbursements,error:reErr}]=await Promise.all([sb.from('v_monthly_accounts').select('*').eq('store_id',s.id).order('month_date',{ascending:false}),sb.from('daily_sales').select('sales_date,amount').eq('store_id',s.id).order('sales_date',{ascending:false}),sb.from('v_reimbursements').select('expense_date,amount,category_id').eq('store_id',s.id).order('expense_date',{ascending:false})]);if(error)throw error;if(se)throw se;if(reErr)throw reErr;const map=new Map((rows||[]).map(r=>[String(r.month_date).slice(0,7),r]));(sales||[]).forEach(z=>{const ym=String(z.sales_date).slice(0,7);if(!map.has(ym))map.set(ym,null)});(reimbursements||[]).forEach(z=>{const ym=String(z.expense_date).slice(0,7);if(!map.has(ym))map.set(ym,null)});const months=[...map.keys()].sort((a,b)=>b.localeCompare(a));return {s,rows:rows||[],sales:sales||[],reimbursements:reimbursements||[],map,months}}));c.innerHTML=`<div class="card"><h2>月度账单</h2><p class="muted">营业额由员工每日业绩自动汇总；盈利 = 公司回款 − 房租 − 水电费 − 其他费用 − 报销 − 报销</p></div>${results.map(x=>`<div class="card"><h3>${esc(x.s.name)}</h3>${x.months.length?x.months.map(ym=>{const r=x.map.get(ym);const reimbursementTotal=x.reimbursements.filter(z=>String(z.expense_date).slice(0,7)===ym).reduce((a,z)=>a+n(z.amount),0);const turnover=x.sales.filter(z=>String(z.sales_date).slice(0,7)===ym).reduce((a,z)=>a+n(z.amount),0);const profit=r?n(r.company_return)-n(r.rent)-n(r.utilities)-n(r.other_expenses)-reimbursementTotal:0;return `<div class="row"><div>${esc(ym)}</div><div>营业额 ${money(turnover)}</div><div>回款 ${money(r?.company_return||0)}</div><div>${r?'<button class="secondary" onclick="editMonthly('+x.s.id+',\''+ym+'-01\')">编辑账务</button>':'<span class="muted">尚未录入账务</span>'}</div><div class="wide">报销 ${money(reimbursementTotal)}　盈利 <span class="${profit>=0?'positive':'negative'}">${money(profit)}</span></div></div>`}).join(''):'<div class="muted">暂无业绩或月度账务</div>'}<button style="margin-top:12px" onclick="editMonthly(${x.s.id},'${monthNow()}-01')">录入本月账务</button></div>`).join('')}`}catch(e){c.innerHTML='<div class="card error">'+esc(e.message)+'</div>'}}
async function editMonthly(storeId,date){const {data:r}=await sb.from('v_monthly_accounts').select('*').eq('store_id',storeId).eq('month_date',date).maybeSingle();const s=stores.find(x=>x.id===storeId);const d=String(date).slice(0,10);const ym=d.slice(0,7);const [y,m]=ym.split('-').map(Number);const prev=new Date(y,m-2,1);const prevYm=prev.toISOString().slice(0,7);const {data:prevRow}=await sb.from('v_monthly_accounts').select('month_date,utilities,utility_payer,utility_account,utility_paid').eq('store_id',storeId).eq('month_date',prevYm+'-01').maybeSingle();const prevStatus=prevRow?`上个月（${prevYm}）水电费：${money(prevRow.utilities)} · ${esc(prevRow.utility_payer||'未记录缴费方式')} · ${prevRow.utility_paid?'已缴':'未确认缴费'}`:`上个月（${prevYm}）还没有月度账单，请注意检查水电费是否漏填。`;modal('月度账单',`<div class="notice"><b>水电提醒：</b>${prevStatus}</div><div class="grid"><div><label>月份</label><input id="m_date" type="date" value="${esc(r?.month_date||date)}"></div><div><label>本月营业额</label><div class="notice">由员工每日业绩自动汇总，老板无需再填写</div></div><div><label>公司回款</label><input id="m_ret" type="number" value="${n(r?.company_return)}"></div><div><label>房租</label><input id="m_rent" type="number" value="${n(r?.rent)}"></div><div><label>水电费</label><input id="m_util" type="number" value="${n(r?.utilities)}"></div><div><label>水电缴费方</label><select id="m_util_payer"><option value="">请选择</option><option value="房东">房东</option><option value="国家电网">国家电网</option><option value="其他">其他</option></select></div><div><label>缴费户号/对象</label><input id="m_util_account" value="${esc(r?.utility_account||'')}" placeholder="国家电网户号/房东收款说明"></div><div><label>是否已缴</label><select id="m_util_paid"><option value="false">未确认</option><option value="true">已缴</option></select></div><div><label>缴费日期</label><input id="m_util_date" type="date" value="${esc(r?.utility_payment_date||'')}"></div></div><br><label>水电备注</label><textarea id="m_util_note" placeholder="例如：房东统一收、国家电网本月已交">${esc(r?.utility_note||'')}</textarea><br><label>其他费用</label><input id="m_othe async function saveMonthly(storeId,id){const d=$('m_date').value.slice(0,7)+'-01';const obj={store_id:storeId,month_date:d,company_return:n($('m_ret').value),rent:n($('m_rent').value),utilities:n($('m_util').value),utility_payer:$('m_util_payer').value||null,utility_account:$('m_util_account').value.trim()||null,utility_paid:$('m_util_paid').value==='true',utility_payment_date:$('m_util_date').value||null,utility_note:$('m_util_note').value.trim()||null,other_expenses:n($('m_other').value),profit:n($('m_ret').value)-n($('m_rent').value)-n($('m_util').value)-n($('m_other').value),retained:0,notes:$('m_note').value};const {error}=id?await sb.from('monthly_accounts').update(obj).eq('id',id):await sb.from('monthly_accounts').upsert(obj,{onConflict:'store_id,month_date'});if(error){alert('保存失败：'+error.message);return}closeModal();showMonthly()}

async function savePermissions(uid){
 const fields=['view_turnover','view_company_return','view_rent','view_utilities','view_expenses','view_receipts','view_profit','view_retained','view_payback','view_dividends','view_contributions','view_contracts','view_initial_investment','view_history'];
 try{
  const {data:shares,error:se}=await sb.from('store_members').select('store_id,share_percent').eq('user_id',uid).gt('share_percent',0);
  if(se)throw se;
  const allowed=new Set((shares||[]).map(x=>Number(x.store_id)));
  for(const st of stores){
   if(!allowed.has(Number(st.id))){
    const {error}=await sb.from('partner_permissions').delete().eq('user_id',uid).eq('store_id',st.id);
    if(error)throw error;
    continue;
   }
   const obj={user_id:uid,store_id:st.id};
   for(const k of fields){
    const el=document.querySelector(`[data-perm-store="${st.id}"][data-perm-key="${k}"]`);
    obj[k]=!!el?.checked;
   }
   const {error}=await sb.from('partner_permissions').upsert(obj,{onConflict:'user_id,store_id'});
   if(error)throw error;
  }
  closeModal();await showPartners();
 }catch(e){alert('保存权限失败：'+(e.message||e))}
}

    const {error}=await sb.from('store_members').upsert({store_id:s.id,user_id:uid,share_percent:pct},{onConflict:'store_id,user_id'});
    if(error)throw error;
   }
  }
  closeModal();await showPartners();
 }catch(e){alert('保存股份失败：'+(e.message||e))}
}

async function saveStore(id){
  try{
    const num=v=>{const x=String(v??'').trim();return x===''?null:Number(x)};
    const val=k=>$(k)?.value??'';
    const obj={
      name:val('s_name').trim(),
      opening_date:val('s_open')||null,
      initial_investment:num(val('s_inv')),
      address:val('s_addr').trim()||null,
      manager_name:val('s_mgr').trim()||null,
      notes:val('s_note').trim()||null,
      rent_amount:num(val('s_rent')),
      rent_cycle:val('s_cycle').trim()||null,
      rent_payment_date:val('s_rpd')||null,
      rent_deposit:num(val('s_rd')),
      company_deposit:num(val('s_cd')),
      other_deposit:num(val('s_od')),
      other_deposits:num(val('s_ods')),
      contract_start_date:val('s_cs')||null,
      contract_end_date:val('s_ce')||null,
      contract_expiry_date:val('s_ce')||null,
      important_documents:val('s_docs').trim()||null
    };
    if(!obj.name){alert('请输入门店名称');return}
    if(!me?.id || profile?.role!=='owner'){alert('只有老板可以编辑门店');return}
    let error=null,data=null;
    if(id){
      const r=await sb.from('stores').update(obj).eq('id',id).eq('owner_id',me.id);
      error=r.error;
      if(!error){
        const r2=await sb.from('v_stores').select('*').eq('id',id).maybeSingle();
        error=r2.error; data=r2.data;
      }
    }else{
      const r=await sb.from('stores').insert({...obj,owner_id:me.id});
      error=r.error;
      if(!error){
        const r2=await sb.from('v_stores').select('*').order('id',{ascending:false}).limit(1).maybeSingle();
        error=r2.error; data=r2.data;
      }
    }
    if(error) throw error;
    if(!data) throw new Error('没有更新到门店数据，请确认当前账号是老板且门店属于老板账号');
    const idx=stores.findIndex(x=>x.id===data.id);
    if(idx>=0) stores[idx]=data; else stores.push(data);
    closeModal();
    showStoresAdmin();
  }catch(e){
    console.error('saveStore',e);
    alert('门店保存失败：'+(e?.message||String(e)));
  }
}
async function backupQuery(table){

}
function downloadJson(filename,obj){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function backupStoreData(storeId,all){
  const store=all.stores.find(x=>Number(x.id)===Number(storeId));
  if(!store)throw new Error('门店不存在');
  const byStore=(arr)=>arr.filter(x=>Number(x.store_id)===Number(storeId));
  const memberUserIds=byStore(all.store_members).map(x=>x.user_id);
  const permissionUserIds=byStore(all.partner_permissions).map(x=>x.user_id);
  const userIds=[...new Set([...memberUserIds,...permissionUserIds])];
  const staff=byStore(all.store_staff);
  staff.forEach(x=>{if(x.user_id)userIds.push(x.user_id)});
  const profiles=all.profiles.filter(x=>userIds.includes(x.id));
  return {
    backup_format:'fashion-store-accounting-backup',
    backup_version:'1.0',
    exported_at:new Date().toISOString(),
    scope:'single_store',
    store,
    data:{
      store_members:byStore(all.store_members),
      partner_permissions:byStore(all.partner_permissions),
      store_staff:staff,
      daily_sales:byStore(all.daily_sales),
      monthly_accounts:byStore(all.monthly_accounts),
      store_monthly:byStore(all.store_monthly),

async function buildFullBackup(){
  const tables=['stores','store_members','partner_permissions','store_staff','daily_sales','monthly_accounts','store_monthly','reimbursements','expenses','dividends','store_dividends','contributions','store_topups','profiles','expense_categories','reimbursement_categories'];
  const result={};
  for(const t of tables)result[t]=await backupQuery(t);
  return {
    backup_format:'fashion-store-accounting-backup',
    backup_version:'1.0',
    exported_at:new Date().toISOString(),
    scope:'all_stores',
    store_count:result.stores.length,
    stores:result.stores,
    data:result,
    note:'这是系统全量业务数据备份。包含各门店开业至今的每日营业额、月度账务、公司回款、房租、水电、其他费用、报销、分红、补款、股份、权限、门店资料等。登录密码不会被导出；凭证图片若以URL保存，则备份其URL/路径。'
  };
}
async function downloadFullBackup(){
  const btn=document.querySelector('[data-full-backup]');
  if(btn)btn.disabled=true;
  try{
    const backup=await buildFullBackup();
    const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    downloadJson('女装门店_全量数据备份_'+stamp+'.json',backup);
    alert('全量备份已下载，共 '+backup.store_count+' 家门店。请把这个JSON文件保存到手机、电脑或网盘，不要只放在系统里。');
  }catch(e){alert('备份失败：'+(e.message||e))}
  finally{if(btn)btn.disabled=false}
}
async function downloadSingleStoreBackup(storeId){
  try{
    const tables=['stores','store_members','partner_permissions','store_staff','daily_sales','monthly_accounts','store_monthly','reimbursements','expenses','dividends','store_dividends','contributions','store_topups','profiles','expense_categories','reimbursement_categories'];
    const all={};
    for(const t of tables)all[t]=await backupQuery(t);
    const b=backupStoreData(storeId,all);
    const safe=String(b.store.name||'门店').replace(/[\\/:*?"<>|]/g,'_');
    const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    downloadJson(safe+'_开业至今备份_'+stamp+'.json',b);
    alert('「'+b.store.name+'」开业至今备份已下载。');
  }catch(e){alert('单店备份失败：'+(e.message||e))}
}
