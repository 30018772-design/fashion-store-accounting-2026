<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>女装门店·合伙账务 V1.07</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f4f5f7;--card:#fff;--text:#202124;--muted:#73777d;--line:#e6e8eb;--dark:#151515;--red:#c0392b;--green:#16834a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{position:sticky;top:0;z-index:10;background:#151515;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1050px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0000000a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fafafa;border-radius:12px;padding:12px}.num{font-size:21px;font-weight:750;margin-top:4px}.muted{color:var(--muted);font-size:13px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #d8dce1;border-radius:10px;background:#fff}textarea{min-height:80px;resize:vertical}button{border:0;border-radius:10px;padding:10px 13px;background:var(--dark);color:#fff;cursor:pointer}button:disabled{opacity:.55}.secondary{background:#eceef1;color:#222}.danger{background:#b42318}.green{background:#16834a}.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}.tabs button{white-space:nowrap}.tabs .active{background:#151515;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.hidden{display:none!important}.login{max-width:440px;margin:65px auto}.error{color:var(--red)}.success{color:var(--green)}.positive{color:var(--red);font-weight:750}.negative{color:var(--green);font-weight:750}.notice{padding:11px;border-radius:10px;background:#fff8df;color:#765900;font-size:13px}.modal{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:flex-end;justify-content:center}.modalbox{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;gap:8px;align-items:center;background:#fafafa;padding:9px;border-radius:9px}.check input{width:auto}.small{font-size:12px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee;font-size:12px}@media(max-width:650px){.stats{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row .wide{grid-column:1/-1}.checkgrid{grid-template-columns:1fr}}
</style></head><body><header><b>女装门店 · 合伙账务</b><span id="userLabel"></span></header>
<div id="login" class="wrap"><div class="card login"><h2>登录</h2><p class="muted">云端账号登录</p><input id="loginAccount" placeholder="登录账号（邮箱）" autocomplete="username"><br><br><input id="loginPass" type="password" placeholder="密码" autocomplete="current-password"><br><br><button id="loginBtn" style="width:100%">登录</button><p id="loginMsg" class="error"></p></div></div><div id="app" class="wrap hidden"></div><div id="modalRoot"></div>
<script>
const SUPABASE_URL='https://dqruzakkunkinecxxbny.supabase.co',SUPABASE_KEY='sb_publishable_igD9yDQ1KbazCNNUfnjk2Q_WBRY5J-6';
let sb=null,me=null,profile=null,stores=[],periodMode='month',rangeStart='',rangeEnd='',expanded={};
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), n=v=>Number(v||0), money=v=>'¥'+n(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}), today=()=>new Date().toISOString().slice(0,10), monthNow=()=>today().slice(0,7);
function msg(t,ok=false){const e=$('loginMsg');if(e){e.textContent=t;e.className=ok?'success':'error'}}
function init(){if(!window.supabase?.createClient){msg('系统组件加载失败，请刷新');return false}sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return true}
async function load(){const {data:u}=await sb.auth.getUser();me=u.user;if(!me)throw Error('登录已失效');const {data:p,error:pe}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();if(pe)throw pe;if(!p)throw Error('账号资料不存在，请联系老板');profile=p;if(p.enabled===false)throw Error('此账号已停用');const {data:s,error:se}=await sb.from('stores').select('*').order('id');if(se)throw se;stores=s||[]}
async function login(){const a=$('loginAccount').value.trim(),p=$('loginPass').value;if(!a||!p){msg('请输入账号和密码');return}if(!sb&&!init())return;$('loginBtn').disabled=true;msg('正在登录…',true);try{const {data,error}=await sb.auth.signInWithPassword({email:a,password:p});if(error)throw error;await load();enter()}catch(e){await sb?.auth?.signOut();msg('登录失败：'+(e.message||'请检查账号和密码'))}finally{$('loginBtn').disabled=false}}
async function boot(){if(!init())return;try{const {data}=await sb.auth.getSession();if(data.session){await load();enter()}}catch(e){await sb.auth.signOut().catch(()=>{})}}
async function logout(){await sb.auth.signOut();location.reload()}
function enter(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=profile?.name||me.email;renderShell()}
function renderShell(){const owner=profile?.role==='owner';const title=owner?'老板后台':'股东中心';const menu=owner?'<button onclick="showDashboard()">门店总览</button><button class="secondary" onclick="showMonthly()">月度账单</button><button class="secondary" onclick="showReimbursements()">报销</button><button class="secondary" onclick="showPayback()">回本情况</button><button class="secondary" onclick="showPartners()">股东管理</button><button class="secondary" onclick="showStoresAdmin()">门店资料</button>':'<button onclick="showPartnerHome()">我的分红</button>';$("app").innerHTML=`<div class="card" style="margin-bottom:10px"><h2 style="margin:0">${title}</h2><div class="muted">${owner?'门店经营、账单、报销、回本及股东管理':'查看本人参与门店、股份及分红情况'}</div></div><div class="actions">${menu}<button class="secondary" onclick="showAccount()">账号设置</button><button class="secondary" onclick="logout()">退出</button></div><div id="content"></div>`;owner?showDashboard():showPartnerHome()}
async function showPartnerHome(){const c=$("content");c.innerHTML='<div class="card">正在读取我的分红…</div>';try{const {data:m,error}=await sb.from('store_members').select('store_id,share_percent').eq('user_id',me.id);if(error)throw error;if(!(m||[]).length){c.innerHTML='<div class="card"><h2>我的分红</h2><p class="muted">老板还没有给你设置门店股份。</p></div>';return}const blocks=[];for(const mem of m){const s=stores.find(x=>x.id===mem.store_id);if(!s)continue;const {data:divs,error:de}=await sb.from('store_dividends').select('dividend_date,amount,note').eq('store_id',s.id).order('dividend_date',{ascending:false});if(de)throw de;const pct=n(mem.share_percent)/100;const rows=(divs||[]).map(x=>({...x,own:n(x.amount)*pct}));const thisMonth=rows.filter(x=>String(x.dividend_date).slice(0,7)===monthNow()).reduce((a,x)=>a+x.own,0);const total=rows.reduce((a,x)=>a+x.own,0);blocks.push(`<div class="card"><h2>${esc(s.name)}</h2><div class="muted">我的股份：${n(mem.share_percent)}%</div><div class="stats" style="margin-top:12px"><div class="stat"><div class="muted">本月应得分红</div><div class="num positive">${money(thisMonth)}</div></div><div class="stat"><div class="muted">累计分红</div><div class="num positive">${money(total)}</div></div></div><h3>分红明细</h3>${rows.length?rows.map(x=>`<div class="row"><div>${esc(x.dividend_date)}</div><div>总分红 ${money(x.amount)}</div><div class="positive">我应得 ${money(x.own)}</div><div class="wide muted">${esc(x.note||'')}</div></div>`).join(''):'<div class="muted">暂无分红记录</div>'}</div>`)}c.innerHTML=blocks.join('')}catch(e){c.innerHTML='<div class="card error">读取失败：'+esc(e.message)+'</div>'}}
function periodControls(){return `<div class="card"><div class="actions"><button class="${periodMode==='month'?'':'secondary'}" onclick="setPeriod('month')">本月</button><button class="${periodMode==='range'?'':'secondary'}" onclick="setPeriod('range')">月份范围</button><button class="${periodMode==='life'?'':'secondary'}" onclick="setPeriod('life')">开业至今</button></div>${periodMode==='range'?`<div class="grid" style="margin-top:10px"><div><div class="muted">开始月份</div><input id="rangeStart" type="month" value="${esc(rangeStart||monthNow())}"></div><div><div class="muted">结束月份</div><input id="rangeEnd" type="month" value="${esc(rangeEnd||monthNow())}"></div><div style="align-self:end"><button onclick="applyRange()">查询</button></div></div>`:''}</div>`}
function setPeriod(x){periodMode=x;showDashboard()};function applyRange(){rangeStart=$('rangeStart').value;rangeEnd=$('rangeEnd').value;if(!rangeStart||!rangeEnd||rangeStart>rangeEnd){alert('请选择正确的月份范围');return}showDashboard()}
async function rowsFor(store){let q=sb.from('monthly_accounts').select('month_date,turnover,company_return,rent,utilities,other_expenses,profit,retained').eq('store_id',store.id).order('month_date');if(periodMode==='month')q=q.eq('month_date',monthNow()+'-01');if(periodMode==='range'){const a=rangeStart||monthNow(),b=rangeEnd||monthNow();q=q.gte('month_date',a+'-01').lt('month_date',nextMonth(b)+'-01')}if(periodMode==='life'&&store.opening_date)q=q.gte('month_date',String(store.opening_date).slice(0,7)+'-01');const {data,error}=await q;if(error)throw error;return data||[]}
function nextMonth(m){let [y,mo]=m.split('-').map(Number);mo++;if(mo===13){y++;mo=1}return y+'-'+String(mo).padStart(2,'0')}
async function showDashboard(){const c=$('content');c.innerHTML='<div class="card">正在读取云端账务…</div>';try{await load();if(!stores.length){c.innerHTML='<div class="card"><h2>暂无门店</h2></div>';return}const blocks=[];for(const s of stores){const rows=await rowsFor(s);const sum=k=>rows.reduce((a,r)=>a+n(r[k]),0);const profit=rows.reduce((a,r)=>a+n(r.company_return)-n(r.rent)-n(r.utilities)-n(r.other_expenses),0);let dq=sb.from('store_dividends').select('dividend_date,amount').eq('store_id',s.id);if(periodMode==='month')dq=dq.eq('dividend_date',monthNow()+'-01');if(periodMode==='range'){const a=rangeStart||monthNow(),b=rangeEnd||monthNow();dq=dq.gte('dividend_date',a+'-01').lt('dividend_date',nextMonth(b)+'-01')}if(periodMode==='life'&&s.opening_date)dq=dq.gte('dividend_date',String(s.opening_date));const {data:divs}=await dq;const dividends=(divs||[]).reduce((a,r)=>a+n(r.amount),0);const retained=profit-dividends;const open=expanded[s.id];blocks.push(`<div class="card"><div class="actions" style="justify-content:space-between"><h2 style="margin:0">${esc(s.name)}</h2><button class="secondary" onclick="toggleStore(${s.id})">${open?'收起':'详情'}</button></div><div class="stats" style="margin-top:12px"><div class="stat"><div class="muted">营业额</div><div class="num">${money(sum('turnover'))}</div></div><div class="stat"><div class="muted">公司回款</div><div class="num">${money(sum('company_return'))}</div></div><div class="stat"><div class="muted">盈利</div><div class="num ${profit>=0?'positive':'negative'}">${money(profit)}</div></div><div class="stat"><div class="muted">门店留存</div><div class="num ${retained>=0?'positive':'negative'}">${money(retained)}</div></div></div>${open?await storeDetail(s,rows):''}</div>`)}c.innerHTML=periodControls()+blocks.join('')}catch(e){c.innerHTML='<div class="card"><p class="error">读取失败：'+esc(e.message)+'</p></div>'}}
function toggleStore(id){expanded[id]=!expanded[id];showDashboard()}
async function storeDetail(s,rows){let rq=sb.from('reimbursements').select('id,expense_date,amount,note,receipt_url,category_id').eq('store_id',s.id).order('expense_date',{ascending:false});if(periodMode==='month')rq=rq.gte('expense_date',monthNow()+'-01').lt('expense_date',nextMonth(monthNow())+'-01');if(periodMode==='range'){const a=rangeStart||monthNow(),b=rangeEnd||monthNow();rq=rq.gte('expense_date',a+'-01').lt('expense_date',nextMonth(b)+'-01')}if(periodMode==='life'&&s.opening_date)rq=rq.gte('expense_date',String(s.opening_date));const {data:re,error}=await rq;if(error)throw error;const ids=[...new Set((re||[]).map(x=>x.category_id).filter(Boolean))];let cats=[];if(ids.length){const {data}=await sb.from('reimbursement_categories').select('id,name').in('id',ids);cats=data||[]}const cmap=Object.fromEntries(cats.map(x=>[x.id,x.name]));const total=(re||[]).reduce((a,x)=>a+n(x.amount),0);return `<div style="margin-top:14px"><div class="grid"><div><b>房租</b><div>${money(rows.reduce((a,r)=>a+n(r.rent),0))}</div></div><div><b>水电费</b><div>${money(rows.reduce((a,r)=>a+n(r.utilities),0))}</div></div><div><b>报销合计</b><div>${money(total)}</div></div></div><h3>报销明细</h3>${(re||[]).length?(re||[]).map(x=>`<div class="row"><div>${esc(x.expense_date)}</div><div>${esc(cmap[x.category_id]||'其他')}</div><div>${money(x.amount)}</div><div>${x.receipt_url?`<a href="${esc(x.receipt_url)}" target="_blank">凭证</a>`:''}</div><div class="wide muted">${esc(x.note||'')}</div></div>`).join(''):'<div class="muted">暂无报销记录</div>'}</div>`}
function modal(title,body){$('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="actions" style="justify-content:space-between"><h2 style="margin:0">${title}</h2><button class="secondary" onclick="closeModal()">关闭</button></div>${body}</div></div>`};function closeModal(){$('modalRoot').innerHTML=''}
async function showMonthly(){const c=$('content');c.innerHTML='<div class="card">加载中…</div>';try{const all=[];for(const s of stores){const {data,error}=await sb.from('monthly_accounts').select('*').eq('store_id',s.id).order('month_date',{ascending:false});if(error)throw error;all.push({s,rows:data||[]})}c.innerHTML=`<div class="card"><h2>月度账单</h2><p class="muted">盈利 = 公司回款 − 房租 − 水电费 − 其他费用</p></div>${all.map(x=>`<div class="card"><h3>${esc(x.s.name)}</h3>${x.rows.length?x.rows.map(r=>`<div class="row"><div>${esc(String(r.month_date).slice(0,7))}</div><div>营业额 ${money(r.turnover)}</div><div>回款 ${money(r.company_return)}</div><div><button class="secondary" onclick="editMonthly(${x.s.id},'${String(r.month_date).slice(0,10)}')">编辑</button></div><div class="wide">盈利 <span class="${n(r.profit)>=0?'positive':'negative'}">${money(n(r.company_return)-n(r.rent)-n(r.utilities)-n(r.other_expenses))}</span></div></div>`).join(''):'<div class="muted">暂无月度账单</div>'}<button style="margin-top:12px" onclick="editMonthly(${x.s.id},'${monthNow()}-01')">新增/录入本月</button></div>`).join('')}`}catch(e){c.innerHTML='<div class="card error">'+esc(e.message)+'</div>'}}
async function editMonthly(storeId,date){const {data:r}=await sb.from('monthly_accounts').select('*').eq('store_id',storeId).eq('month_date',date).maybeSingle();const s=stores.find(x=>x.id===storeId);modal('月度账单',`<div class="grid"><div><label>月份</label><input id="m_date" type="date" value="${esc(r?.month_date||date)}"></div><div><label>营业额</label><input id="m_turn" type="number" value="${n(r?.turnover)}"></div><div><label>公司回款</label><input id="m_ret" type="number" value="${n(r?.company_return)}"></div><div><label>房租</label><input id="m_rent" type="number" value="${n(r?.rent)}"></div><div><label>水电费</label><input id="m_util" type="number" value="${n(r?.utilities)}"></div><div><label>其他费用</label><input id="m_other" type="number" value="${n(r?.other_expenses)}"></div></div><br><label>备注</label><textarea id="m_note">${esc(r?.notes||'')}</textarea><br><button onclick="saveMonthly(${storeId},${r?.id||'null'})">保存</button>`)}
async function saveMonthly(storeId,id){const d=$('m_date').value.slice(0,7)+'-01';const obj={store_id:storeId,month_date:d,turnover:n($('m_turn').value),company_return:n($('m_ret').value),rent:n($('m_rent').value),utilities:n($('m_util').value),other_expenses:n($('m_other').value),profit:n($('m_ret').value)-n($('m_rent').value)-n($('m_util').value)-n($('m_other').value),retained:0,notes:$('m_note').value};const {error}=id?await sb.from('monthly_accounts').update(obj).eq('id',id):await sb.from('monthly_accounts').upsert(obj,{onConflict:'store_id,month_date'});if(error){alert('保存失败：'+error.message);return}closeModal();showMonthly()}
async function showReimbursements(){const {data:cats}=await sb.from('reimbursement_categories').select('*').eq('enabled',true).order('id');const {data:re,error}=await sb.from('reimbursements').select('*').order('expense_date',{ascending:false});if(error){$('content').innerHTML='<div class="card error">'+esc(error.message)+'</div>';return}const cmap=Object.fromEntries((cats||[]).map(x=>[x.id,x.name]));$('content').innerHTML=`<div class="card"><div class="actions" style="justify-content:space-between"><h2>报销</h2><button onclick="addReimbursement()">新增报销</button></div><p class="muted">报销单独记录，不混入房租、水电费。</p></div><div class="card">${(re||[]).map(x=>{const s=stores.find(y=>y.id===x.store_id);return `<div class="row"><div>${esc(x.expense_date)}</div><div>${esc(s?.name||'')}</div><div>${esc(cmap[x.category_id]||'其他')} · ${money(x.amount)}</div><div><button class="danger" onclick="delReimbursement(${x.id})">删除</button></div><div class="wide muted">${esc(x.note||'')} ${x.receipt_url?`· <a target="_blank" href="${esc(x.receipt_url)}">查看凭证</a>`:''}</div></div>`}).join('')||'<div class="muted">暂无报销</div>'}</div>`}
async function addReimbursement(){const {data:cats}=await sb.from('reimbursement_categories').select('*').eq('enabled',true).order('id');modal('新增报销',`<div class="grid"><div><label>门店</label><select id="r_store">${stores.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div><label>日期</label><input id="r_date" type="date" value="${today()}"></div><div><label>报销类别</label><select id="r_cat">${(cats||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div><label>金额</label><input id="r_amt" type="number" step="0.01"></div></div><br><label>备注</label><textarea id="r_note"></textarea><br><label>凭证图片/文件网址（可选）</label><input id="r_url" placeholder="如有云端凭证地址可粘贴"><br><button onclick="saveReimbursement()">保存</button>`)}
async function saveReimbursement(){const obj={store_id:Number($('r_store').value),expense_date:$('r_date').value,category_id:Number($('r_cat').value),amount:n($('r_amt').value),note:$('r_note').value,receipt_url:$('r_url').value||null};if(!obj.amount){alert('请输入金额');return}const {error}=await sb.from('reimbursements').insert(obj);if(error){alert('保存失败：'+error.message);return}closeModal();showReimbursements()};async function delReimbursement(id){if(!confirm('确定删除这笔报销？'))return;const {error}=await sb.from('reimbursements').delete().eq('id',id);if(error)alert(error.message);else showReimbursements()}
async function showPayback(){const c=$('content');c.innerHTML='<div class="card">加载中…</div>';const blocks=[];for(const s of stores){const {data:d}=await sb.from('store_dividends').select('dividend_date,amount,note').eq('store_id',s.id).order('dividend_date',{ascending:false});const {data:t}=await sb.from('store_topups').select('topup_date,amount,note').eq('store_id',s.id).order('topup_date',{ascending:false});const top=(t||[]).reduce((a,x)=>a+n(x.amount),0),div=(d||[]).reduce((a,x)=>a+n(x.amount),0),remain=n(s.initial_investment)+top-div;const {data:ma}=await sb.from('monthly_accounts').select('company_return,rent,utilities,other_expenses').eq('store_id',s.id);const retained=(ma||[]).reduce((a,r)=>a+n(r.company_return)-n(r.rent)-n(r.utilities)-n(r.other_expenses),0)-div;blocks.push(`<div class="card"><h2>${esc(s.name)}</h2><div class="stats"><div class="stat">初始投入<div class="num">${money(s.initial_investment)}</div></div><div class="stat">累计补款<div class="num">${money(top)}</div></div><div class="stat">累积分红<div class="num">${money(div)}</div></div><div class="stat">剩余未回本<div class="num ${remain>=0?'positive':'negative'}">${money(remain)}</div></div><div class="stat">累计留存<div class="num ${retained>=0?'positive':'negative'}">${money(retained)}</div></div></div><h3>分红明细</h3>${(d||[]).map(x=>`<div class="row"><div>${esc(x.dividend_date)}</div><div>${money(x.amount)}</div><div>${esc(x.note||'')}</div></div>`).join('')||'<div class="muted">暂无分红</div>'}<div class="actions" style="margin-top:10px"><button onclick="addDividend(${s.id})">录入分红</button><button class="secondary" onclick="addTopup(${s.id})">录入补款</button></div></div>`)}c.innerHTML=blocks.join('')||'<div class="card">暂无门店</div>'}
async function addDividend(storeId){modal('录入分红',`<div class="grid"><div><label>日期</label><input id="d_date" type="date" value="${today()}"></div><div><label>总分红金额</label><input id="d_amt" type="number" step="0.01"></div></div><br><label>备注</label><textarea id="d_note"></textarea><br><button onclick="saveDividend(${storeId})">保存</button>`)}async function saveDividend(storeId){const {error}=await sb.from('store_dividends').insert({store_id:storeId,dividend_date:$('d_date').value,amount:n($('d_amt').value),note:$('d_note').value});if(error){alert(error.message);return}closeModal();showPayback()}
async function addTopup(storeId){modal('录入补款',`<div class="grid"><div><label>日期</label><input id="t_date" type="date" value="${today()}"></div><div><label>总补款金额</label><input id="t_amt" type="number" step="0.01"></div></div><br><label>备注</label><textarea id="t_note"></textarea><br><button onclick="saveTopup(${storeId})">保存</button>`)}async function saveTopup(storeId){const {error}=await sb.from('store_topups').insert({store_id:storeId,topup_date:$('t_date').value,amount:n($('t_amt').value),note:$('t_note').value});if(error){alert(error.message);return}closeModal();showPayback()}
async function showPartners(){const {data:ps,error}=await sb.from('profiles').select('id,name,role,enabled,username,created_at').eq('role','partner').order('created_at');if(error){$('content').innerHTML='<div class="card error">'+esc(error.message)+'</div>';return}const rows=[];for(const p of ps||[]){const {data:m}=await sb.from('store_members').select('store_id,share_percent').eq('user_id',p.id);rows.push(`<div class="card"><div class="actions" style="justify-content:space-between"><div><h3 style="margin:0">${esc(p.name)}</h3><div class="muted">${esc(p.username||'')}</div></div><span class="pill">${p.enabled===false?'已禁止登录':'正常'}</span></div><div style="margin-top:10px">${(m||[]).map(x=>`${esc(stores.find(s=>s.id===x.store_id)?.name||'')}：${n(x.share_percent)}%`).join('　')||'<span class="muted">尚未设置股份</span>'}</div><div class="actions" style="margin-top:10px"><button onclick="setShares('${p.id}')">设置股份</button><button class="secondary" onclick="resetPwd('${p.id}')">重置密码</button><button class="secondary" onclick="togglePartner('${p.id}',${p.enabled!==false})">${p.enabled===false?'恢复登录':'禁止登录'}</button><button class="danger" onclick="deletePartner('${p.id}')">删除股东</button></div></div>`)}$('content').innerHTML=`<div class="card"><div class="actions" style="justify-content:space-between"><h2>股东管理</h2><button onclick="createPartner()">新增股东</button></div><p class="muted">创建账号后可设置每个门店股份；账号密码仅在创建/重置时显示，系统不读取旧密码。</p></div>${rows.join('')||'<div class="card">暂无股东</div>'}`}
async function partnerAction(body){const {data,error}=await sb.functions.invoke('partner-admin',{body});if(error)throw error;if(!data?.ok)throw Error(data?.message||'操作失败');return data}
async function createPartner(){modal('新增股东',`<div class="grid"><div><label>姓名</label><input id="p_name"></div><div><label>登录账号（邮箱）</label><input id="p_email" type="email"></div><div><label>初始密码</label><input id="p_pwd" type="text" minlength="6"></div></div><br><div class="notice">创建成功后这里会显示账号、密码和公开网址，可一键复制。密码不会再次从系统读取。</div><br><button onclick="savePartner()">创建账号</button>`)}
async function savePartner(){try{const name=$('p_name').value.trim(),email=$('p_email').value.trim(),password=$('p_pwd').value;if(!name||!email||password.length<6){alert('请填写姓名、邮箱，密码至少6位');return}const d=await partnerAction({action:'create',name,email,password});const url=location.href;modal('股东账号已创建',`<div class="card"><div>姓名：${esc(name)}</div><div>账号：${esc(email)}</div><div>密码：${esc(password)}</div><div>网址：${esc(url)}</div></div><button onclick="copyText(${JSON.stringify(email+'\n'+password+'\n'+url)})">一键复制账号＋密码＋网址</button><button class="secondary" onclick="closeModal();showPartners()">完成并设置股份</button>`)}catch(e){alert('创建失败：'+(e.message||e))}}
async function copyText(t){try{await navigator.clipboard.writeText(t);alert('已复制')}catch(e){prompt('复制以下内容：',t)}}
async function setShares(uid){const {data:m}=await sb.from('store_members').select('store_id,share_percent').eq('user_id',uid);const map=Object.fromEntries((m||[]).map(x=>[x.store_id,x.share_percent]));modal('设置门店股份',`${stores.map(s=>`<div class="grid" style="margin-bottom:8px"><div>${esc(s.name)}</div><div><input id="share_${s.id}" type="number" min="0" max="100" step="0.01" value="${n(map[s.id])}" placeholder="股份 %"></div></div>`).join('')}<button onclick="saveShares('${uid}')">保存股份</button>`)}async function saveShares(uid){try{for(const s of stores){const v=$('share_'+s.id).value;if(v==='')continue;const pct=n(v);if(pct<0||pct>100)throw Error('股份必须在0-100%');const {error}=await sb.from('store_members').upsert({store_id:s.id,user_id:uid,share_percent:pct},{onConflict:'store_id,user_id'});if(error)throw error}closeModal();showPartners()}catch(e){alert('保存股份失败：'+e.message)}}
async function togglePartner(uid,current){try{await partnerAction({action:'set_enabled',user_id:uid,enabled:!current});showPartners()}catch(e){alert(e.message||e)}}async function resetPwd(uid){const p=prompt('输入新密码（至少6位）：');if(!p)return;if(p.length<6){alert('密码至少6位');return}try{await partnerAction({action:'reset_password',user_id:uid,password:p});const url=location.href;await copyText(p);alert('密码已重置。账号登录网址：'+url)}catch(e){alert(e.message||e)}}async function deletePartner(uid){if(!confirm('确定删除该股东账号？股份和权限也会删除。'))return;try{await partnerAction({action:'delete',user_id:uid});showPartners()}catch(e){alert(e.message||e)}}
async function showStoresAdmin(){const c=$('content');c.innerHTML=`<div class="card"><div class="actions" style="justify-content:space-between"><h2>门店资料</h2><button onclick="editStore()">新增门店</button></div></div>${stores.map(s=>`<div class="card"><h3>${esc(s.name)}</h3><div class="grid"><div>开业日期<br><b>${esc(s.opening_date||'—')}</b></div><div>初始投入<br><b>${money(s.initial_investment)}</b></div><div>房租<br><b>${money(s.rent_amount)}</b></div><div>合同到期<br><b>${esc(s.contract_expiry_date||s.contract_end_date||'—')}</b></div></div><button style="margin-top:10px" onclick="editStore(${s.id})">编辑</button></div>`).join('')}`}
async function editStore(id){const s=stores.find(x=>x.id===id)||{};modal(id?'编辑门店':'新增门店',`<div class="grid"><div><label>门店名称</label><input id="s_name" value="${esc(s.name||'')}"></div><div><label>开业日期</label><input id="s_open" type="date" value="${esc(s.opening_date||'')}"></div><div><label>初始总投入</label><input id="s_inv" type="number" value="${n(s.initial_investment)}"></div><div><label>地址</label><input id="s_addr" value="${esc(s.address||'')}"></div><div><label>负责人</label><input id="s_mgr" value="${esc(s.manager_name||'')}"></div><div><label>房租</label><input id="s_rent" type="number" value="${n(s.rent_amount)}"></div><div><label>租金周期</label><input id="s_cycle" value="${esc(s.rent_cycle||'')}"></div><div><label>合同开始</label><input id="s_cs" type="date" value="${esc(s.contract_start_date||'')}"></div><div><label>合同到期</label><input id="s_ce" type="date" value="${esc(s.contract_expiry_date||s.contract_end_date||'')}"></div></div><br><label>备注</label><textarea id="s_note">${esc(s.notes||'')}</textarea><br><button onclick="saveStore(${id||'null'})">保存</button>`)}
async function saveStore(id){const obj={name:$('s_name').value.trim(),opening_date:$('s_open').value||null,initial_investment:n($('s_inv').value),address:$('s_addr').value,manager_name:$('s_mgr').value,rent_amount:n($('s_rent').value),rent_cycle:$('s_cycle').value,contract_start_date:$('s_cs').value||null,contract_expiry_date:$('s_ce').value||null,notes:$('s_note').value};if(!obj.name){alert('请输入门店名称');return}let res=id?await sb.from('stores').update(obj).eq('id',id):await sb.from('stores').insert({...obj,owner_id:me.id});if(res.error){alert('保存失败：'+res.error.message);return}closeModal();await load();showStoresAdmin()}
async function showAccount(){const c=$('content');c.innerHTML=`<div class="card"><h2>账号设置</h2><div class="grid"><div><div class="muted">姓名</div><b>${esc(profile?.name||'')}</b></div><div><div class="muted">登录账号</div><b>${esc(me?.email||profile?.username||'')}</b></div><div><div class="muted">公开网址</div><div style="word-break:break-all">${esc(location.href)}</div></div></div><div class="actions" style="margin-top:14px"><button onclick="copyText(${JSON.stringify((me?.email||profile?.username||'')+'\n'+location.href)})">复制账号＋网址</button></div><p class="muted">安全说明：系统不会读取或保存当前密码。股东密码只能在创建或重置时显示。</p></div>`}
$('loginBtn').addEventListener('click',login);$('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});boot();
</script></body></html>
