let partnerPeriodMode='month',partnerRangeStart='',partnerRangeEnd='';
function unifiedPeriodBounds(store,mode,startMonth,endMonth){
  const now=monthNow(), todayEnd=dateTomorrow();
  if(mode==='month') return [now+'-01',nextMonth(now)+'-01'];
  if(mode==='year'){
    const y=String(now).slice(0,4);
    return [y+'-01-01',(Number(y)+1)+'-01-01'];
  }
  if(mode==='range'){
    const a=startMonth||now, b=endMonth||a;
    const start=a+'-01';
    return [start,nextMonth(b)+'-01'];
  }

}

 };

 const s=stores.find(x=>Number(x.id)===Number(storeId));
 if(!s)return;
 try{
  const [start,end]=periodBounds(s);
  const all=await fetchReimbursements(storeId);
  const re=(all||[]).filter(x=>inBounds(x.expense_date,start,end));
  const ids=[...new Set(re.map(x=>x.category_id).filter(Boolean))];
  let cats=[];
  if(ids.length){const {data,error}=await sb.from('reimbursement_categories').select('id,name').in('id',ids);if(error)throw error;cats=data||[]}
  const cmap=Object.fromEntries(cats.map(x=>[x.id,x.name]));
  const el=$('detail_re_'+storeId);
  if(el)el.innerHTML=renderGroupedReimbursements(re,cmap,periodMode,false);
 }catch(e){const el=$('detail_re_'+storeId);if(el)el.innerHTML='<span class=\"error\">报销读取失败：'+esc(e.message)+'</span>';}
}

async function saveReimbursement(){

  if(!storeId){alert('请选择门店');return}if(!date){alert('请选择报销日期');return}if(!name){alert('请输入报销类别');return}if(amount<=0){alert('请输入大于0的报销金额');return}

  const obj={store_id:storeId,expense_date:date,category_id:cat.id,amount,note:$('r_note').value.trim(),receipt_url:$('r_url').value.trim()||null};
  const {error}=await sb.from('reimbursements').insert(obj);if(error)throw error;

function permSelectAll(storeId,checked){
 document.querySelectorAll(`[data-perm-store="${storeId}"][data-perm-key]`).forEach(x=>x.checked=checked);
}
async function savePermissions(uid){
 const fields=['view_turnover','view_company_return','view_rent','view_utilities','view_expenses','view_receipts','view_profit','view_retained','view_payback','view_dividends','view_contributions','view_contracts','view_initial_investment','view_history'];
 try{
  const {data:shares,error:se}=await sb.from('store_members').select('store_id,share_percent').eq('user_id',uid).gt('share_percent',0);
  if(se)throw se;
  const allowed=new Set((shares||[]).map(x=>Number(x.store_id)));
  for(const st of stores){
   if(!allowed.has(Number(st.id))){
    const {error}=await sb.from('partner_permissions').delete().eq('user_id',uid).eq('store_id',st.id);
    if(error)throw error;
    continue;
   }
   const obj={user_id:uid,store_id:st.id};
   for(const k of fields){
    const el=document.querySelector(`[data-perm-store="${st.id}"][data-perm-key="${k}"]`);
    obj[k]=!!el?.checked;
   }
   const {error}=await sb.from('partner_permissions').upsert(obj,{onConflict:'user_id,store_id'});
   if(error)throw error;
  }
  closeModal();notifyDataChange();await showPartners();
 }catch(e){alert('保存权限失败：'+(e.message||e))}
}
async function setShares(uid){const {data:m,error}=await sb.from('store_members').select('store_id,share_percent').eq('user_id',uid);if(error){alert('读取股份失败：'+error.message);return}const map=Object.fromEntries((m||[]).map(x=>[x.store_id,x.share_percent]));modal('设置门店股份',`${stores.map(s=>{const has=Object.prototype.hasOwnProperty.call(map,s.id);return `<div class="grid" style="margin-bottom:8px"><div>${esc(s.name)}</div><div><input id="share_${s.id}" type="number" min="0" max="100" step="0.01" value="${has?esc(map[s.id]):''}" placeholder="未参与"></div></div>`}).join('')}<p class="muted">没有股份请留空；填写 0 保存后会自动取消该店参与资格。</p><button onclick="saveShares('${uid}')">保存股份</button>`)}async function saveShares(uid){
 try{
  const defaultFields=['view_turnover','view_company_return','view_rent','view_utilities','view_expenses','view_receipts','view_profit','view_retained','view_payback','view_dividends','view_contributions','view_contracts','view_initial_investment','view_history'];
  for(const s of stores){
   const el=$('share_'+s.id); const v=el?el.value.trim():'';
   if(v===''){
    const {error}=await sb.from('store_members').delete().eq('user_id',uid).eq('store_id',s.id);
    if(error)throw error;
    const {error:pe}=await sb.from('partner_permissions').delete().eq('user_id',uid).eq('store_id',s.id);
    if(pe)throw pe;
    continue;
   }
   const pct=n(v);if(pct<0||pct>100)throw Error('股份必须在0-100%');
   if(pct===0){
    const {error}=await sb.from('store_members').delete().eq('user_id',uid).eq('store_id',s.id);
    if(error)throw error;
    const {error:pe}=await sb.from('partner_permissions').delete().eq('user_id',uid).eq('store_id',s.id);
    if(pe)throw pe;
   }else{
    const {error}=await sb.from('store_members').upsert({store_id:s.id,user_id:uid,share_percent:pct},{onConflict:'store_id,user_id'});
    if(error)throw error;
    const {data:existing,error:qe}=await sb.from('partner_permissions').select('id').eq('user_id',uid).eq('store_id',s.id).maybeSingle();
    if(qe)throw qe;
    if(!existing){
      const obj={user_id:uid,store_id:s.id};
      defaultFields.forEach(k=>obj[k]=true);
      const {error:pe}=await sb.from('partner_permissions').insert(obj);
      if(pe)throw pe;
    }
   }
  }
  closeModal();notifyDataChange();await showPartners();
 }catch(e){alert('保存股份失败：'+(e.message||e))}
}

async function saveStore(id){
  try{
    const num=v=>{const x=String(v??'').trim();return x===''?null:Number(x)};
    const val=k=>$(k)?.value??'';
    const obj={
      name:val('s_name').trim(),
      opening_date:val('s_open')||null,
      initial_investment:num(val('s_inv')),
      address:val('s_addr').trim()||null,
      manager_name:val('s_mgr').trim()||null,
      notes:val('s_note').trim()||null,
      rent_amount:num(val('s_rent')),
      rent_cycle:val('s_cycle').trim()||null,
      rent_payment_date:val('s_rpd')||null,
      rent_deposit:num(val('s_rd')),
      company_deposit:num(val('s_cd')),
      other_deposit:num(val('s_od')),
      other_deposits:num(val('s_ods')),
      contract_start_date:val('s_cs')||null,
      contract_end_date:val('s_ce')||null,
      contract_expiry_date:val('s_ce')||null,
      important_documents:val('s_docs').trim()||null
    };
    if(!obj.name){alert('请输入门店名称');return}
    if(!me?.id || profile?.role!=='owner'){alert('只有老板可以编辑门店');return}
    let error=null,data=null;
    if(id){
      // 编辑直接写入 stores 基表；保存后从同一基表回读，避免 v_stores 视图/权限链导致“保存失败”。
      if(!obj.opening_date){
        const oldStore=stores.find(x=>Number(x.id)===Number(id));
        obj.opening_date=oldStore?.opening_date||null;
      }
      if(!obj.opening_date) throw new Error('请选择开业日期');
      const r=await sb.from('stores').update(obj).eq('id',Number(id)).eq('owner_id',me.id).select('*').maybeSingle();
      error=r.error; data=r.data;
    }else{
      if(!obj.opening_date) throw new Error('请选择开业日期');
      const r=await sb.from('stores').insert({...obj,owner_id:me.id}).select('*').maybeSingle();
      error=r.error; data=r.data;
    }
    if(error) throw error;
    if(!data) throw new Error('没有更新到门店数据，请确认当前账号是老板且门店属于老板账号');
    const idx=stores.findIndex(x=>x.id===data.id);
    if(idx>=0) stores[idx]=data; else stores.push(data);
    closeModal();notifyDataChange();
    showStoresAdmin();
  }catch(e){
    console.error('saveStore',e);
    alert('门店保存失败：'+(e?.message||String(e)));
  }
}
async function backupQuery(table){
  const pageSize=1000;
  let from=0,all=[];
  while(true){
    const {data,error}=await sb.from(table).select('*').order('id',{ascending:true}).range(from,from+pageSize-1);
    if(error)throw new Error('备份读取 '+table+' 失败：'+error.message);
    const rows=data||[]; all=all.concat(rows);
    if(rows.length<pageSize)break;
    from+=pageSize;
  }
  return all;
}
async function shareOrDownloadBlob(filename,blob,mime,title){
 const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
 if(isMobile&&typeof navigator.share==='function'){
  try{
   const f=new File([blob],filename,{type:mime});
   if(!navigator.canShare||navigator.canShare({files:[f]})){
    await navigator.share({files:[f],title:title||'女装门店数据备份'});
    return 'shared';
   }
  }catch(e){if(e?.name==='AbortError')return 'cancelled';console.warn('系统分享失败',e)}
 }
 const url=URL.createObjectURL(blob);
 if(isMobile){
  const w=window.open(url,'_blank');
  if(!w)location.href=url;
  setTimeout(()=>URL.revokeObjectURL(url),120000);
  return 'open';
 }
 const a=document.createElement('a');a.href=url;a.download=filename;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
 return 'downloaded';
}

}

function excelCell(v){
 if(v===null||v===undefined)return '';
 if(typeof v==='object')return esc(JSON.stringify(v));
 return esc(String(v));
}
function xmlEsc(v){
 return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function excelCellText(v){
 if(v===null||v===undefined)return '';
 if(typeof v==='object')return JSON.stringify(v);
 return String(v);
}
function crc32(bytes){
 let table=window.__crc32Table;
 if(!table){
  table=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);table[n]=c>>>0}
  window.__crc32Table=table;
 }
 let c=0xffffffff;
 for(let i=0;i<bytes.length;i++)c=table[(c^bytes[i])&255]^(c>>>8);
 return (c^0xffffffff)>>>0;
}
function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}
function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}
function concatBytes(parts){
 let len=0;parts.forEach(x=>len+=x.length);
 const out=new Uint8Array(len);let p=0;
 parts.forEach(x=>{out.set(x,p);p+=x.length});return out;
}
function zipStore(files){
 const enc=new TextEncoder(),local=[],central=[];let offset=0;
 for(const f of files){
  const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);
  const lh=concatBytes([new Uint8Array([80,75,3,4,20,0,0,0,0,0,0,0,0,0]),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);
  local.push(lh);
  const ch=concatBytes([new Uint8Array([80,75,1,2,20,0,20,0,0,0,0,0,0,0,0,0]),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]);
  central.push(ch);offset+=lh.length;
 }
 const cd=concatBytes(central),body=concatBytes(local);
 const end=concatBytes([new Uint8Array([80,75,5,6,0,0,0,0]),u16(files.length),u16(files.length),u32(cd.length),u32(body.length),u16(0)]);
 return concatBytes([body,cd,end]);
}
function makeExcelXlsx(backup){
 const current=backup?.data||{},legacy=backup?.legacy_data||{};
 const groups=[['当前业务数据',current],['历史兼容数据',legacy]];
 const sheets=[];const used=new Set();
 const safeSheet=(raw)=>{
  let s=String(raw||'数据').replace(/[\\\/\?\*\[\]:]/g,'_').slice(0,31)||'数据',base=s,i=2;
  while(used.has(s)){s=(base.slice(0,31-String(i).length-1)+'_'+i++);}
  used.add(s);return s;
 };
 const files=[
  {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${Object.keys(current).concat(Object.keys(legacy)).map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`},
  {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
  {name:'xl/styles.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0"/></cellXfs></styleSheet>`}
 ];
 let idx=1;
 for(const [groupName,tables] of groups){
  for(const [name,rows] of Object.entries(tables)){
   const sheetName=safeSheet(name),arr=Array.isArray(rows)?rows:[],keys=[...new Set(arr.flatMap(x=>Object.keys(x||{})))];
   const rowXml=[];
   rowXml.push(`<row><c t="inlineStr" s="1"><is><t>${xmlEsc(groupName+' · '+name)}</t></is></c></row>`);
   if(keys.length){
    rowXml.push('<row>'+keys.map(k=>`<c t="inlineStr" s="1"><is><t>${xmlEsc(k)}</t></is></c>`).join('')+'</row>');
    for(const row of arr){
     rowXml.push('<row>'+keys.map(k=>`<c t="inlineStr"><is><t xml:space="preserve">${xmlEsc(excelCellText(row?.[k]))}</t></is></c>`).join('')+'</row>');
    }
   }else rowXml.push('<row><c t="inlineStr"><is><t>无数据</t></is></c></row>');
   files.push({name:`xl/worksheets/sheet${idx}.xml`,data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rowXml.join('')}</sheetData></worksheet>`});
   sheets.push({name:sheetName,id:idx});idx++;
  }
 }

function backupStoreData(storeId,all){
  const store=all.stores.find(x=>Number(x.id)===Number(storeId));
  if(!store)throw new Error('门店不存在');
  const byStore=(arr)=>Array.isArray(arr)?arr.filter(x=>Number(x.store_id)===Number(storeId)):[];
  // 单店备份只保存“门店账本”：门店资料及该门店全部经营流水。
  // 股东账号、股份、股东权限、profiles 不属于门店账本，不导出。
  const currentData={
    store_staff:byStore(all.store_staff),
    daily_sales:byStore(all.daily_sales),
    monthly_accounts:byStore(all.monthly_accounts),
    reimbursements:byStore(all.reimbursements),
    store_dividends:byStore(all.store_dividends),
    store_topups:byStore(all.store_topups),
    expense_categories:Array.isArray(all.expense_categories)?all.expense_categories:[],
    reimbursement_categories:Array.isArray(all.reimbursement_categories)?all.reimbursement_categories:[]
  };
  const legacyData={
    store_monthly:byStore(all.store_monthly),
    expenses:byStore(all.expenses),
    dividends:byStore(all.dividends)
  };
  return {
    backup_format:'fashion-store-accounting-backup',
    backup_version:'1.4',
    exported_at:new Date().toISOString(),
    scope:'single_store',
    store,
    data:currentData,
    legacy_data:legacyData,
    table_manifest:{
      current:Object.keys(currentData),
      legacy_compatibility:Object.keys(legacyData),
      excluded:['store_members','partner_permissions','profiles','contributions']
    },
    note:'本备份以门店为单位，保存该门店从开业以来的经营资料及全部历史经营流水（销售、月账、报销、分红、回款/补款、员工门店关系及相关分类）。不备份股东账号、股东股份、股东权限及profiles。历史兼容表单独保存。'
  };
}

function restoreRowsForStore(backup,storeId){const d=backup?.data||{},sid=Number(storeId),by=name=>Array.isArray(d[name])?d[name].filter(x=>Number(x?.store_id)===sid):[];return {store_staff:by('store_staff'),daily_sales:by('daily_sales'),monthly_accounts:by('monthly_accounts'),reimbursements:by('reimbursements'),store_dividends:by('store_dividends'),store_topups:by('store_topups'),store_monthly:(backup?.legacy_data?.store_monthly||[]).filter(x=>Number(x?.store_id)===sid),expenses:(backup?.legacy_data?.expenses||[]).filter(x=>Number(x?.store_id)===sid),dividends:(backup?.legacy_data?.dividends||[]).filter(x=>Number(x?.store_id)===sid)}}

async function restoreCategories(backup,currentOwnerId){const d=backup?.data||{},maps={expense:new Map(),reimbursement:new Map()},created={expense:[],reimbursement:[]};for(const [table,type] of [['expense_categories','expense'],['reimbursement_categories','reimbursement']]){const source=Array.isArray(d[table])?d[table]:[];if(!source.length)continue;const {data:existing,error}=await sb.from(table).select('id,name');if(error)throw new Error('读取'+table+'失败：'+error.message);const byName=new Map((existing||[]).map(x=>[String(x.name||'').trim(),Number(x.id)]));for(const c of source){const name=String(c?.name||'').trim();if(!name)continue;let id=byName.get(name);if(!id){const payload=stripId(c,['owner_id','created_at']);payload.owner_id=currentOwnerId;const {data,error:ie}=await sb.from(table).insert(payload).select('id').maybeSingle();if(ie)throw new Error('恢复'+table+'分类“'+name+'”失败：'+ie.message);id=Number(data?.id);if(id){byName.set(name,id);created[type].push(id)}}if(c?.id!=null&&id)maps[type].set(Number(c.id),id)}}return {maps,created}}
async function restoreOneStore(backup,st,currentOwnerId,validUsers,catMaps){
  const oldId=Number(st?.id),payload=stripId(st,['owner_id','created_at']);payload.owner_id=currentOwnerId;
  const {data:newStore,error}=await sb.from('stores').insert(payload).select('*').maybeSingle();
  if(error)throw new Error('恢复门店“'+(st?.name||'未命名')+'”失败：'+error.message);
  if(!newStore?.id)throw new Error('恢复门店后没有取得新门店ID');

  const remap=(x,drop=[])=>{const y=stripId(x,drop);y.store_id=newId;return y};
  try{
    out.daily_sales=await restoreInsertRows('daily_sales',r.daily_sales.map(remap));
    out.monthly_accounts=await restoreInsertRows('monthly_accounts',r.monthly_accounts.map(remap));
    out.reimbursements=await restoreInsertRows('reimbursements',r.reimbursements.map(x=>{const y=remap(x,['category_id']);y.category_id=x.category_id!=null?(catMaps.reimbursement.get(Number(x.category_id))||null):null;return y}));
    out.store_dividends=await restoreInsertRows('store_dividends',r.store_dividends.map(remap));
    out.store_topups=await restoreInsertRows('store_topups',r.store_topups.map(x=>{const y=remap(x,['partner_id','user_id','created_at']);y.partner_id=null;y.user_id=null;return y}));
    out.store_monthly=await restoreInsertRows('store_monthly',r.store_monthly.map(remap));
    out.expenses=await restoreInsertRows('expenses',r.expenses.map(x=>{const y=remap(x,['category_id']);y.category_id=x.category_id!=null?(catMaps.expense.get(Number(x.category_id))||null):null;return y}));
    out.dividends=await restoreInsertRows('dividends',r.dividends.map(remap));
    const candidates=[...new Set(r.store_staff.map(x=>String(x?.user_id||'')).filter(Boolean))];
    let occupied=new Set();
    if(candidates.length){const {data:bound,error:be}=await sb.from('store_staff').select('user_id').in('user_id',candidates);if(be)throw new Error('检查员工门店绑定失败：'+be.message);occupied=new Set((bound||[]).map(x=>String(x.user_id)))}
    const staff=r.store_staff.filter(x=>validUsers.has(String(x.user_id))&&!occupied.has(String(x.user_id)));out.skipped_staff=r.store_staff.length-staff.length;out.store_staff=await restoreInsertRows('store_staff',staff.map(remap));
    return {newStore,summary:out};
  }catch(e){e.__restoreStoreId=newId;throw e}
}
async function validateRestoreFile(file){

 const ss=b.scope==='single_store'?(b.store?[b.store]:[]):(b.data?.stores||[]);
 if(!ss.length)throw new Error('备份里没有门店数据');

async function executeRestore(){
  if(!__restoreBackup){alert('请先选择备份文件');return}
  if(profile?.role!=='owner'){alert('只有老板账号可以恢复门店数据');return}
  const x=restoreCountSummary(__restoreBackup);
  if(!confirm(`确认恢复？\n\n门店：${x.stores} 家\n销售：${x.daily_sales} 条\n月账：${x.monthly_accounts} 条\n报销：${x.reimbursements} 条\n分红：${x.store_dividends} 条\n回款/补款：${x.store_topups} 条\n\n恢复会创建新的门店，不覆盖现有门店。\n股东、股东权限、profiles 不会恢复。`))return;
  const btn=$('restoreConfirmBtn');btn.disabled=true;
  const createdStoreIds=[];
  let categoryRestore=null;
  try{
    const {data:p,error:pe}=await sb.from('profiles').select('id');if(pe)throw pe;
    const validUsers=new Set((p||[]).map(x=>String(x.id)));
    categoryRestore=await restoreCategories(__restoreBackup,me.id);
    const catMaps=categoryRestore.maps;
    const ss=__restoreBackup.scope==='single_store'?[__restoreBackup.store]:(__restoreBackup.data?.stores||[]),results=[];
    for(const st of ss){
      try{const r=await restoreOneStore(__restoreBackup,st,me.id,validUsers,catMaps);results.push(r);createdStoreIds.push(Number(r.newStore.id));}
      catch(e){if(e?.__restoreStoreId)createdStoreIds.push(Number(e.__restoreStoreId));throw e}
    }
    // 二次核对：恢复完成后重新从数据库读取实际条数，而不是只相信 INSERT 数量。
    const actual={stores:0,daily_sales:0,monthly_accounts:0,reimbursements:0,store_dividends:0,store_topups:0,store_staff:0,store_monthly:0,expenses:0,dividends:0};
    for(const sid of createdStoreIds){
      const checks=[['daily_sales','store_id'],['monthly_accounts','store_id'],['reimbursements','store_id'],['store_dividends','store_id'],['store_topups','store_id'],['store_staff','store_id'],['store_monthly','store_id'],['expenses','store_id'],['dividends','store_id']];
      for(const [table,col] of checks){const {count,error}=await sb.from(table).select('id',{count:'exact',head:true}).eq(col,sid);if(error)throw new Error('恢复后核对 '+table+' 失败：'+error.message);actual[table]= (actual[table]||0)+(count||0)}
    }
    actual.stores=createdStoreIds.length;
    const skippedStaff=results.reduce((a,r)=>a+(r.summary.skipped_staff||0),0);
    const expected={};for(const k of Object.keys(actual))expected[k]=x[k]||0;
    expected.store_staff=Math.max(0,(x.store_staff||0)-skippedStaff);
    for(const k of Object.keys(actual)){if(actual[k]!==expected[k])throw new Error(`恢复后核对失败：${k}，应恢复 ${expected[k]} 条，数据库实际 ${actual[k]} 条`)}
    await load(true);notifyDataChange();
    alert(`数据恢复完成并核对通过！\n\n门店：${actual.stores} 家\n销售：${actual.daily_sales} 条\n月账：${actual.monthly_accounts} 条\n报销：${actual.reimbursements} 条\n分红：${actual.store_dividends} 条\n回款/补款：${actual.store_topups} 条\n员工关系无法重新关联：${results.reduce((a,r)=>a+(r.summary.skipped_staff||0),0)} 条`);
    __restoreBackup=null;showBackup();
  }catch(e){
    console.error('executeRestore',e);
    // 尽力回滚本次创建的门店及其流水，避免留下半恢复门店。按子表→门店顺序删除。
    for(const sid of createdStoreIds){
      for(const table of ['store_staff','daily_sales','monthly_accounts','reimbursements','store_dividends','store_topups','store_monthly','expenses','dividends']){try{await sb.from(table).delete().eq('store_id',sid)}catch(cleanErr){console.warn('恢复回滚 '+table+' 失败',cleanErr)}}
      try{await sb.from('stores').delete().eq('id',sid).eq('owner_id',me.id)}catch(cleanErr){console.warn('恢复回滚 stores 失败',cleanErr)}
    }
    if(categoryRestore?.created){
      for(const [type,table] of [['expense','expense_categories'],['reimbursement','reimbursement_categories']]){
        for(const cid of (categoryRestore.created[type]||[])){try{await sb.from(table).delete().eq('id',cid).eq('owner_id',me.id)}catch(cleanErr){console.warn('恢复回滚 '+table+' 分类失败',cleanErr)}}
      }
    }
    alert('数据恢复失败，已尝试撤销本次已创建的门店、流水及分类：'+(e?.message||String(e)));
  }finally{btn.disabled=false}
}

        <button class="secondary" type="button" onclick="prepareBackupData().then(ok=>{const el=$('backupStatus');if(el)el.textContent=ok?'备份已准备好，可以直接点保存':'备份准备失败，请检查网络后重试'})">重新准备</button><button class="secondary" data-full-excel onclick="downloadFullExcel()">保存 Excel 备份</button>
      </div>
      <div class="actions" style="margin-top:8px"><button class="secondary" onclick="openFullBackupFile()">手机备用：打开 JSON 备份文件</button></div>
      <p class="muted" style="margin-top:10px">JSON 为完整原始业务备份；密码不会导出；凭证如保存为URL，则备份URL/路径。</p>
    </div>
    <div class="card"><h3 style="margin-top:0">数据恢复</h3><p class="muted">选择本系统 JSON 备份文件。恢复会创建新的门店并恢复从开业以来的全部历史经营数据；不会恢复股东、股东权限或用户资料。</p><div class="actions"><button class="secondary" type="button" onclick="chooseRestoreFile()">选择 JSON 备份文件</button><button id="restoreConfirmBtn" type="button" onclick="executeRestore()" disabled>确认恢复</button></div><div id="restorePreview" style="margin-top:10px"><div class="muted">尚未选择备份文件</div></div></div><div class="card"><h3 style="margin-top:0">按门店备份</h3>
      ${stores.map(st=>`<div class="actions" style="justify-content:space-between;margin:8px 0;flex-wrap:wrap"><b>${esc(st.name)}</b><span class="actions"><button class="secondary" onclick="downloadSingleStoreBackup(${st.id})">JSON</button><button class="secondary" onclick="downloadSingleStoreExcel(${st.id})">Excel</button></span></div>`).join('')}
    </div>`;
    prepareBackupData().then(ok=>{const el=$('backupStatus');if(el)el.textContent=ok?'备份已准备好，可以直接点保存':'备份准备失败，请检查网络后重试';});
  }catch(e){c.innerHTML='<div class="card"><p class="error">读取备份页面失败：'+esc(e.message)+'</p></div>'}
}
async function openFullBackupFile(){
  try{
    const backup=window.__preparedFullBackup||await buildFullBackup();
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const w=window.open(url,'_blank');
    if(!w)location.href=url;
    setTimeout(()=>URL.revokeObjectURL(url),120000);
  }catch(e){alert('打开备份失败：'+(e.message||e))}
}
function showAccount(){
 const c=$('content'),u=profile?.username||me?.email||'',site=location.href,isOwner=profile?.role==='owner';
 c.innerHTML=`<div class="card"><h2>账号设置</h2><div class="grid">
 <div><div class="muted">登录账号</div><b>${esc(u)}</b></div>
 <div><div class="muted">登录网站</div><div style="word-break:break-all">${esc(site)}</div></div>
 ${profile?.name?`<div><div class="muted">姓名</div><b>${esc(profile.name)}</b></div>`:''}
 </div>
 ${isOwner?`<div class="actions" style="margin-top:14px"><button onclick="copyText(${JSON.stringify(u+'\\n'+site)})">复制账号＋网址</button></div>`:''}
 <p class="muted" style="margin-top:12px">${isOwner?'老板可复制账号＋网址发送给员工或股东。':'这里只显示你的登录账号和登录网站，不设置复制按钮。'}</p></div>`;
}
function bindLoginEvents(){
 const loginBtn=$('loginBtn'),loginPass=$('loginPass'),staffBtn=$('staffEntryBtn');
 if(loginBtn)loginBtn.addEventListener('click',login);
 if(loginPass)loginPass.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
 if(staffBtn)staffBtn.addEventListener('click',()=>{loginMode=loginMode==='staff'?'normal':'staff';location.hash=loginMode==='staff'?'staff':'';staffBtn.textContent=loginMode==='staff'?'老板/股东入口':'门店员工入口';const h=document.querySelector('#login h2');if(h)h.textContent=loginMode==='staff'?'门店员工登录':'登录';msg('')});
 if(loginMode==='staff'){if(staffBtn)staffBtn.textContent='老板/股东入口';const h=document.querySelector('#login h2');if(h)h.textContent='门店员工登录'}
 boot();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bindLoginEvents);else bindLoginEvents();
</script><script>
function addStoreDeleteButtonIfEditing(storeId){
 const box=document.querySelector('.modalbox');
 if(!box || !storeId || box.querySelector('[data-delete-store]')) return;
 const b=document.createElement('button');
 b.type='button'; b.className='danger'; b.textContent='删除该门店'; b.setAttribute('data-delete-store','1');
 b.onclick=()=>deleteStore(storeId);
 const acts=box.querySelector('.actions');
 if(acts) acts.appendChild(b); else box.appendChild(b);
}
</script></body></html>
