<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>女装门店·合伙账务</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#202124;--muted:#73777d;--line:#e8eaed;--dark:#151515;--green:#16834a;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text)}
header{position:sticky;top:0;z-index:10;background:#151515;color:#fff;padding:15px 16px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:980px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0000000a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:12px;background:#fafafa;border-radius:12px}.num{font-size:21px;font-weight:750;margin-top:4px}.muted{color:var(--muted);font-size:13px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #dcdfe3;border-radius:10px;background:#fff}button{border:0;border-radius:10px;padding:10px 13px;background:var(--dark);color:#fff;cursor:pointer}.secondary{background:#eceef1;color:#222}.danger{background:#b42318}.green{background:#16834a}.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}.tabs button{white-space:nowrap}.tabs .active{background:#151515;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:7px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.hidden{display:none}.login{max-width:440px;margin:65px auto}.error{color:var(--red)}.success{color:var(--green)}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:30}.modalbox{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.positive{color:var(--red);font-weight:700}.negative{color:var(--green);font-weight:700}.notice{padding:11px;border-radius:10px;background:#fff8df;color:#765900;font-size:13px}
@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.stats .full{grid-column:1/-1}.row{grid-template-columns:1fr 1fr}.row .wide{grid-column:1/-1}}
</style>
<style>
.owner-tabs{display:grid!important;grid-template-columns:repeat(4,1fr);gap:8px}
.owner-tabs button{width:100%}
.fold-head{cursor:pointer}
.fold-body{margin-top:10px}
.compact-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.compact-filters label{font-size:12px;color:#73777d}
.compact-filters input{width:145px;padding:8px}
.compact-filters button{padding:8px 10px}
@media(max-width:650px){.owner-tabs{grid-template-columns:repeat(4,1fr)!important}.owner-tabs button{font-size:12px;padding:9px 4px}}
</style></head><body>
<header><b>女装门店 · 合伙账务</b><span id="userLabel"></span></header>
<div id="login" class="wrap"><div class="card login"><h2>登录</h2><p class="muted">使用 Supabase Auth 登录，账号和密码不写在网页里。</p><input id="loginAccount" placeholder="登录账号（邮箱）" autocomplete="username"><br><br><input id="loginPass" type="password" placeholder="密码" autocomplete="current-password"><br><br><button id="loginBtn" type="button">登录</button><p id="loginMsg" class="error"></p></div></div>
<div id="app" class="wrap hidden"></div><div id="modalRoot"></div>
<script>
const SUPABASE_URL='https://dqruzakkunkinecxxbny.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_igD9yDQ1KbazCNNUfnjk2Q_WBRY5J-6';
let sb=null, me=null, profile=null, period='month', storeList=[];
const $=id=>document.getElementById(id);
function money(n){return '¥'+Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showMsg(t,ok=false){
 const el=$('loginMsg'); if(el){el.textContent=t;el.className=ok?'success':'error'}
}
function initSupabase(){
 try{
  if(!window.supabase || typeof window.supabase.createClient!=='function'){
   showMsg('系统组件加载失败，请刷新页面重试');
   return false;
  }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
   auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
  });
  return true;
 }catch(e){
  showMsg('系统初始化失败：'+e.message);
  return false;
 }
}
async function loadProfile(){
 if(!sb||!me) throw new Error('云端连接尚未初始化');
 const {data,error}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();
 if(error) throw error;
 profile=data;
 const {data:stores,error:se}=await sb.from('stores').select('*').order('id');
 if(se) throw se;
 storeList=stores||[];
}
async function login(){
 const btn=$('loginBtn');
 const account=$('loginAccount').value.trim(), password=$('loginPass').value;
 if(!account||!password){showMsg('请输入账号和密码');return}
 if(!sb && !initSupabase()) return;
 if(btn){btn.disabled=true;btn.textContent='登录中…'}
 showMsg('正在连接云端…',true);
 try{
  const {data,error}=await sb.auth.signInWithPassword({email:account,password});
  if(error) throw error;
  me=data.user;
  await loadProfile();
  if(profile && profile.enabled===false){
   await sb.auth.signOut();
   throw new Error('此账号已停用');
  }
  enterApp();
 }catch(e){
  console.error('LOGIN_ERROR',e);
  showMsg('登录失败：'+(e?.message||'请检查账号和密码'));
 }finally{
  if(btn){btn.disabled=false;btn.textContent='登录'}
 }
}
async function boot(){
 try{
  if(!initSupabase()) return;
  const {data,error}=await sb.auth.getSession();
  if(error) throw error;
  if(data.session){
   me=data.session.user;
   await loadProfile();
   enterApp();
  }
 }catch(e){
  console.error('BOOT_ERROR',e);
  await sb?.auth?.signOut?.();
 }
}
function enterApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=profile?.name||me.email;render()}
async function logout(){await sb.auth.signOut();location.reload()}
function render(){
 $('app').innerHTML=`<div class="actions"><button onclick="showDashboard()">门店总览</button><button class="secondary" onclick="showAccount()">账号设置</button>${profile?.role==='owner'?'<button class="secondary" onclick="showOwnerTools()">老板后台</button>':''}<button class="secondary" onclick="logout()">退出</button></div><div id="content"></div>`;showDashboard();
}
async function showDashboard(){
 const c=document.getElementById('content');
 c.innerHTML='<div class="card">正在读取云端账务…</div>';
 try{
  await loadProfile();
  if(!storeList.length){
   c.innerHTML='<div class="card"><h2>还没有门店</h2><p class="muted">请先到老板后台新增门店。</p></div>';
   return;
  }
  const cards=await Promise.all(storeList.map(s=>buildStoreSummary(s)));
  c.innerHTML=`<div class="tabs">
   <button class="${period==='month'?'active':''}" onclick="setPeriod('month')">本月</button>
   <button class="${period==='year'?'active':''}" onclick="setPeriod('year')">本年度</button>
   <button class="${period==='life'?'active':''}" onclick="setPeriod('life')">开业至今</button>
  </div>${cards.join('')}`;
 }catch(e){
  c.innerHTML='<div class="card"><p class="error">读取失败：'+esc(e.message)+'</p></div>';
 }
}
function setPeriod(p){period=p;showDashboard()}
function num(v){return Number(v||0)}
function money2(v){return '¥'+num(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
async function buildStoreSummary(store){
 const {data,error}=await sb.from('monthly_accounts')
   .select('month_date,turnover,company_return,rent,utilities,other_expenses,profit,retained')
   .eq('store_id',store.id).order('month_date',{ascending:true});
 if(error) throw error;
 const rows=data||[];
 const now=new Date();
 const monthKey=now.toISOString().slice(0,7);
 const yearKey=String(now.getFullYear());
 const openKey=String(store.opening_date||'').slice(0,7);
 let use=rows;
 if(period==='month') use=rows.filter(r=>String(r.month_date||'').slice(0,7)===monthKey);
 else if(period==='year') use=rows.filter(r=>String(r.month_date||'').slice(0,4)===yearKey);
 else if(period==='life' && openKey) use=rows.filter(r=>String(r.month_date||'').slice(0,7)>=openKey);

 const sum=k=>use.reduce((a,r)=>a+num(r[k]),0);
 const turnover=sum('turnover');
 const companyReturn=sum('company_return');
 const profit=use.reduce((a,r)=>a+num(r.company_return)-num(r.rent)-num(r.utilities)-num(r.other_expenses),0);
 const retained=profit;
 const pcls=profit>=0?'positive':'negative';
 const rcls=retained>=0?'positive':'negative';

 return `<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
   <h2 style="margin:0">${esc(store.name||'未命名门店')}</h2>
   <span class="muted">开业：${esc(store.opening_date||'—')}</span>
  </div>
  <div class="stats" style="margin-top:12px">
   <div class="stat"><div class="muted">营业额</div><div class="num">${money2(turnover)}</div></div>
   <div class="stat"><div class="muted">公司回款</div><div class="num">${money2(companyReturn)}</div></div>
   <div class="stat full"><div class="muted">盈利</div><div class="num ${pcls}">${money2(profit)}</div></div>
   <div class="stat full"><div class="muted">门店留存</div><div class="num ${rcls}">${money2(retained)}</div></div>
  </div>
 </div>`;
}

function fmt(v){return Number(v||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
let selectedMonth=new Date().toISOString().slice(0,7),rangeStart='',rangeEnd='';
function profitOf(r){return num(r.company_return)-num(r.rent)-num(r.utilities)-num(r.other_expenses)}
function profitClass(n){return n>=0?'positive':'negative'}
function monthBounds(m){const [y,mo]=m.split('-').map(Number);return {start:m+'-01',end:new Date(y,mo,0).toISOString().slice(0,10)}}
async function rowsForStore(id,start,end){let q=sb.from('monthly_accounts').select('*').eq('store_id',id);if(start)q=q.gte('month_date',start);if(end)q=q.lte('month_date',end);const r=await q.order('month_date',{ascending:true});if(r.error)throw r.error;return r.data||[]}
function sumRows(rows){return rows.reduce((a,r)=>{a.turnover+=num(r.turnover);a.company_return+=num(r.company_return);a.rent+=num(r.rent);a.utilities+=num(r.utilities);a.other_expenses+=num(r.other_expenses);a.profit+=profitOf(r);a.retained+=num(r.retained);return a},{turnover:0,company_return:0,rent:0,utilities:0,other_expenses:0,profit:0,retained:0})}
function dashRange(){if(rangeStart&&rangeEnd)return monthBounds(rangeStart).start+'|'+monthBounds(rangeEnd).end;return ''}
async function showDashboard(){
 const c=$('content');c.innerHTML='<div class="card">正在读取云端账务…</div>';
 try{await loadProfile();if(!storeList.length){c.innerHTML='<div class="card"><h2>还没有门店</h2><p class="muted">请先到老板后台新增门店。</p></div>';return}
 let start='',end='',label='';
 if(period==='month'){const b=monthBounds(selectedMonth);start=b.start;end=b.end;label=selectedMonth}
 else if(period==='year'){start=selectedMonth.slice(0,4)+'-01-01';end=selectedMonth.slice(0,4)+'-12-31';label=selectedMonth.slice(0,4)+' 年'}
 else {start='1900-01-01';end='2999-12-31';label='开业至今'}
 const range=dashRange();if(range){[start,end]=range.split('|');label=rangeStart+' 至 '+rangeEnd}
 const cards=[];for(const s of storeList){let rows=await rowsForStore(s.id,start,end);if(period==='life'&&s.opening_date)rows=rows.filter(r=>String(r.month_date)>=String(s.opening_date).slice(0,7)+'-01');const a=sumRows(rows);cards.push(`<div class="card"><div class="section-title fold-head" onclick="toggleFold('dash_${s.id}')"><div><h2 style="margin:0">${esc(s.name||'未命名门店')}</h2><span class="muted">${esc(label)}</span></div><span>⌄</span></div><div id="dash_${s.id}" class="fold-body"><div class="section-title"><b>经营数据</b><button class="secondary" onclick="event.stopPropagation();storeDetail('${s.id}')">详情</button></div><div class="stat" style="margin-top:12px"><div class="muted">盈利</div><div class="num ${profitClass(a.profit)}">${money2(a.profit)}</div></div><div class="stats" style="margin-top:10px"><div class="stat"><div class="muted">营业额</div><div class="num">${money2(a.turnover)}</div></div><div class="stat"><div class="muted">公司回款</div><div class="num">${money2(a.companyReturn)}</div></div><div class="stat"><div class="muted">门店留存</div><div class="num ${a.retained<0?'negative':''}">${money2(a.retained)}</div></div></div></div></div>`)}
 c.innerHTML=`<div class="tabs"><button class="${period==='month'?'active':''}" onclick="setPeriod('month')">本月</button><button class="${period==='year'?'active':''}" onclick="setPeriod('year')">本年度</button><button class="${period==='life'?'active':''}" onclick="setPeriod('life')">开业至今</button></div><div class="card compact-filters"><label>月份</label><input type="month" value="${esc(selectedMonth)}" onchange="selectedMonth=this.value;rangeStart='';rangeEnd='';showDashboard()"><label>范围</label><input id="rstart" type="month" value="${esc(rangeStart||selectedMonth)}"><span>至</span><input id="rend" type="month" value="${esc(rangeEnd||selectedMonth)}"><button onclick="rangeStart=$('rstart').value;rangeEnd=$('rend').value;if(rangeStart>rangeEnd)return alert('结束月份不能早于开始月份');showDashboard()">统计</button></div>${cards.join('')}`
 }catch(e){c.innerHTML='<div class="card"><p class="error">读取失败：'+esc(e.message)+'</p></div>'}
}
function setPeriod(p){period=p;rangeStart='';rangeEnd='';showDashboard()}
function openF(title,body){$('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeF()"><div class="modalbox"><div class="section-title"><h2>${esc(title)}</h2><button class="secondary" onclick="closeF()">关闭</button></div>${body}</div></div>`}
window.closeF=()=>{$('modalRoot').innerHTML=''};
async function storeDetail(id){const s=storeList.find(x=>x.id===id);if(!s)return;try{const b=rangeStart&&rangeEnd?{start:monthBounds(rangeStart).start,end:monthBounds(rangeEnd).end}:period==='month'?monthBounds(selectedMonth):period==='year'?{start:selectedMonth.slice(0,4)+'-01-01',end:selectedMonth.slice(0,4)+'-12-31'}:{start:'1900-01-01',end:'2999-12-31'};const rows=await rowsForStore(id,b.start,b.end),a=sumRows(rows);const rb=(await sb.from('reimbursements').select('*').eq('store_id',id).order('expense_date',{ascending:false}).limit(100)).data||[];const dv=(await sb.from('store_dividends').select('*').eq('store_id',id).order('dividend_date',{ascending:false})).data||[];const tp=(await sb.from('store_topups').select('*').eq('store_id',id).order('topup_date',{ascending:false})).data||[];openF(s.name+' · 详情',`<div class="stats"><div class="stat">营业额<div class="num">${money(a.turnover)}</div></div><div class="stat">公司回款<div class="num">${money(a.company_return)}</div></div><div class="stat">盈利<div class="num ${profitClass(a.profit)}">${money(a.profit)}</div></div><div class="stat">门店留存<div class="num ${a.retained<0?'negative':''}">${money(a.retained)}</div></div></div><h3>费用</h3><p>房租：${money(a.rent)}　水电费：${money(a.utilities)}　其他费用：${money(a.other_expenses)}</p><h3>其他报销</h3>${rb.length?rb.map(x=>`<div class="row"><span>${esc(x.expense_date||x.date||'')}</span><span>${esc(x.category_name||x.category||'其他报销')}</span><b>${money(x.amount)}</b><span>${(x.receipt_url||x.proof_url)?`<a href="${esc(x.receipt_url||x.proof_url)}" target="_blank">查看凭证</a>`:''}</span></div>`).join(''):'<p class="muted">暂无报销明细</p>'}<h3>分红</h3>${dv.length?dv.map(x=>`<div class="row"><span>${esc(x.dividend_date)}</span><span>总额</span><b>${money(x.amount)}</b><span></span></div>`).join(''):'<p class="muted">暂无分红</p>'}<h3>补款</h3>${tp.length?tp.map(x=>`<div class="row"><span>${esc(x.topup_date)}</span><span>总额</span><b>${money(x.amount)}</b><span></span></div>`).join(''):'<p class="muted">暂无补款</p>'}`)}catch(e){openF('读取失败',`<p class="error">${esc(e.message)}</p>`)}}
window.showOwnerTools=async function(){if(profile?.role!=='owner')return alert('只有老板可以进入');$('content').innerHTML=`<div class="card"><h2>老板后台</h2><p class="muted">门店、月度账务、股东、分红、补款、回本、报销类别、数据备份。</p></div><div class="tabs owner-tabs"><button class="active" onclick="finalTab('stores',this)">门店</button><button onclick="finalTab('accounts',this)">月度账务</button><button onclick="finalTab('partners',this)">股东账号/股份</button><button onclick="finalTab('dividends',this)">分红</button><button onclick="finalTab('topups',this)">补款</button><button onclick="finalTab('payback',this)">回本情况</button><button onclick="finalTab('category',this)">报销类别</button><button onclick="showDataCenter()">数据备份</button></div><div id="finalBody"></div>`;finalTab('stores')}
window.finalTab=async function(tab,btn){document.querySelectorAll('#content .tabs button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');const b=$('finalBody');if(tab==='stores')return stores(b);if(tab==='accounts')return accounts(b);if(tab==='partners')return partners(b);if(tab==='dividends')return dividends(b);if(tab==='topups')return topups(b);if(tab==='payback')return payback(b);if(tab==='category')return categories(b)}
async function getStores(){const r=await sb.from('stores').select('*').eq('owner_id',me.id).order('created_at');if(r.error)throw r.error;return r.data||[]}
async function stores(b){const s=await getStores();b.innerHTML=`<div class="card"><button class="green" onclick="newStore()">＋ 新增门店</button></div>`+(s.length?s.map(x=>`<div class="card"><div class="section-title"><h3>${esc(x.name)}</h3><button class="secondary" onclick="editStore('${x.id}')">编辑</button></div><div class="grid"><div>开业：${esc(x.opening_date||'—')}</div><div>初始投入：${money(x.initial_investment)}</div><div>房租：${money(x.rent_amount)}</div><div>合同到期：${esc(x.contract_end_date||'—')}</div><div>租金押金：${money(x.rent_deposit)}</div><div>公司押金：${money(x.company_deposit)}</div><div>其他押金：${money(x.other_deposits)}</div></div></div>`).join(''):'<div class="card">还没有门店。</div>')}
function storeForm(s){openF(s?'编辑门店':'新增门店',`<div class="grid"><div><label>门店名称 *</label><input id="xname" value="${esc(s?.name||'')}"></div><div><label>开业日期 *</label><input id="xopen" type="date" value="${esc(s?.opening_date||'')}"></div><div><label>初始投入</label><input id="xinv" type="number" value="${s?.initial_investment??0}"></div><div><label>负责人</label><input id="xmgr" value="${esc(s?.manager_name||'')}"></div><div><label>地址</label><input id="xaddr" value="${esc(s?.address||'')}"></div><div><label>房租</label><input id="xrent" type="number" value="${s?.rent_amount??0}"></div><div><label>房租周期</label><select id="xcycle"><option value="monthly">每月</option><option value="quarterly">每季</option><option value="yearly">每年</option></select></div><div><label>租金缴交日</label><input id="xrdate" type="date" value="${esc(s?.rent_payment_date||'')}"></div><div><label>租金押金</label><input id="xrd" type="number" value="${s?.rent_deposit??0}"></div><div><label>公司押金</label><input id="xcd" type="number" value="${s?.company_deposit??0}"></div><div><label>其他押金</label><input id="xod" type="number" value="${s?.other_deposits??0}"></div><div><label>合同开始</label><input id="xcs" type="date" value="${esc(s?.contract_start_date||'')}"></div><div><label>合同到期</label><input id="xce" type="date" value="${esc(s?.contract_end_date||'')}"></div><div><label>合同网址</label><input id="xurl" value="${esc(s?.contract_url||'')}"></div></div><label>备注</label><textarea id="xnotes">${esc(s?.notes||'')}</textarea><br><button class="green" onclick="saveStore('${s?.id||''}')">保存</button>`);if($('xcycle'))$('xcycle').value=s?.rent_cycle||'monthly'}
window.newStore=()=>storeForm(null);window.editStore=async id=>storeForm((await getStores()).find(x=>x.id===id));window.saveStore=async id=>{const p={name:$('xname').value.trim(),opening_date:$('xopen').value||null,initial_investment:num($('xinv').value),manager_name:$('xmgr').value.trim(),address:$('xaddr').value.trim(),rent_amount:num($('xrent').value),rent_cycle:$('xcycle').value,rent_payment_date:$('xrdate').value||null,rent_deposit:num($('xrd').value),company_deposit:num($('xcd').value),other_deposits:num($('xod').value),contract_start_date:$('xcs').value||null,contract_end_date:$('xce').value||null,contract_url:$('xurl').value.trim(),notes:$('xnotes').value.trim()};if(!p.name||!p.opening_date)return alert('门店名称和开业日期必须填写');const r=id?await sb.from('stores').update(p).eq('id',id).eq('owner_id',me.id):await sb.from('stores').insert({...p,owner_id:me.id});if(r.error)return alert('保存失败：'+r.error.message);closeF();await loadProfile();stores($('finalBody'))}
async function accounts(b){const s=await getStores();const rows=[];for(const x of s){const rr=await sb.from('monthly_accounts').select('*').eq('store_id',x.id).order('month_date',{ascending:false}).limit(120);rows.push(`<div class="card"><div class="section-title"><h3>${esc(x.name)}</h3><button class="green" onclick="monthlyForm('${x.id}')">＋录入/修改月份</button></div>${(rr.data||[]).map(r=>`<div class="row"><span>${esc(String(r.month_date||'').slice(0,7))}</span><span>公司回款 ${money(r.company_return)}</span><b class="${profitClass(profitOf(r))}">${money(profitOf(r))}</b><span><button class="secondary" onclick="monthlyForm('${x.id}','${r.id}')">编辑</button></span></div>`).join('')||'<p class="muted">暂无账务</p>'}</div>`)}b.innerHTML=rows.join('')}
window.monthlyForm=async(storeId,id)=>{let r={};if(id){r=(await sb.from('monthly_accounts').select('*').eq('id',id).maybeSingle()).data||{}}
 const cats=(await sb.from('reimbursement_categories').select('*').eq('owner_id',me.id).eq('enabled',true).order('created_at')).data||[];
 const reimburse=(await sb.from('reimbursements').select('*').eq('store_id',storeId).order('expense_date',{ascending:false}).limit(100)).data||[];
 openF(id?'编辑月度账务':'新增月度账务',`<label>月份</label><input id="md" type="month" value="${esc(String(r.month_date||selectedMonth).slice(0,7))}">
 <div class="grid"><div><label>营业额</label><input id="mt" type="number" value="${num(r.turnover)}"></div><div><label>公司回款</label><input id="mc" type="number" value="${num(r.company_return)}"></div><div><label>房租</label><input id="mr" type="number" value="${num(r.rent)}"></div><div><label>水电费</label><input id="mu" type="number" value="${num(r.utilities)}"></div><div><label>其他费用</label><input id="mo" type="number" value="${num(r.other_expenses)}"></div></div>
 <p class="notice">门店留存不再手工填写：保存后自动按「公司回款 − 房租 − 水电费 − 其他费用」计算。</p>
 <div class="divider"></div><h3>本店报销</h3>
 <div class="grid"><div><label>报销日期</label><input id="rb_date" type="date" value="${today()}"></div>
 <div><label>报销类别</label><select id="rb_cat"><option value="">请选择类别</option>${cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
 <div><label>报销金额</label><input id="rb_amt" type="number" value="0"></div>
 <div><label>凭证图片</label><input id="rb_img" type="file" accept="image/*" onchange="previewReceipt(this)"></div></div>
 <textarea id="rb_note" placeholder="报销说明"></textarea><div id="receiptPreview" class="muted"></div>
 <button class="secondary" onclick="saveReimbursement('${storeId}')">保存这笔报销</button>
 <div class="divider"></div><h3>已有报销</h3>${reimburse.map(x=>`<div class="row"><span>${esc(x.expense_date||'')}</span><span>${esc(x.category_name||x.category||'报销')}</span><b>${money(x.amount)}</b><span>${x.receipt_url||x.proof_url?`<a target="_blank" href="${esc(x.receipt_url||x.proof_url)}">查看图片</a>`:''}</span></div>`).join('')||'<p class="muted">暂无报销</p>'}
 <br><button class="green" onclick="saveMonthly('${storeId}','${id||''}')">保存月度账务</button>`)
 if($('rb_cat')&&r.category_id)$('rb_cat').value=r.category_id
}
window.saveMonthly=async(storeId,id)=>{const companyReturn=num($('mc').value),rent=num($('mr').value),utilities=num($('mu').value),other=num($('mo').value),profit=companyReturn-rent-utilities-other;const p={store_id:storeId,month_date:$('md').value+'-01',turnover:num($('mt').value),company_return:companyReturn,rent,utilities,other_expenses:other,profit,retained:profit};const r=id?await sb.from('monthly_accounts').update(p).eq('id',id):await sb.from('monthly_accounts').upsert(p,{onConflict:'store_id,month_date'});if(r.error)return alert('保存失败：'+r.error.message);closeF();accounts($('finalBody'))}
let receiptDataUrl='';
window.previewReceipt=input=>{receiptDataUrl='';const f=input?.files?.[0];if(!f)return;$('receiptPreview').textContent='正在读取图片…';const rd=new FileReader();rd.onload=()=>{receiptDataUrl=rd.result;$('receiptPreview').innerHTML='<span class="success">图片已选择，可保存。</span>';};rd.readAsDataURL(f)}
window.saveReimbursement=async storeId=>{const date=$('rb_date')?.value,catId=$('rb_cat')?.value,amt=num($('rb_amt')?.value),note=$('rb_note')?.value||'';if(!date||!catId||amt<=0)return alert('请填写日期、报销类别和金额');const cat=(await sb.from('reimbursement_categories').select('*').eq('id',catId).maybeSingle()).data;const obj={store_id:storeId,expense_date:date,category_id:catId,category_name:cat?.name||'',amount:amt,note,receipt_url:receiptDataUrl||null};const r=await sb.from('reimbursements').insert(obj);if(r.error)return alert('报销保存失败：'+r.error.message);receiptDataUrl='';alert('报销已保存');monthlyForm(storeId)}
async function partners(b){const ps=(await sb.from('profiles').select('*').eq('role','partner').order('created_at')).data||[],ss=await getStores();b.innerHTML=`<div class="card"><button class="green" onclick="partnerCreateForm()">＋ 新增股东账号</button><p class="muted">每个股东在每个门店可以有不同股份。现有密码不能从 Supabase 反向读取。</p></div>`+ps.map(p=>`<div class="card"><div class="section-title"><b>${esc(p.name||p.username||p.id)}</b><span>${p.enabled===false?'已停用':'正常'}</span></div>${ss.map(s=>`<div class="two" style="margin-top:8px"><span>${esc(s.name)}</span><input id="sh_${s.id}_${p.id}" type="number" min="0" max="100" step="0.01" placeholder="股份 %"></div>`).join('')}<div class="actions" style="margin-top:8px"><button class="green" onclick="saveShares('${p.id}')">保存股份</button></div></div>`).join('')||'<div class="card">暂无股东账号</div>';for(const p of ps){const ms=(await sb.from('store_members').select('store_id,share_percent').eq('user_id',p.id)).data||[];ms.forEach(m=>{const el=$(`sh_${m.store_id}_${p.id}`);if(el)el.value=m.share_percent})}}
window.saveShares=async uid=>{for(const s of storeList){const pct=num($(`sh_${s.id}_${uid}`)?.value);const old=(await sb.from('store_members').select('id').eq('store_id',s.id).eq('user_id',uid).maybeSingle()).data;if(pct>0){const r=await sb.from('store_members').upsert({store_id:s.id,user_id:uid,share_percent:pct},{onConflict:'store_id,user_id'});if(r.error)return alert(r.error.message)}else if(old)await sb.from('store_members').delete().eq('id',old.id)}alert('股份已保存')}
function partnerCreateForm(){openF('新增股东账号','<label>姓名</label><input id="pn"><br><br><label>邮箱</label><input id="pe" type="email"><br><br><label>初始密码</label><input id="pp" type="password"><br><br><p class="notice">创建成功后只显示一次密码并提供复制；系统不会保存可读取的明文旧密码。</p><button class="green" onclick="createPartner()">创建</button>')}
window.createPartner=async()=>{const name=$('pn').value.trim(),email=$('pe').value.trim(),password=$('pp').value;if(!name||!email||password.length<6)return alert('请完整填写，密码至少6位');const ownerEmail=me.email,ownerPass=prompt('创建股东后需要恢复老板登录，请输入当前老板密码（只用于本次登录，不写入数据库）：');if(!ownerPass)return;const r=await sb.auth.signUp({email,password,options:{data:{name}}});if(r.error)return alert('创建失败：'+r.error.message);const pid=r.data.user?.id;if(!pid)return alert('创建结果异常');await sb.auth.signOut();const back=await sb.auth.signInWithPassword({email:ownerEmail,password:ownerPass});if(back.error){alert('股东已创建，但老板登录恢复失败，请重新登录老板账号。');return}me=back.data.user;await loadProfile();const pr=await sb.from('profiles').upsert({id:pid,name,role:'partner',enabled:true,username:email},{onConflict:'id'});if(pr.error)return alert('账号已创建，但资料写入失败：'+pr.error.message);closeF();openF('股东账号已创建',`<p>账号：<b id="newA">${esc(email)}</b></p><p>密码：<b id="newP">${esc(password)}</b></p><p>网址：<b id="newU">${esc(location.href)}</b></p><button onclick="copyNew()">一键复制账号＋密码＋网址</button>`)}
window.copyNew=()=>navigator.clipboard.writeText($('newA').textContent+'\n'+$('newP').textContent+'\n'+$('newU').textContent).then(()=>alert('已复制')).catch(()=>alert('复制失败，请手动复制'))
async function dividends(b){const s=await getStores(),d=(await sb.from('store_dividends').select('*').order('dividend_date',{ascending:false}).limit(200)).data||[];b.innerHTML='<div class="card"><p class="muted">分红录入的是门店本次全部股东的总额，系统按股份比例计算每位股东应得金额。</p></div>'+s.map(x=>`<div class="card"><div class="section-title"><h3>${esc(x.name)}</h3><button class="green" onclick="divForm('${x.id}')">＋登记分红</button></div>${d.filter(v=>v.store_id===x.id).map(v=>`<div class="row"><span>${esc(v.dividend_date)}</span><span>总分红</span><b>${money(v.amount)}</b><button class="secondary" onclick="divSplit('${x.id}','${v.id}')">查看拆分</button></div>`).join('')||'<p class="muted">暂无分红</p>'}</div>`).join('')}
window.divForm=id=>openF('新增股东分红',`<label>分红日期</label><input id="dd" type="date" value="${new Date().toISOString().slice(0,10)}"><label>本次全部股东分红总额</label><input id="da" type="number"><label>备注</label><textarea id="dn"></textarea><br><button class="green" onclick="saveD('${id}')">保存</button>`);window.saveD=async id=>{const r=await sb.from('store_dividends').insert({store_id:id,dividend_date:$('dd').value,amount:num($('da').value),note:$('dn').value.trim()});if(r.error)return alert(r.error.message);closeF();dividends($('finalBody'))};window.divSplit=async(storeId,id)=>{const d=(await sb.from('store_dividends').select('*').eq('id',id).maybeSingle()).data,ms=(await sb.from('store_members').select('user_id,share_percent').eq('store_id',storeId)).data||[],ids=ms.map(x=>x.user_id);const ps=ids.length?(await sb.from('profiles').select('id,name,username').in('id',ids)).data||[]:[];openF('分红拆分',`<p>总额：<b>${money(d?.amount)}</b></p>${ms.map(m=>{const p=ps.find(x=>x.id===m.user_id);return `<div class="row"><span>${esc(p?.name||p?.username||m.user_id)}</span><span>${num(m.share_percent)}%</span><b>${money(num(d?.amount)*num(m.share_percent)/100)}</b><span></span></div>`}).join('')||'<p class="muted">暂无股东股份</p>'}`)}
async function topups(b){const s=await getStores(),t=(await sb.from('store_topups').select('*').order('topup_date',{ascending:false}).limit(200)).data||[];b.innerHTML='<div class="card"><p class="muted">补款先录入门店本次总金额，再按股份比例计算各股东应承担金额。</p></div>'+s.map(x=>`<div class="card"><div class="section-title"><h3>${esc(x.name)}</h3><button class="green" onclick="topForm('${x.id}')">＋登记补款</button></div>${t.filter(v=>v.store_id===x.id).map(v=>`<div class="row"><span>${esc(v.topup_date)}</span><span>总补款</span><b>${money(v.amount)}</b><button class="secondary" onclick="topSplit('${x.id}','${v.id}')">查看拆分</button></div>`).join('')||'<p class="muted">暂无补款</p>'}</div>`).join('')}
window.topForm=id=>openF('新增补款',`<label>补款日期</label><input id="td" type="date" value="${new Date().toISOString().slice(0,10)}"><label>本次门店总补款金额</label><input id="ta" type="number"><label>备注</label><textarea id="tn"></textarea><br><button class="green" onclick="saveT('${id}')">保存</button>`);window.saveT=async id=>{const r=await sb.from('store_topups').insert({store_id:id,topup_date:$('td').value,amount:num($('ta').value),note:$('tn').value.trim()});if(r.error)return alert(r.error.message);closeF();topups($('finalBody'))};window.topSplit=async(storeId,id)=>{const t=(await sb.from('store_topups').select('*').eq('id',id).maybeSingle()).data,ms=(await sb.from('store_members').select('user_id,share_percent').eq('store_id',storeId)).data||[],ids=ms.map(x=>x.user_id),ps=ids.length?(await sb.from('profiles').select('id,name,username').in('id',ids)).data||[]:[];openF('补款拆分',`<p>总额：<b>${money(t?.amount)}</b></p>${ms.map(m=>{const p=ps.find(x=>x.id===m.user_id);return `<div class="row"><span>${esc(p?.name||p?.username||m.user_id)}</span><span>${num(m.share_percent)}%</span><b>${money(num(t?.amount)*num(m.share_percent)/100)}</b><span></span></div>`}).join('')||'<p class="muted">暂无股东股份</p>'}`)}
async function payback(b){const s=await getStores();let out='';for(const x of s){const d=(await sb.from('store_dividends').select('*').eq('store_id',x.id).order('dividend_date')).data||[],t=(await sb.from('store_topups').select('*').eq('store_id',x.id).order('topup_date')).data||[],m=(await sb.from('monthly_accounts').select('retained').eq('store_id',x.id)).data||[];const div=d.reduce((a,v)=>a+num(v.amount),0),top=t.reduce((a,v)=>a+num(v.amount),0),ret=m.reduce((a,v)=>a+num(v.retained),0),remain=num(x.initial_investment)+top-div;out+=`<div class="card"><div class="section-title fold-head" onclick="toggleFold('pay_${x.id}')"><h3>${esc(x.name)}</h3><span>⌄</span></div><div id="pay_${x.id}" class="fold-body"><div class="right"><button class="secondary" onclick="event.stopPropagation();paybackDetail('${x.id}')">详情</button></div><div class="stats"><div class="stat">初始投入<div class="num">${money(x.initial_investment)}</div></div><div class="stat">累计补款<div class="num">${money(top)}</div></div><div class="stat">累积分红<div class="num">${money(div)}</div></div><div class="stat">剩余未回本<div class="num">${money(remain)}</div></div><div class="stat">累计门店留存<div class="num ${ret<0?'negative':''}">${money(ret)}</div></div></div><p class="muted">门店留存不计入回本。</p></div>`}b.innerHTML=out||'<div class="card">暂无门店</div>'}
window.paybackDetail=async id=>{const s=storeList.find(x=>x.id===id),d=(await sb.from('store_dividends').select('*').eq('store_id',id).order('dividend_date')).data||[],t=(await sb.from('store_topups').select('*').eq('store_id',id).order('topup_date')).data||[];openF(s.name+' · 回本详情','<h3>分红明细</h3>'+(d.map(x=>`<div class="row"><span>${esc(x.dividend_date)}</span><span>分红</span><b>${money(x.amount)}</b><span></span></div>`).join('')||'<p class="muted">暂无分红</p>')+'<h3>补款明细</h3>'+(t.map(x=>`<div class="row"><span>${esc(x.topup_date)}</span><span>补款</span><b>${money(x.amount)}</b><span></span></div>`).join('')||'<p class="muted">暂无补款</p>')}
async function categories(b){const d=(await sb.from('reimbursement_categories').select('*').eq('owner_id',me.id).order('created_at')).data||[];b.innerHTML=`<div class="card"><button class="green" onclick="addCat()">＋ 新增报销类别</button></div>`+(d.map(x=>`<div class="row"><b>${esc(x.name)}</b><span>${x.enabled===false?'停用':'启用'}</span><span></span><button class="danger" onclick="delCat('${x.id}')">删除</button></div>`).join('')||'<div class="card">暂无类别</div>')}
window.addCat=async()=>{const n=prompt('请输入报销类别名称');if(!n?.trim())return;const r=await sb.from('reimbursement_categories').insert({owner_id:me.id,name:n.trim(),enabled:true});if(r.error)return alert(r.error.message);categories($('finalBody'))};window.delCat=async id=>{if(!confirm('确定删除？'))return;const r=await sb.from('reimbursement_categories').delete().eq('id',id).eq('owner_id',me.id);if(r.error)return alert(r.error.message);categories($('finalBody'))}
window.toggleFold=id=>{const el=$(id);if(el)el.classList.toggle('hidden')};
async function showAccount(){openF('账号设置',`<p>当前账号：<b>${esc(me.email)}</b></p><p>网站地址：<span id="curUrl">${esc(location.href)}</span></p><button onclick="copyAccount()">一键复制账号＋网址</button><button class="secondary" onclick="changePwForm()">修改密码</button>`)}window.copyAccount=()=>navigator.clipboard.writeText(me.email+'\n'+location.href).then(()=>alert('已复制')).catch(()=>alert('复制失败，请手动复制'));function changePwForm(){openF('修改密码','<label>新密码</label><input id="pw1" type="password"><br><br><label>再次输入</label><input id="pw2" type="password"><br><br><button onclick="changePw()">保存</button>')}window.changePw=async()=>{const a=$('pw1').value,b=$('pw2').value;if(a.length<6||a!==b)return alert('密码至少6位且两次必须一致');const r=await sb.auth.updateUser({password:a});if(r.error)return alert(r.error.message);closeF();alert('密码已修改')}
</script>

</style>

</script>
