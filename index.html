<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>女装门店·合伙账务</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#202124;--muted:#73777d;--line:#e8eaed;--dark:#151515;--green:#16834a;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text)}
header{position:sticky;top:0;z-index:10;background:#151515;color:#fff;padding:15px 16px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:980px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0000000a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:12px;background:#fafafa;border-radius:12px}.num{font-size:21px;font-weight:750;margin-top:4px}.muted{color:var(--muted);font-size:13px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #dcdfe3;border-radius:10px;background:#fff}button{border:0;border-radius:10px;padding:10px 13px;background:var(--dark);color:#fff;cursor:pointer}.secondary{background:#eceef1;color:#222}.danger{background:#b42318}.green{background:#16834a}.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:7px;overflow:visible;margin:10px 0;flex-wrap:wrap}.tabs button{white-space:nowrap}.owner-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.owner-tabs button{width:100%}.row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:7px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.hidden{display:none}.login{max-width:440px;margin:65px auto}.error{color:var(--red)}.success{color:var(--green)}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:30}.modalbox{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.positive{color:var(--red);font-weight:700}.negative{color:var(--green);font-weight:700}.notice{padding:11px;border-radius:10px;background:#fff8df;color:#765900;font-size:13px}
@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.stats .full{grid-column:1/-1}.row{grid-template-columns:1fr 1fr}.row .wide{grid-column:1/-1}}
.owner-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.owner-tabs button{width:100%;white-space:nowrap}@media(max-width:650px){.owner-tabs{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header><b>女装门店 · 合伙账务</b><span id="userLabel"></span></header>
<div id="login" class="wrap"><div class="card login"><h2>登录</h2><p class="muted">使用 Supabase Auth 登录，账号和密码不写在网页里。</p><input id="loginAccount" placeholder="登录账号（邮箱）" autocomplete="username"><br><br><input id="loginPass" type="password" placeholder="密码" autocomplete="current-password"><br><br><button id="loginBtn" type="button">登录</button><p id="loginMsg" class="error"></p></div></div>
<div id="app" class="wrap hidden"></div><div id="modalRoot"></div>
<script>
const SUPABASE_URL='https://dqruzakkunkinecxxbny.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_igD9yDQ1KbazCNNUfnjk2Q_WBRY5J-6';
let sb=null;
function initSupabase(){
  try{
    if(!window.supabase || typeof window.supabase.createClient!=='function'){
      showMsg('系统组件加载失败，请刷新页面重试');
      return false;
    }
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
      auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
    });
    return true;
  }catch(e){
    showMsg('系统初始化失败：'+(e?.message||'未知错误'));
    return false;
  }
}
let me=null, profile=null, period='month', storeList=[];
const $=id=>document.getElementById(id);
function money(n){return '¥'+Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showMsg(t,ok=false){$('loginMsg').textContent=t;$('loginMsg').className=ok?'success':'error'}
async function loadProfile(){
 const {data,error}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();
 if(error) throw error; profile=data;
 const {data:stores,error:se}=await sb.from('stores').select('*').order('id'); if(se) throw se; storeList=stores||[];
}
async function login(){
 const btn=$('loginBtn');
 const account=$('loginAccount').value.trim(), password=$('loginPass').value;
 if(!account||!password){showMsg('请输入账号和密码');return}
 if(!sb && !initSupabase()) return;
 if(btn){btn.disabled=true;btn.textContent='登录中…'}
 showMsg('正在连接云端…',true);
 try{
  const {data,error}=await sb.auth.signInWithPassword({email:account,password});
  if(error) throw error;
  me=data.user;
  await loadProfile();
  if(profile && profile.enabled===false){
    await sb.auth.signOut();
    throw new Error('此账号已停用');
  }
  enterApp();
 }catch(e){
  console.error('LOGIN_ERROR',e);
  showMsg('登录失败：'+(e?.message||'请检查账号和密码'));
 }finally{
  if(btn){btn.disabled=false;btn.textContent='登录'}
 }
}
async function boot(){
 try{
  if(!sb && !initSupabase()) return;
  const {data,error}=await sb.auth.getSession();
  if(error) throw error;
  if(data.session){
    me=data.session.user;
    await loadProfile();
    enterApp();
  }
 }catch(e){
  console.error('BOOT_ERROR',e);
  await sb?.auth?.signOut?.();
 }
}
function enterApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=profile?.name||me.email;render()}
async function logout(){await sb.auth.signOut();location.reload()}
window.showAccount=async function(){
  const c=document.getElementById('content');
  try{
    const r=await sb.from('profiles').select('name,username,role,enabled').eq('id',me.id).maybeSingle();
    if(r.error) throw r.error;
    const p=r.data||profile||{};
    c.innerHTML=`<div class="card">
      <h2>账号设置</h2>
      <label>姓名</label>
      <input id="ac_name" value="${esc(p.name||'')}">
      <br><br>
      <label>登录账号</label>
      <input value="${esc(p.username||me.email||'')}" disabled>
      <br><br>
      <label>角色</label>
      <input value="${p.role==='owner'?'老板':'合伙人'}" disabled>
      <br><br>
      <h3>修改密码</h3>
      <input id="ac_pw1" type="password" placeholder="新密码（留空不修改）">
      <br><br>
      <input id="ac_pw2" type="password" placeholder="再次输入新密码">
      <br><br>
      <button class="green" onclick="saveAccount()">保存</button>
      <button class="secondary" onclick="showDashboard()">返回</button>
      <p id="accountMsg" class="muted"></p>
    </div>`;
  }catch(e){c.innerHTML=`<div class="card error">账号设置读取失败：${esc(e.message)}</div>`;}
};
window.saveAccount=async function(){
  const name=document.getElementById('ac_name').value.trim();
  const a=document.getElementById('ac_pw1').value,b=document.getElementById('ac_pw2').value;
  if(!name){alert('姓名不能为空');return;}
  if(a||b){
    if(a.length<6){alert('新密码至少6位');return;}
    if(a!==b){alert('两次密码不一致');return;}
  }
  const r=await sb.from('profiles').update({name}).eq('id',me.id);
  if(r.error){alert('保存失败：'+r.error.message);return;}
  if(a){
    const u=await sb.auth.updateUser({password:a});
    if(u.error){alert('资料已保存，但密码修改失败：'+u.error.message);return;}
  }
  profile={...(profile||{}),name}; document.getElementById('userLabel').textContent=name;
  document.getElementById('accountMsg').textContent='保存成功';
  document.getElementById('ac_pw1').value=''; document.getElementById('ac_pw2').value='';
};

function render(){
 $('app').innerHTML=`<div class="actions"><button onclick="showDashboard()">门店总览</button><button class="secondary" onclick="showPayback()">回本情况</button>${profile?.role==='owner'?'<button class="secondary" onclick="showOwnerTools()">老板后台</button>':''}<button class="secondary" onclick="showAccount()">账号设置</button><button class="secondary" onclick="logout()">退出</button></div><div id="content"></div>`;showDashboard();
}
function dateRange(p,opening){const now=new Date(),y=now.getFullYear(),m=String(now.getMonth()+1).padStart(2,'0');if(p==='month')return{from:`${y}-${m}-01`,to:new Date(y,now.getMonth()+1,0).toISOString().slice(0,10)};if(p==='year')return{from:`${y}-01-01`,to:`${y}-12-31`};return{from:opening||'1900-01-01',to:now.toISOString().slice(0,10)}}
async function getStoreNumbers(store){const r=dateRange(period,store.opening_date);const [div,top]=await Promise.all([sb.from('store_dividends').select('amount').eq('store_id',store.id).gte('dividend_date',r.from).lte('dividend_date',r.to),sb.from('store_topups').select('amount').eq('store_id',store.id).gte('topup_date',r.from).lte('topup_date',r.to)]);if(div.error)throw div.error;if(top.error)throw top.error;const sum=a=>(a||[]).reduce((n,x)=>n+Number(x.amount||0),0);return{dividends:sum(div.data),topups:sum(top.data)}}
async function showDashboard(){
  const c=$('content');
  c.innerHTML='<div class="card">正在读取云端数据…</div>';
  try{
    await loadProfile();
    if(!storeList.length){c.innerHTML='<div class="card"><h2>还没有门店</h2><p class="muted">先到老板后台新增门店。</p></div>';return;}
    const now=new Date(), ym=now.toISOString().slice(0,7);
    c.innerHTML=`<div class="card"><h3>门店总览</h3>
      <div class="grid"><div><label>开始月份</label><input id="ovFrom" type="month" value="${ym}"></div>
      <div><label>结束月份</label><input id="ovTo" type="month" value="${ym}"></div></div>
      <br><button class="green" id="ovApply">查看统计</button>
    </div><div id="ovCards"></div>`;
    const render=async()=>{
      let from=$('ovFrom').value,to=$('ovTo').value;
      if(!from||!to){alert('请选择开始和结束月份');return;}
      if(from>to){[from,to]=[to,from];$('ovFrom').value=from;$('ovTo').value=to;}
      const fromD=from+'-01', endD=new Date(to+'-01');endD.setMonth(endD.getMonth()+1);endD.setDate(0);
      const toD=endD.toISOString().slice(0,10);
      const box=$('ovCards');box.innerHTML='';
      for(const s of storeList){
        const q=await sb.from('monthly_accounts').select('month_date,turnover,company_return,rent,utilities,other_expenses').eq('store_id',s.id).gte('month_date',fromD).lte('month_date',toD).order('month_date');
        if(q.error){box.innerHTML+=`<div class="card error">${esc(s.name)}：${esc(q.error.message)}</div>`;continue;}
        const rows=q.data||[],sum=k=>rows.reduce((a,x)=>a+Number(x[k]||0),0);
        const turnover=sum('turnover'),company=sum('company_return'),rent=sum('rent'),util=sum('utilities'),other=sum('other_expenses');
        const profit=company-rent-util-other;
        const card=document.createElement('div');card.className='card';
        card.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <div><h3 style="margin:0">${esc(s.name)}</h3><div class="muted">门店留存 <b class="${profit<0?'negative':''}">${money(profit)}</b></div></div>
          <div class="actions"><button class="secondary" data-detail>详情</button><button data-fold>折叠</button></div></div>
          <div class="ovBody" style="margin-top:10px"><div class="stats">
            <div class="stat"><div class="muted">营业额</div><div class="num">${money(turnover)}</div></div>
            <div class="stat"><div class="muted">公司回款</div><div class="num">${money(company)}</div></div>
            <div class="stat full"><div class="muted">盈利</div><div class="num ${profit<0?'negative':'positive'}">${money(profit)}</div></div>
          </div></div>`;
        card.querySelector('[data-fold]').onclick=()=>{const b=card.querySelector('.ovBody');b.style.display=b.style.display==='none'?'block':'none';};
        card.querySelector('[data-detail]').onclick=()=>showOverviewDetail(s,fromD,toD,rows);
        box.appendChild(card);
      }
    };
    $('ovApply').onclick=render;await render();
  }catch(e){c.innerHTML=`<div class="card error">读取失败：${esc(e.message)}</div>`;}
}
async function showOverviewDetail(store,fromD,toD,rows){
  const rr=await sb.from('reimbursements').select('*').eq('store_id',store.id).gte('date',fromD).lte('date',toD).order('date',{ascending:false});
  const list=rr.error?[]:(rr.data||[]);
  const sum=k=>rows.reduce((a,x)=>a+Number(x[k]||0),0);
  const cats={};list.forEach(x=>{const k=x.category||'其他';cats[k]=(cats[k]||0)+Number(x.amount||0);});
  modal(`<h2>${esc(store.name)} · 详情</h2><p class="muted">${fromD} 至 ${toD}</p>
    <div class="stat"><span>房租</span><b>${money(sum('rent'))}</b></div>
    <div class="stat"><span>水电费</span><b>${money(sum('utilities'))}</b></div>
    <h3>报销类目</h3>${Object.keys(cats).length?Object.entries(cats).map(([k,v])=>`<div class="stat"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join(''):'<p class="muted">暂无报销</p>'}
    <h3>报销详情</h3>${list.length?list.map(x=>`<div class="row"><span>${esc(x.date||'')} · ${esc(x.category||'其他')} · ${money(x.amount)}</span><span>${esc(x.note||'')}</span><span></span><button onclick="viewProof('${x.id}')">凭证</button></div>`).join(''):'<p class="muted">暂无明细</p>'}
    <br><button onclick="closeModal()">关闭</button>`);
}
window.viewProof=async function(id){
  const r=await sb.from('reimbursements').select('proof_url,note').eq('id',id).maybeSingle();
  if(r.error||!r.data){alert('读取凭证失败');return;}
  if(r.data.proof_url) window.open(r.data.proof_url,'_blank'); else alert('这笔报销没有上传图片凭证。'+(r.data.note?'\n备注：'+r.data.note:''));
}
async function showMonthlyManager(){
 const a=$('ownerArea'),ss=await getStores();if(!ss.length){a.innerHTML='<div class="notice">请先新增门店。</div>';return}
 a.innerHTML=`<div class="card"><h3>月度账单</h3><label>门店</label><select id="mlStore">${ss.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><br><br><label>月份</label><input id="mlMonth" type="month" value="${new Date().toISOString().slice(0,7)}"><div id="mlForm"></div></div>`;
 const load=async()=>{const sid=$('mlStore').value,md=$('mlMonth').value+'-01',q=await sb.from('monthly_accounts').select('*').eq('store_id',sid).eq('month_date',md).maybeSingle();if(q.error){$('mlForm').innerHTML=`<p class="error">${esc(q.error.message)}</p>`;return}const x=q.data||{};$('mlForm').innerHTML=`<br><label>营业额</label><input id="mlTurn" type="number" value="${x.turnover||0}"><br><br><label>公司回款</label><input id="mlRet" type="number" value="${x.company_return||0}"><br><br><label>房租</label><input id="mlRent" type="number" value="${x.rent||0}"><br><br><label>水电</label><input id="mlUtil" type="number" value="${x.utilities||0}"><br><br><label>其他费用</label><input id="mlOther" type="number" value="${x.other_expenses||0}"><br><br><div class="notice">盈利 = 公司回款 − 房租 − 水电 − 其他费用</div><br><button class="green" onclick="saveMonthlyBill()">保存/修改本月账单</button>`};
 $('mlStore').onchange=load;$('mlMonth').onchange=load;await load();
}
window.saveMonthlyBill=async function(){const sid=$('mlStore').value,md=$('mlMonth').value+'-01',ret=+$('mlRet').value||0,rent=+$('mlRent').value||0,util=+$('mlUtil').value||0,other=+$('mlOther').value||0,p=ret-rent-util-other;const x={store_id:sid,month_date:md,turnover:+$('mlTurn').value||0,company_return:ret,rent,utilities:util,other_expenses:other,profit:p,retained:p};const r=await sb.from('monthly_accounts').upsert(x,{onConflict:'store_id,month_date'});alert(r.error?'保存失败：'+r.error.message:'保存成功')};
function showStoreManager(){const a=$('ownerArea');if(!a)return;a.innerHTML=`<div class="actions"><button class="green" onclick="showStoreForm()">＋新增门店</button></div><div style="margin-top:10px">${storeList.length?storeList.map(s=>`<div class="row"><div><b>${esc(s.name)}</b><div class="muted">${esc(s.address||'')}</div></div><div>${money(s.initial_investment)}</div><div>${esc(s.opening_date||'')}</div><div class="actions"><button class="secondary" onclick="showStoreForm(${s.id})">编辑</button><button class="danger" onclick="deleteStore(${s.id})">删除</button></div></div>`).join(''):'<p class="muted">还没有门店。</p>'}</div>`}
function showStoreForm(id){const s=id?storeList.find(x=>x.id===id):null;modal(`<h2>${s?'编辑门店':'新增门店'}</h2><label>门店名称</label><input id="stName" value="${esc(s?.name||'')}"><br><br><label>开业日期</label><input id="stDate" type="date" value="${esc(s?.opening_date||'')}"><br><br><label>初始投入</label><input id="stInv" type="number" step="0.01" value="${Number(s?.initial_investment||0)}"><br><br><label>地址</label><input id="stAddr" value="${esc(s?.address||'')}"><br><br><label>负责人</label><input id="stMgr" value="${esc(s?.manager_name||'')}"><br><br><label>备注</label><textarea id="stNotes">${esc(s?.notes||'')}</textarea><br><br><div class="actions"><button onclick="saveStore(${id||'null'})">保存</button><button class="secondary" onclick="closeModal()">取消</button></div><p id="formMsg"></p>`)}
async function saveStore(id){const payload={name:$('stName').value.trim(),opening_date:$('stDate').value||null,initial_investment:Number($('stInv').value||0),address:$('stAddr').value.trim()||null,manager_name:$('stMgr').value.trim()||null,notes:$('stNotes').value.trim()||null};if(!payload.name){$('formMsg').textContent='请填写门店名称';return}const{error}=id?await sb.from('stores').update(payload).eq('id',id):await sb.from('stores').insert({...payload,owner_id:me.id});$('formMsg').textContent=error?'保存失败：'+error.message:'保存成功';$('formMsg').className=error?'error':'success';if(!error)setTimeout(async()=>{closeModal();await loadProfile();showStoreManager()},500)}
async function deleteStore(id){if(!confirm('确定删除这家门店吗？'))return;const{error}=await sb.from('stores').delete().eq('id',id);if(error)alert('删除失败：'+error.message);else{await loadProfile();showStoreManager()}}
function showPartnerManager(){$('ownerArea').innerHTML='<div class="notice">合伙人账号创建/重置密码需要安全后端函数。这里下一步接入：账号、门店、每店股份、18项权限。</div>'}
async function showDividendManager(){const a=$('ownerArea');const ss=await getStores();a.innerHTML=`<div class="card"><h3>分红记录</h3>${ss.map(s=>`<div class="row"><b>${esc(s.name)}</b><button onclick="showDividendForm(${s.id})">＋登记分红</button></div>`).join('')}</div>`}
async function showTopupManager(){const a=$('ownerArea');const ss=await getStores();a.innerHTML=`<div class="card"><h3>补款记录</h3>${ss.map(s=>`<div class="row"><b>${esc(s.name)}</b><button onclick="showTopupForm(${s.id})">＋登记补款</button></div>`).join('')}</div>`}
async function showCategoryManager(){
  const a=$('ownerArea'),r=await sb.from('reimbursement_categories').select('*').order('created_at');
  if(r.error){a.innerHTML=`<div class="error">${esc(r.error.message)}</div>`;return;}
  a.innerHTML=`<div class="card"><h3>报销类目</h3><div class="actions"><input id="newCat" placeholder="例如：交通、餐费、采购"><button class="green" onclick="addReimbCategory()">新增</button></div></div>`+
  (r.data||[]).map(x=>`<div class="row"><span>${esc(x.name)}</span><span></span><span>${x.enabled===false?'已停用':'启用'}</span><button onclick="toggleReimbCategory(${x.id},${x.enabled===false})">${x.enabled===false?'启用':'停用'}</button></div>`).join('');
}
window.addReimbCategory=async function(){const name=$('newCat').value.trim();if(!name)return;const r=await sb.from('reimbursement_categories').insert({name,enabled:true});if(r.error)alert('新增失败：'+r.error.message);else showCategoryManager()};
window.toggleReimbCategory=async function(id,en){const r=await sb.from('reimbursement_categories').update({enabled:en}).eq('id',id);if(r.error)alert('操作失败：'+r.error.message);else showCategoryManager()};

window.saveSh=async(s,u)=>{const v=Number($(`sh_${s}_${u}`).value||0);if(v<0||v>100){alert('股份必须在0%到100%之间');return;}const r=await sb.from('store_members').upsert({store_id:s,user_id:u,share_percent:v},{onConflict:'store_id,user_id'});alert(r.error?'保存失败：'+r.error.message:'股份已保存');};
window.newPartner=function(){
  modal(`<h2>新增合伙人</h2><label>姓名</label><input id="npName"><br><br><label>登录账号（邮箱）</label><input id="npEmail" type="email"><br><br><label>密码</label><input id="npPass" type="password"><br><br><button class="green" onclick="createPartner()">创建并生成账号资料</button><p class="muted">密码只在创建时显示，系统不会从 Supabase 读取旧密码。</p>`);
};
window.createPartner=async function(){
  const name=$('npName').value.trim(),email=$('npEmail').value.trim(),password=$('npPass').value;
  if(!name||!email||password.length<6){alert('请填写姓名、邮箱；密码至少6位');return;}
  const old=(await sb.auth.getSession()).data.session;
  const r=await sb.auth.signUp({email,password});
  if(r.error){alert('创建失败：'+r.error.message);return;}
  const uid=r.data?.user?.id;if(!uid){alert('创建失败：没有返回账号ID');return;}
  const pr=await sb.from('profiles').insert({id:uid,name,username:email,role:'partner',enabled:true});
  if(pr.error){alert('账号已创建，但资料写入失败：'+pr.error.message);return;}
  if(old) await sb.auth.setSession({access_token:old.access_token,refresh_token:old.refresh_token});
  const url=location.href.split('#')[0];
  closeModal();
  modal(`<h2>合伙人账号已创建</h2><p><b>账号：</b>${esc(email)}</p><p><b>密码：</b>${esc(password)}</p><p><b>登录网址：</b>${esc(url)}</p><div class="actions"><button class="green" onclick="copyCredentials('${esc(email)}','${esc(password)}','${esc(url)}')">一键复制账号＋密码＋网址</button><button onclick="closeModal()">关闭</button></div><p class="muted">建议复制后发给合伙人，让他自己打开网址登录。</p>`);
  showPartnerManager();
};
window.copyCredentials=async function(e,p,u){const t=`登录网址：${u}\n账号：${e}\n密码：${p}`;try{await navigator.clipboard.writeText(t);alert('已复制');}catch(_){prompt('复制下面内容：',t)}};

window.showAccount=async function(){showAccountManager()};
async function showAccountManager(){
  const c=$('ownerArea')||$('content');
  const r=await sb.from('profiles').select('name,username,role,enabled').eq('id',me.id).maybeSingle();
  const p=r.data||profile||{};
  c.innerHTML=`<div class="card"><h3>账号设置</h3><label>姓名</label><input id="acName" value="${esc(p.name||'')}"><br><br><label>登录账号</label><input value="${esc(p.username||me.email||'')}" disabled><br><br><label>角色</label><input value="${p.role==='owner'?'老板':'合伙人'}" disabled><br><br><label>新密码（可选）</label><input id="acPw1" type="password"><br><br><label>确认新密码</label><input id="acPw2" type="password"><br><br><button class="green" onclick="saveAccount()">保存</button><button class="secondary" onclick="copyCurrentAccount()">复制账号＋网址</button><p id="accountMsg" class="muted"></p></div>`;
}
window.saveAccount=async function(){
 const name=$('acName').value.trim(),a=$('acPw1').value,b=$('acPw2').value;
 if(!name){alert('姓名不能为空');return} if(a||b){if(a.length<6){alert('密码至少6位');return}if(a!==b){alert('两次密码不一致');return}}
 let r=await sb.from('profiles').update({name}).eq('id',me.id);if(r.error){alert('保存失败：'+r.error.message);return}
 if(a){r=await sb.auth.updateUser({password:a});if(r.error){alert('资料已保存，但密码修改失败：'+r.error.message);return}}
 profile={...(profile||{}),name};$('userLabel').textContent=name;$('accountMsg').textContent='保存成功';
};
window.copyCurrentAccount=async function(){const u=location.href.split('#')[0],t=`登录网址：${u}\n账号：${me.email}`;try{await navigator.clipboard.writeText(t);alert('已复制账号和网址。当前密码出于安全原因不会自动读取。')}catch(_){prompt('复制下面内容：',t)}};
