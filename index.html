async function fetchPartnerData(){
 const [ma,ds,re,di,tu]=await Promise.all([
  sb.from('monthly_accounts').select('store_id,month_date,company_return,rent,utilities,other_expenses,profit,retained,notes').order('month_date'),
  sb.from('daily_sales').select('store_id,sales_date,amount').order('sales_date'),
  fetchReimbursements(),
  sb.from('store_dividends').select('store_id,dividend_date,amount,note').order('dividend_date'),
  sb.from('store_topups').select('store_id,topup_date,amount,note').order('topup_date')
 ]);
 for(const x of [ma,ds,re,di,tu])if(x?.error)throw x.error;
 return {monthly:ma.data||[],daily:ds.data||[],reimbursements:Array.isArray(re)?re:(re?.data||[]),dividends:di.data||[],topups:tu.data||[]};
}

}
async function showPartnerStoreDetail(storeId){const st=stores.find(x=>Number(x.id)===Number(storeId));if(!st)return;const {data:p}=await sb.from('partner_permissions').select('*').eq('user_id',me.id).eq('store_id',storeId).maybeSingle();const all=await fetchPartnerData();const [start,end]=partnerBounds(st);const ma=all.monthly.filter(x=>Number(x.store_id)===Number(storeId)&&inBounds(x.month_date,start,end));const ds=all.daily.filter(x=>Number(x.store_id)===Number(storeId)&&inBounds(x.sales_date,start,end));const re=all.reimbursements.filter(x=>Number(x.store_id)===Number(storeId)&&inBounds(x.expense_date,start,end));const di=all.dividends.filter(x=>Number(x.store_id)===Number(storeId)&&inBounds(x.dividend_date,start,end));const share=(await sb.from('store_members').select('share_percent').eq('user_id',me.id).eq('store_id',storeId).maybeSingle()).data?.share_percent||0;const tu=all.topups.filter(x=>Number(x.store_id)===Number(storeId)&&inBounds(x.topup_date,start,end));const divTotal=di.reduce((a,x)=>a+n(x.amount),0);const topTotal=tu.reduce((a,x)=>a+n(x.amount),0);const parts=[];if(p?.view_turnover!==false)parts.push(`<div><b>营业额</b><div>${money(ds.reduce((a,x)=>a+n(x.amount),0))}</div></div>`);if(p?.view_company_return!==false)parts.push(`<div><b>公司回款</b><div>${money(ma.reduce((a,x)=>a+n(x.company_return),0))}</div></div>`);if(p?.view_rent!==false)parts.push(`<div><b>房租</b><div>${money(ma.reduce((a,x)=>a+n(x.rent),0))}</div></div>`);if(p?.view_utilities!==false)parts.push(`<div><b>水电费</b><div>${money(ma.reduce((a,x)=>a+n(x.utilities),0))}</div></div>`);if(p?.view_expenses!==false)parts.push(`<div><b>其他费用+报销</b><div>${money(ma.reduce((a,x)=>a+n(x.other_expenses),0)+re.reduce((a,x)=>a+n(x.amount),0))}</div></div>`);const profit=ma.reduce((a,x)=>a+n(x.company_return)-n(x.rent)-n(x.utilities)-n(x.other_expenses),0)-re.reduce((a,x)=>a+n(x.amount),0);if(p?.view_profit!==false)parts.push(`<div><b>盈利</b><div class="${profit>=0?'positive':'negative'}">${money(profit)}</div></div>`);if(p?.view_dividends!==false)parts.push(`<div><b>本期间我应得分红</b><div class="positive">${money(divTotal*n(share)/100)}</div></div>`);if(p?.view_initial_investment!==false)parts.push(`<div><b>初始投入</b><div>${money(st.initial_investment)}</div></div>`);if(p?.view_contributions!==false)parts.push(`<div><b>期间补款</b><div>${money(topTotal)}</div></div>`);if(p?.view_payback!==false)parts.push(`<div><b>剩余未回本</b><div class="${n(st.initial_investment)+topTotal-divTotal>=0?'positive':'negative'}">${money(n(st.initial_investment)+topTotal-divTotal)}</div></div>`);if(p?.view_contracts!==false)parts.push(`<div><b>门店资料</b><div>${esc(st.address||'已授权查看')}</div></div>`);let extra='';if(p?.view_history!==false){extra+=`<h3>期间账务</h3>${ma.map(x=>`<div class="row"><div>${esc(String(x.month_date).slice(0,7))}</div><div>回款 ${money(x.company_return)}</div><div>房租 ${money(x.rent)}</div><div>水电 ${money(x.utilities)}</div><div class="wide">其他 ${money(x.other_expenses)} · ${x.notes?esc(x.notes):''}</div></div>`).join('')||'<div class="muted">暂无月度账务</div>'} `}if(p?.view_expenses!==false){extra+=`<h3>报销明细</h3>${re.map(x=>`<div class="row"><div>${esc(x.expense_date)}</div><div>${money(x.amount)}</div><div class="wide">${esc(x.note||'')} ${x.receipt_url&&p?.view_receipts!==false?`· <a target="_blank" href="${esc(x.receipt_url)}">查看凭证</a>`:''}</div></div>`).join('')||'<div class="muted">暂无报销</div>'}`}if(p?.view_dividends!==false){extra+=`<h3>分红明细</h3>${di.map(x=>`<div class="row"><div>${esc(x.dividend_date)}</div><div>总分红 ${money(x.amount)}</div><div class="positive">我应得 ${money(n(x.amount)*n(share)/100)}</div></div>`).join('')||'<div class="muted">暂无分红记录</div>'}`};modal(`${st.name} · 数据详情`,`<div class="muted">我的股份：${n(share)}% · ${partnerPeriodMode==='month'?'本月':partnerPeriodMode==='year'?'本年度':partnerPeriodMode==='range'?'所选范围':'开业至今'}</div><div class="grid" style="margin-top:12px">${parts.join('')}</div>${extra}`)}

async function showSalesCalendar(storeId,initialMonth){
 const s=stores.find(x=>x.id===Number(storeId)); if(!s){alert('门店不存在');return}
 const nowYm=monthNow();
 let ym=String(initialMonth||nowYm).slice(0,7);
 const opening=String(s.opening_date||'0001-01-01').slice(0,7);
 if(ym<opening)ym=opening;
 const first=new Date(ym+'-01T00:00:00'),year=first.getFullYear(),month=first.getMonth(),next=new Date(year,month+1,1);
 const {data,error}=await sb.from('daily_sales').select('id,sales_date,amount').eq('store_id',storeId).gte('sales_date',ym+'-01').lt('sales_date',next.toISOString().slice(0,10)).order('sales_date');
 if(error){alert('读取每日业绩失败：'+error.message);return}
 const map=Object.fromEntries((data||[]).map(x=>[x.sales_date,x]));
 const days=new Date(year,month+1,0).getDate(),offset=first.getDay(),head=['日','一','二','三','四','五','六'];
 let cells=head.map(x=>`<div class="calhead">${x}</div>`).join('');
 for(let i=0;i<offset;i++)cells+='<div class="calday empty"></div>';
 for(let d=1;d<=days;d++){
  const date=ym+'-'+String(d).padStart(2,'0'),r=map[date],isToday=date===today();
  cells+=`<div class="calday ${isToday?'today':''}" onclick="ownerEditDailySale(${storeId},'${date}',${r?JSON.stringify(r.amount):'null'})"><div class="d">${d}日</div><div class="amt">${r?'¥'+n(r.amount).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}):'未录入'}</div><button class="secondary" style="padding:3px 6px;font-size:11px;margin-top:4px" onclick="event.stopPropagation();ownerEditDailySale(${storeId},'${date}',${r?JSON.stringify(r.amount):'null'})">修改</button></div>`
 }
 const total=(data||[]).reduce((a,x)=>a+n(x.amount),0);
 let months=[],cur=new Date(nowYm+'-01T00:00:00'),min=new Date(opening+'-01T00:00:00');
 while(cur>=min){months.push(cur.toISOString().slice(0,7));cur.setMonth(cur.getMonth()-1)}
 const opts=months.map(m=>`<option value="${m}" ${m===ym?'selected':''}>${m.slice(0,4)}年${Number(m.slice(5))}月${m===nowYm?'（本月）':''}</option>`).join('');
 modal(`${esc(s.name)} · 每日营业额`,`<div class="notice">老板可以查看、录入、修改任何历史月份；员工历史月份只能查看，避免误触改动已结算数据。</div><div class="actions" style="margin-top:12px"><select onchange="showSalesCalendar(${storeId},this.value)">${opts}</select><button class="secondary" onclick="showSalesCalendar(${storeId},monthNow())">回到本月</button></div><div class="stat" style="margin-top:12px"><div class="muted">${year}年${month+1}月累计营业额</div><div class="num">¥${total.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}</div></div><div class="muted" style="margin-top:10px">老板后台：点击日期可修改；也可使用下方“修改”按钮。</div><div class="calendar" style="margin-top:12px">${cells}</div>`);
}

function periodControls(){return `<div class="card"><div class="actions"><button class="${periodMode==='month'?'':'secondary'}" onclick="setPeriod('month')">本月</button><button class="${periodMode==='year'?'':'secondary'}" onclick="setPeriod('year')">本年度</button><button class="${periodMode==='range'?'':'secondary'}" onclick="setPeriod('range')">月份范围</button><button class="${periodMode==='life'?'':'secondary'}" onclick="setPeriod('life')">开业至今</button></div>${periodMode==='range'?`<div class="grid" style="margin-top:10px"><div><div class="muted">开始月份</div><input id="rangeStart" type="month" value="${esc(rangeStart||monthNow())}"></div><div><div class="muted">结束月份</div><input id="rangeEnd" type="month" value="${esc(rangeEnd||monthNow())}"></div><div style="align-self:end"><button onclick="applyRange()">查询</button></div></div>`:''}</div>`}
function setPeriod(x){periodMode=x;showDashboard()}
function applyRange(){rangeStart=$('rangeStart').value;rangeEnd=$('rangeEnd').value;if(!rangeStart||!rangeEnd||rangeStart>rangeEnd){alert('请选择正确的月份范围');return}showDashboard()}
function nextMonth(ym){
 const [y,m]=String(ym).split('-').map(Number);
 const d=new Date(y,m-1,1); d.setMonth(d.getMonth()+1);
 return d.toISOString().slice(0,7);
}
function modal(title,body){

function closeModal(){

 if(root) root.innerHTML='';

function periodBounds(store){const now=monthNow();if(periodMode==='month')return [now+'-01',nextMonth(now)+'-01'];if(periodMode==='year'){const opening=String(store.opening_date||'').slice(0,10);const start=opening?opening.slice(0,7)+'-01':now+'-01';return [start,nextMonth(now)+'-01']}if(periodMode==='range'){const a=rangeStart||now,b=rangeEnd||now;return [a+'-01',nextMonth(b)+'-01']}return [String(store.opening_date||'0001-01-01').slice(0,10),nextMonth(now)+'-01']}
async function fetchReimbursements(storeId=null){
 let q=sb.from('reimbursements').select('id,store_id,expense_date,amount,category_id,note,receipt_url').order('expense_date',{ascending:false});
 if(storeId!==null&&storeId!==undefined)q=q.eq('store_id',Number(storeId));
 const {data,error}=await q;
 if(error)throw error;
 return data||[];
}
function reimbursementsInPeriod(rows,storeId,start,end){
 return (rows||[]).filter(r=>Number(r.store_id)===Number(storeId)&&inBounds(r.expense_date,start,end));
}
function reimbursementTotal(rows,storeId,start,end){
 return reimbursementsInPeriod(rows,storeId,start,end).reduce((a,r)=>a+n(r.amount),0);
}

async function fetchDashboardData(){
 const [ma,di,ds,re]=await Promise.all([
  sb.from('v_monthly_accounts').select('store_id,month_date,company_return,rent,utilities,other_expenses').order('month_date'),
  sb.from('v_store_dividends').select('store_id,dividend_date,amount').order('dividend_date'),
  sb.from('daily_sales').select('store_id,sales_date,amount').order('sales_date'),
  fetchReimbursements()
 ]);
 if(ma.error)throw ma.error;if(di.error)throw di.error;if(ds.error)throw ds.error;if(re.error)throw re.error;
 return {monthly:ma.data||[],dividends:di.data||[],dailySales:ds.data||[],reimbursements:Array.isArray(re)?re:(re?.data||[])};

function dateKey(v){const s=String(v??'').trim();const m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);return m?m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0'):''}
function inBounds(date,start,end){const d=dateKey(date),a=dateKey(start),b=dateKey(end);return !!d&&(!a||d>=a)&&(!b||d<b)}
async function refreshOwnerLive(){

 try{
  if(window.activePage==='monthly')await showMonthly();
  else if(window.activePage==='reimbursements')await showReimbursements();
  else if(window.activePage==='payback')await showPayback();
  else await showDashboard();
 }catch(e){console.warn('老板实时刷新失败',e)}finally{ownerRefreshBusy=false}
}
function subscribeOwnerRealtime(){
 if(!sb||profile?.role!=='owner')return;
 if(!ownerRealtime){
  ownerRealtime=sb.channel('owner-live-data')
   .on('postgres_changes',{event:'*',schema:'public',table:'daily_sales'},refreshOwnerLive)
   .on('postgres_changes',{event:'*',schema:'public',table:'reimbursements'},refreshOwnerLive)
   .on('postgres_changes',{event:'*',schema:'public',table:'monthly_accounts'},refreshOwnerLive)
   .on('postgres_changes',{event:'*',schema:'public',table:'store_dividends'},refreshOwnerLive)
   .on('postgres_changes',{event:'*',schema:'public',table:'store_topups'},refreshOwnerLive)
   .subscribe((status)=>{
    window.ownerRealtimeStatus=status;
    if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){try{sb.removeChannel(ownerRealtime)}catch(e){}ownerRealtime=null;setTimeout(()=>{if(profile?.role==='owner')subscribeOwnerRealtime()},1500)}
   });
 }
 if(!ownerRefreshTimer)ownerRefreshTimer=setInterval(()=>{if(['dashboard','monthly','reimbursements','payback'].includes(window.activePage)&&document.visibilityState==='visible')refreshOwnerLive()},5000);
}

async function savePermissions(uid){
 const fields=['view_turnover','view_company_return','view_rent','view_utilities','view_expenses','view_receipts','view_profit','view_retained','view_payback','view_dividends','view_contributions','view_contracts','view_initial_investment','view_history'];
 try{
  const {data:shares,error:se}=await sb.from('store_members').select('store_id,share_percent').eq('user_id',uid).gt('share_percent',0);
  if(se)throw se;
  const allowed=new Set((shares||[]).map(x=>Number(x.store_id)));
  for(const st of stores){
   if(!allowed.has(Number(st.id))){
    const {error}=await sb.from('partner_permissions').delete().eq('user_id',uid).eq('store_id',st.id);
    if(error)throw error;
    continue;
   }
   const obj={user_id:uid,store_id:st.id};
   for(const k of fields){
    const el=document.querySelector(`[data-perm-store="${st.id}"][data-perm-key="${k}"]`);
    obj[k]=!!el?.checked;
   }
   const {error}=await sb.from('partner_permissions').upsert(obj,{onConflict:'user_id,store_id'});
   if(error)throw error;
  }
  closeModal();await showPartners();
 }catch(e){alert('保存权限失败：'+(e.message||e))}
}
async function setShares(uid){const {data:m,error}=await sb.from('store_members').select('store_id,share_percent').eq('user_id',uid);if(error){alert('读取股份失败：'+error.message);return}const map=Object.fromEntries((m||[]).map(x=>[x.store_id,x.share_percent]));modal('设置门店股份',`${stores.map(s=>{const has=Object.prototype.hasOwnProperty.call(map,s.id);return `<div class="grid" style="margin-bottom:8px"><div>${esc(s.name)}</div><div><input id="share_${s.id}" type="number" min="0" max="100" step="0.01" value="${has?esc(map[s.id]):''}" placeholder="未参与"></div></div>`}).join('')}<p class="muted">没有股份请留空；填写 0 保存后会自动取消该店参与资格。</p><button onclick="saveShares('${uid}')">保存股份</button>`)}async function saveShares(uid){
 try{
  const defaultFields=['view_turnover','view_company_return','view_rent','view_utilities','view_expenses','view_receipts','view_profit','view_retained','view_payback','view_dividends','view_contributions','view_contracts','view_initial_investment','view_history'];
  for(const s of stores){
   const el=$('share_'+s.id); const v=el?el.value.trim():'';
   if(v===''){
    const {error}=await sb.from('store_members').delete().eq('user_id',uid).eq('store_id',s.id);
    if(error)throw error;
    const {error:pe}=await sb.from('partner_permissions').delete().eq('user_id',uid).eq('store_id',s.id);
    if(pe)throw pe;
    continue;
   }
   const pct=n(v);if(pct<0||pct>100)throw Error('股份必须在0-100%');
   if(pct===0){
    const {error}=await sb.from('store_members').delete().eq('user_id',uid).eq('store_id',s.id);
    if(error)throw error;
    const {error:pe}=await sb.from('partner_permissions').delete().eq('user_id',uid).eq('store_id',s.id);
    if(pe)throw pe;
   }else{
    const {error}=await sb.from('store_members').upsert({store_id:s.id,user_id:uid,share_percent:pct},{onConflict:'store_id,user_id'});
    if(error)throw error;
    const {data:existing,error:qe}=await sb.from('partner_permissions').select('id').eq('user_id',uid).eq('store_id',s.id).maybeSingle();
    if(qe)throw qe;
    if(!existing){
      const obj={user_id:uid,store_id:s.id};
      defaultFields.forEach(k=>obj[k]=true);
      const {error:pe}=await sb.from('partner_permissions').insert(obj);
      if(pe)throw pe;
    }
   }
  }
  closeModal();await showPartners();
 }catch(e){alert('保存股份失败：'+(e.message||e))}
}

async function saveStore(id){
  try{
    const num=v=>{const x=String(v??'').trim();return x===''?null:Number(x)};
    const val=k=>$(k)?.value??'';
    const obj={
      name:val('s_name').trim(),
      opening_date:val('s_open')||null,
      initial_investment:num(val('s_inv')),
      address:val('s_addr').trim()||null,
      manager_name:val('s_mgr').trim()||null,
      notes:val('s_note').trim()||null,
      rent_amount:num(val('s_rent')),
      rent_cycle:val('s_cycle').trim()||null,
      rent_payment_date:val('s_rpd')||null,
      rent_deposit:num(val('s_rd')),
      company_deposit:num(val('s_cd')),
      other_deposit:num(val('s_od')),
      other_deposits:num(val('s_ods')),
      contract_start_date:val('s_cs')||null,
      contract_end_date:val('s_ce')||null,
      contract_expiry_date:val('s_ce')||null,
      important_documents:val('s_docs').trim()||null
    };
    if(!obj.name){alert('请输入门店名称');return}
    if(!me?.id || profile?.role!=='owner'){alert('只有老板可以编辑门店');return}
    let error=null,data=null;
    if(id){
      const r=await sb.from('stores').update(obj).eq('id',id).eq('owner_id',me.id);
      error=r.error;
      if(!error){
        const r2=await sb.from('v_stores').select('*').eq('id',id).maybeSingle();
        error=r2.error; data=r2.data;
      }
    }else{
      const r=await sb.from('stores').insert({...obj,owner_id:me.id});
      error=r.error;
      if(!error){
        const r2=await sb.from('v_stores').select('*').order('id',{ascending:false}).limit(1).maybeSingle();
        error=r2.error; data=r2.data;
      }
    }
    if(error) throw error;
    if(!data) throw new Error('没有更新到门店数据，请确认当前账号是老板且门店属于老板账号');
    const idx=stores.findIndex(x=>x.id===data.id);
    if(idx>=0) stores[idx]=data; else stores.push(data);
    closeModal();
    showStoresAdmin();
  }catch(e){
    console.error('saveStore',e);
    alert('门店保存失败：'+(e?.message||String(e)));
  }
}
async function backupQuery(table){
  const {data,error}=await sb.from(table).select('*');
  if(error)throw new Error('备份读取 '+table+' 失败：'+error.message);
  return data||[];
}
async function shareOrDownloadBlob(filename,blob,mime,title){
 const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
 if(isMobile&&typeof navigator.share==='function'){
  try{
   const f=new File([blob],filename,{type:mime});
   if(!navigator.canShare||navigator.canShare({files:[f]})){
    await navigator.share({files:[f],title:title||'女装门店数据备份',text:'请选择“存储到文件”保存'});
    return 'shared';
   }
  }catch(e){if(e?.name==='AbortError')return 'cancelled';console.warn('系统分享失败',e)}
 }
 const url=URL.createObjectURL(blob);
 if(isMobile){
  const w=window.open(url,'_blank');
  if(!w)location.href=url;
  setTimeout(()=>URL.revokeObjectURL(url),120000);
  return 'open';
 }
 const a=document.createElement('a');a.href=url;a.download=filename;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
 return 'downloaded';
}
async function downloadJson(filename,obj){
 const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'});
 return shareOrDownloadBlob(filename,blob,'application/json','女装门店 JSON 数据备份');
}

function backupStoreData(storeId,all){
  const store=all.stores.find(x=>Number(x.id)===Number(storeId));
  if(!store)throw new Error('门店不存在');
  const byStore=(arr)=>arr.filter(x=>Number(x.store_id)===Number(storeId));
  const memberUserIds=byStore(all.store_members).map(x=>x.user_id);
  const permissionUserIds=byStore(all.partner_permissions).map(x=>x.user_id);
  const userIds=[...new Set([...memberUserIds,...permissionUserIds])];
  const staff=byStore(all.store_staff);
  staff.forEach(x=>{if(x.user_id)userIds.push(x.user_id)});
  const profiles=all.profiles.filter(x=>userIds.includes(x.id));
  return {
    backup_format:'fashion-store-accounting-backup',
    backup_version:'1.0',
    exported_at:new Date().toISOString(),
    scope:'single_store',
    store,
    data:{
      store_members:byStore(all.store_members),
      partner_permissions:byStore(all.partner_permissions),
      store_staff:staff,
      daily_sales:byStore(all.daily_sales),
      monthly_accounts:byStore(all.monthly_accounts),
      store_monthly:byStore(all.store_monthly),
      reimbursements:byStore(all.reimbursements),
      expenses:byStore(all.expenses),
      dividends:byStore(all.dividends),
      store_dividends:byStore(all.store_dividends),
      contributions:byStore(all.contributions),
      store_topups:byStore(all.store_topups),
      profiles,
      expense_categories:all.expense_categories,
      reimbursement_categories:all.reimbursement_categories
    },
    note:'包含门店开业至今数据库中与该门店关联的全部公开业务数据；凭证字段中的图片通常以URL/存储路径形式保存，不包含登录密码。'
  };
}
async function buildFullBackup(){
  const tables=['stores','store_members','partner_permissions','store_staff','daily_sales','monthly_accounts','store_monthly','reimbursements','expenses','dividends','store_dividends','contributions','store_topups','profiles','expense_categories','reimbursement_categories'];
  const result={};
  for(const t of tables)result[t]=await backupQuery(t);
  return {
    backup_format:'fashion-store-accounting-backup',
    backup_version:'1.0',
    exported_at:new Date().toISOString(),
    scope:'all_stores',
    store_count:result.stores.length,
    stores:result.stores,
    data:result,
    note:'这是系统全量业务数据备份。包含各门店开业至今的每日营业额、月度账务、公司回款、房租、水电、其他费用、报销、分红、补款、股份、权限、门店资料等。登录密码不会被导出；凭证图片若以URL保存，则备份其URL/路径。'
  };
}
async function downloadFullBackup(){
  try{
    const backup=window.__preparedFullBackup;
    if(!backup){alert(window.__backupPreparing?'备份正在准备，请等“备份已准备好”后再点保存。':('备份数据准备失败：'+(window.__backupError||'请点击“重新准备”')));return}
    const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json;charset=utf-8'});
    const filename='女装门店_全量数据备份_'+stamp+'.json';
    const f=new File([blob],filename,{type:'application/json'});
    if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)&&typeof navigator.share==='function'){
      try{
        const can=!navigator.canShare||navigator.canShare({files:[f]});
        if(can){await navigator.share({files:[f],title:'女装门店全量数据备份',text:'请选择“存储到文件”保存'});return}
      }catch(e){if(e?.name==='AbortError')return;console.warn('系统分享失败',e)}
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),120000);
  }catch(e){alert('备份失败：'+(e.message||e))}
}
