<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>女装门店·合伙账务</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#202124;--muted:#73777d;--line:#e8eaed;--dark:#151515;--green:#16834a;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text)}
header{position:sticky;top:0;z-index:10;background:#151515;color:#fff;padding:15px 16px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:980px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0000000a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:12px;background:#fafafa;border-radius:12px}.num{font-size:21px;font-weight:750;margin-top:4px}.muted{color:var(--muted);font-size:13px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #dcdfe3;border-radius:10px;background:#fff}button{border:0;border-radius:10px;padding:10px 13px;background:var(--dark);color:#fff;cursor:pointer}.secondary{background:#eceef1;color:#222}.danger{background:#b42318}.green{background:#16834a}.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}.tabs button{white-space:nowrap}.tabs .active{background:#151515;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:7px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.hidden{display:none}.login{max-width:440px;margin:65px auto}.error{color:var(--red)}.success{color:var(--green)}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:30}.modalbox{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.positive{color:var(--red);font-weight:700}.negative{color:var(--green);font-weight:700}.notice{padding:11px;border-radius:10px;background:#fff8df;color:#765900;font-size:13px}
@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.stats .full{grid-column:1/-1}.row{grid-template-columns:1fr 1fr}.row .wide{grid-column:1/-1}}
</style></head><body>
<header><b>女装门店 · 合伙账务</b><span id="userLabel"></span></header>
<div id="login" class="wrap"><div class="card login"><h2>登录</h2><p class="muted">使用 Supabase Auth 登录，账号和密码不写在网页里。</p><input id="loginAccount" placeholder="登录账号（邮箱）" autocomplete="username"><br><br><input id="loginPass" type="password" placeholder="密码" autocomplete="current-password"><br><br><button id="loginBtn">登录</button><p id="loginMsg" class="error"></p></div></div>
<div id="app" class="wrap hidden"></div><div id="modalRoot"></div>
<script>
const SUPABASE_URL='https://dqruzakkunkinecxxbny.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_igD9yDQ1KbazCNNUfnjk2Q_WBRY5J-6';
const {createClient}=supabase; const sb=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let me=null, profile=null, period='month', storeList=[];
const $=id=>document.getElementById(id);
function money(n){return '¥'+Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showMsg(t,ok=false){$('loginMsg').textContent=t;$('loginMsg').className=ok?'success':'error'}
async function loadProfile(){
 const {data,error}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();
 if(error) throw error; profile=data;
 const {data:stores,error:se}=await sb.from('stores').select('*').order('id'); if(se) throw se; storeList=stores||[];
}
async function login(){
 const account=$('loginAccount').value.trim(), password=$('loginPass').value;
 if(!account||!password){showMsg('请输入账号和密码');return}
 const {data,error}=await sb.auth.signInWithPassword({email:account,password});
 if(error){showMsg('账号或密码错误');return}
 me=data.user; try{await loadProfile();}catch(e){await sb.auth.signOut();showMsg('登录成功，但账号资料未配置：'+e.message);return}
 if(profile && profile.enabled===false){await sb.auth.signOut();showMsg('此账号已停用');return}
 enterApp();
}
async function boot(){
 const {data}=await sb.auth.getSession(); if(data.session){me=data.session.user;try{await loadProfile();enterApp()}catch(e){await sb.auth.signOut()}}
}
function enterApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=profile?.name||me.email;render()}
async function logout(){await sb.auth.signOut();location.reload()}
function render(){
 $('app').innerHTML=`<div class="actions"><button onclick="showDashboard()">门店总览</button><button class="secondary" onclick="showAccount()">账号设置</button>${profile?.role==='owner'?'<button class="secondary" onclick="showOwnerTools()">老板后台</button>':''}<button class="secondary" onclick="logout()">退出</button></div><div id="content"></div>`;showDashboard();
}
async function showDashboard(){
 const c=$('content'); c.innerHTML='<div class="card">正在读取云端数据…</div>';
 try{await loadProfile();
  if(!storeList.length){c.innerHTML='<div class="card"><h2>还没有门店</h2><p class="muted">数据库已经接通。下一步可以从老板后台新增门店。</p></div>';return}
  c.innerHTML=`<div class="tabs"><button class="${period==='month'?'active':''}" onclick="setPeriod('month')">本月</button><button class="${period==='year'?'active':''}" onclick="setPeriod('year')">本年度</button><button class="${period==='life'?'active':''}" onclick="setPeriod('life')">开业至今</button></div>${storeList.map(s=>storeCard(s)).join('')}`;
 }catch(e){c.innerHTML='<div class="card"><p class="error">读取失败：'+esc(e.message)+'</p></div>'}
}
function setPeriod(p){period=p;showDashboard()}
function storeCard(s){return `<div class="card"><div class="section-title"><h2>${esc(s.name||'未命名门店')}</h2><span class="muted">${esc(s.opening_date||s.open_date||'')}</span></div><div class="stats"><div class="stat"><div class="muted">营业额</div><div class="num">—</div></div><div class="stat"><div class="muted">公司回款</div><div class="num">—</div></div><div class="stat full"><div class="muted">盈利</div><div class="num">—</div></div><div class="stat"><div class="muted">门店留存</div><div class="num">—</div></div></div><div class="notice" style="margin-top:12px">门店已经从云端读取。月度账务接入后，这里会自动按「本月 / 本年度 / 开业至今」汇总。</div></div>`}
function showAccount(){
 $('content').innerHTML=`<div class="card"><h2>账号设置</h2><p class="muted">当前账号：${esc(me.email)}</p><label>新密码</label><br><input id="newPass" type="password" placeholder="至少 6 位"><br><br><label>再次输入</label><br><input id="newPass2" type="password"><br><br><button onclick="changePassword()">修改密码</button><p id="accountMsg"></p></div>`;
}
async function changePassword(){const a=$('newPass').value,b=$('newPass2').value;if(a.length<6){$('accountMsg').textContent='密码至少 6 位';return}if(a!==b){$('accountMsg').textContent='两次密码不一致';return}const {error}=await sb.auth.updateUser({password:a});$('accountMsg').textContent=error?'修改失败：'+error.message:'密码修改成功';$('accountMsg').className=error?'error':'success'}
function showOwnerTools(){
 $('content').innerHTML=`
 <div class="card">
   <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
     <div><h2 style="margin:0">老板后台</h2><p class="muted" style="margin:6px 0 0">门店、合伙人、股份和权限统一管理。</p></div>
     <div class="actions"><button class="green" onclick="openStoreForm()">＋ 新增门店</button><button class="secondary" onclick="showPartnerManager()">合伙人 / 股份</button></div>
   </div>
 </div>
 <div id="ownerStoreList"></div>`;
 renderOwnerStores();
}

function renderOwnerStores(){
 const box=$('ownerStoreList');
 if(!box) return;
 if(!storeList.length){
   box.innerHTML=`<div class="card"><h3>还没有门店</h3><p class="muted">点击右上角「新增门店」开始建立第一家门店。</p></div>`;
   return;
 }
 box.innerHTML=storeList.map(s=>`
   <div class="card">
     <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
       <div>
         <h3 style="margin:0 0 6px">${esc(s.name||'未命名门店')}</h3>
         <div class="muted">${s.opening_date?'开业：'+esc(s.opening_date):'未填写开业日期'}</div>
         <div class="muted" style="margin-top:4px">${esc(s.address||'未填写地址')}</div>
       </div>
       <div class="actions">
         <button class="secondary" onclick="openStoreForm(${Number(s.id)})">编辑</button>
         <button class="danger" onclick="deleteStore(${Number(s.id)})">删除</button>
       </div>
     </div>
     <div class="grid" style="margin-top:14px">
       <div class="stat"><div class="muted">初始投入</div><div class="num">${money(s.initial_investment)}</div></div>
       <div class="stat"><div class="muted">负责人</div><div class="num" style="font-size:17px">${esc(s.manager_name||'—')}</div></div>
       <div class="stat"><div class="muted">房租</div><div class="num">${money(s.rent_amount)}</div></div>
       <div class="stat"><div class="muted">押金合计</div><div class="num">${money(Number(s.rent_deposit||0)+Number(s.company_deposit||0)+Number(s.other_deposits||0))}</div></div>
     </div>
   </div>`).join('');
}

function openStoreForm(id){
 const s=id ? storeList.find(x=>Number(x.id)===Number(id)) : null;
 const title=s?'编辑门店':'新增门店';
 $('modalRoot').innerHTML=`
 <div class="modal" onclick="if(event.target===this)closeModal()">
  <div class="modalbox">
   <div style="display:flex;justify-content:space-between;align-items:center">
    <h2 style="margin:0">${title}</h2>
    <button class="secondary" onclick="closeModal()">关闭</button>
   </div>
   <p class="muted">这些是门店的长期基础资料，账务数据会单独记录。</p>
   <div class="grid">
    <div><label>门店名称 *</label><input id="st_name" value="${esc(s?.name||'')}" placeholder="例如：XX万达店"></div>
    <div><label>开业日期 *</label><input id="st_opening" type="date" value="${esc(s?.opening_date||'')}"></div>
    <div><label>初始投入 *</label><input id="st_invest" type="number" step="0.01" value="${esc(s?.initial_investment??'')}" placeholder="0"></div>
    <div><label>负责人</label><input id="st_manager" value="${esc(s?.manager_name||'')}" placeholder="负责人姓名"></div>
   </div>
   <div style="margin-top:12px"><label>门店地址</label><input id="st_address" value="${esc(s?.address||'')}" placeholder="详细地址"></div>
   <div class="grid" style="margin-top:12px">
    <div><label>房租金额</label><input id="st_rent" type="number" step="0.01" value="${esc(s?.rent_amount??'')}" placeholder="0"></div>
    <div><label>房租周期</label><select id="st_rent_cycle"><option value="monthly" ${s?.rent_cycle==='monthly'||!s?.rent_cycle?'selected':''}>每月</option><option value="quarterly" ${s?.rent_cycle==='quarterly'?'selected':''}>每季度</option><option value="half_yearly" ${s?.rent_cycle==='half_yearly'?'selected':''}>每半年</option><option value="yearly" ${s?.rent_cycle==='yearly'?'selected':''}>每年</option><option value="custom" ${s?.rent_cycle==='custom'?'selected':''}>其他</option></select></div>
    <div><label>下次房租日</label><input id="st_rent_date" type="date" value="${esc(s?.rent_payment_date||'')}"></div>
    <div><label>租赁押金</label><input id="st_rent_deposit" type="number" step="0.01" value="${esc(s?.rent_deposit??'')}" placeholder="0"></div>
    <div><label>公司押金</label><input id="st_company_deposit" type="number" step="0.01" value="${esc(s?.company_deposit??'')}" placeholder="0"></div>
    <div><label>其他押金</label><input id="st_other_deposits" type="number" step="0.01" value="${esc(s?.other_deposits??'')}" placeholder="0"></div>
    <div><label>合同开始</label><input id="st_contract_start" type="date" value="${esc(s?.contract_start_date||'')}"></div>
    <div><label>合同到期</label><input id="st_contract_end" type="date" value="${esc(s?.contract_end_date||'')}"></div>
   </div>
   <div style="margin-top:12px"><label>合同/资料链接（后续接云端上传）</label><input id="st_contract_url" value="${esc(s?.contract_url||'')}" placeholder="暂可留空"></div>
   <div style="margin-top:12px"><label>备注</label><textarea id="st_notes" rows="4" placeholder="可记录门店说明">${esc(s?.notes||'')}</textarea></div>
   <div id="storeFormMsg" style="margin-top:10px"></div>
   <div class="actions" style="margin-top:14px">
    <button class="green" onclick="saveStore(${s?Number(s.id):'null'})">${s?'保存修改':'创建门店'}</button>
    <button class="secondary" onclick="closeModal()">取消</button>
   </div>
  </div>
 </div>`;
}

function closeModal(){ $('modalRoot').innerHTML=''; }

async function saveStore(id){
 const name=$('st_name').value.trim();
 const opening_date=$('st_opening').value;
 const initial_investment=Number($('st_invest').value||0);
 const address=$('st_address').value.trim();
 const manager_name=$('st_manager').value.trim();
 const notes=$('st_notes').value.trim();
 const rent_amount=Number($('st_rent').value||0);
 const rent_cycle=$('st_rent_cycle').value;
 const rent_payment_date=$('st_rent_date').value||null;
 const rent_deposit=Number($('st_rent_deposit').value||0);
 const company_deposit=Number($('st_company_deposit').value||0);
 const other_deposits=Number($('st_other_deposits').value||0);
 const contract_start_date=$('st_contract_start').value||null;
 const contract_end_date=$('st_contract_end').value||null;
 const contract_url=$('st_contract_url').value.trim()||null;
 const msg=$('storeFormMsg');
 if(!name || !opening_date){msg.className='error';msg.textContent='门店名称和开业日期必须填写';return}
 if(initial_investment<0){msg.className='error';msg.textContent='初始投入不能为负数';return}
 msg.className='muted';msg.textContent='正在保存…';
 const payload={name,opening_date,initial_investment,address,manager_name,notes,rent_amount,rent_cycle,rent_payment_date,rent_deposit,company_deposit,other_deposits,contract_start_date,contract_end_date,contract_url};
 let result;
 if(id){
   result=await sb.from('stores').update(payload).eq('id',id).eq('owner_id',me.id).select().single();
 }else{
   payload.owner_id=me.id;
   result=await sb.from('stores').insert(payload).select().single();
 }
 if(result.error){msg.className='error';msg.textContent='保存失败：'+result.error.message;return}
 await loadProfile();
 closeModal();
 showOwnerTools();
}


async function showPartnerManager(){
 const a=$('ownerArea'); a.innerHTML='<div class="card">正在读取合伙人…</div>';
 const [{data:users,error:ue},{data:members,error:me2}]=await Promise.all([
   sb.from('profiles').select('id,name,role,enabled,username').order('name'),
   sb.from('store_members').select('store_id,user_id,share_percent')
 ]);
 if(ue||me2){a.innerHTML='<p class="error">读取失败：'+esc((ue||me2).message)+'</p>';return}
 const partners=(users||[]).filter(u=>u.role!=='owner');
 a.innerHTML=`<div class="card"><h3>合伙人 / 股份</h3>
 <p class="muted">先在 Authentication → Users 创建登录账号，再在这里分配门店和每店股份。</p>
 <div class="notice">密码不存网页；密码创建、重置由 Supabase Auth 管理。</div></div>
 ${partners.length?partners.map(u=>{
   const ms=(members||[]).filter(m=>m.user_id===u.id);
   return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
   <div><h3 style="margin:0">${esc(u.name||'未命名')}</h3><div class="muted">${esc(u.username||'未设置账号名')} · ${u.enabled===false?'已停用':'正常'}</div></div>
   <button class="secondary" onclick="openPartner('${u.id}')">管理</button></div>
   <div class="muted" style="margin-top:10px">${ms.length?ms.map(m=>{const st=storeList.find(s=>String(s.id)===String(m.store_id));return esc(st?.name||'门店')+' '+Number(m.share_percent||0)+'%'}).join('　'):'尚未分配门店'}</div></div>`
 }).join(''):'<div class="card"><p class="muted">目前还没有合伙人账号。</p></div>'}`;
}
async function openPartner(userId){
 const {data:p,error}=await sb.from('profiles').select('*').eq('id',userId).single();
 if(error){alert(error.message);return}
 const {data:ms}=await sb.from('store_members').select('store_id,share_percent').eq('user_id',userId);
 const mm=Object.fromEntries((ms||[]).map(x=>[String(x.store_id),x]));
 const storesHtml=storeList.map(s=>`<div class="card" style="margin:8px 0;padding:12px">
   <label style="display:flex;align-items:center;gap:9px"><input style="width:auto" type="checkbox" id="pm_${s.id}" ${mm[String(s.id)]?'checked':''}> <b>${esc(s.name)}</b></label>
   <div style="margin-top:8px"><label>股份比例 %</label><input id="pct_${s.id}" type="number" min="0" max="100" step="0.01" value="${mm[String(s.id)]?Number(mm[String(s.id)].share_percent):0}"></div>
 </div>`).join('');
 modal(`<h2>管理合伙人</h2><div class="muted">${esc(p.name||'未命名')} · ${esc(p.username||'')}</div>
 <div style="margin-top:12px"><label>显示名称</label><input id="pm_name" value="${esc(p.name||'')}"></div>
 <div style="margin-top:12px"><label>账号备注名</label><input id="pm_username" value="${esc(p.username||'')}"></div>
 <div style="margin-top:12px"><label><input style="width:auto" type="checkbox" id="pm_enabled" ${p.enabled!==false?'checked':''}> 启用账号</label></div>
 <h3>门店与股份</h3>${storesHtml}<p id="pmMsg"></p>
 <div class="actions"><button class="green" onclick="savePartner('${userId}')">保存</button><button class="secondary" onclick="closeModal()">取消</button></div>`);
}
async function savePartner(userId){
 const msg=$('pmMsg');
 const payload={name:$('pm_name').value.trim()||null,username:$('pm_username').value.trim()||null,enabled:$('pm_enabled').checked};
 const {error:pe}=await sb.from('profiles').update(payload).eq('id',userId);
 if(pe){msg.className='error';msg.textContent='保存失败：'+pe.message;return}
 for(const s of storeList){
   const checked=$('pm_'+s.id).checked, pct=Number($('pct_'+s.id).value||0);
   if(checked){
     if(pct<0||pct>100){msg.className='error';msg.textContent='股份必须在 0～100%';return}
     const {error}=await sb.from('store_members').upsert({store_id:s.id,user_id:userId,share_percent:pct},{onConflict:'store_id,user_id'});
     if(error){msg.className='error';msg.textContent='股份保存失败：'+error.message;return}
   }else{
     const {error}=await sb.from('store_members').delete().eq('store_id',s.id).eq('user_id',userId);
     if(error){msg.className='error';msg.textContent='取消门店失败：'+error.message;return}
   }
 }
 closeModal(); showPartnerManager();
}

async function deleteStore(id){
 const s=storeList.find(x=>Number(x.id)===Number(id));
 if(!s) return;
 if(!confirm('确定删除「'+(s.name||'这家门店')+'」吗？\\n如果以后已经录入账务，建议先不要删除。')) return;
 const {error}=await sb.from('stores').delete().eq('id',id).eq('owner_id',me.id);
 if(error){alert('删除失败：'+error.message);return}
 await loadProfile();
 showOwnerTools();
}
$('loginBtn').addEventListener('click',login);$('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});boot();
</script></body></html>
